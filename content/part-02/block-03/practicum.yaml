    solution: |
      from itertools import islice

      LEVELS = {"DEBUG", "INFO", "WARNING", "ERROR"}


      def parse_line(line):
          """Разобрать строку лога или вернуть None."""
          parts = line.split(maxsplit=4)
          if len(parts) < 4:
              return None
          ts, level, service, ms = parts[:4]
          if level not in LEVELS or not ms.isdigit():
              return None
          message = parts[4].strip() if len(parts) == 5 else ""
          return {"ts": ts, "level": level, "service": service, "ms": int(ms), "message": message}


      def read_lines(path):
          """Строки файла без перевода строки."""
          with open(path, encoding="utf-8") as file:
              for line in file:
                  yield line.rstrip("\n")


      def parse(lines, levels=None):
          """Корректные записи, при необходимости — только заданных уровней."""
          for line in lines:
              record = parse_line(line)
              if record is None:
                  continue
              if levels is not None and record["level"] not in levels:
                  continue
              yield record


      def batches(records, size):
          """Списки по size записей."""
          iterator = iter(records)
          while True:
              batch = list(islice(iterator, size))
              if not batch:
                  return
              yield batch


      def process(lines, batch_size, levels=None):
          """Сводки по батчам записей."""
          for number, batch in enumerate(batches(parse(lines, levels), batch_size), start=1):
              total_ms = sum(record["ms"] for record in batch)
              slowest = max(batch, key=lambda record: record["ms"])
              yield {
                  "batch": number,
                  "count": len(batch),
                  "errors": sum(1 for record in batch if record["level"] == "ERROR"),
                  "avg_ms": round(total_ms / len(batch), 1),
                  "slowest": slowest["service"],
              }


      def summarize(summaries):
          """Общий итог по сводкам за один проход."""
          batches_count = records = errors = 0
          weighted_ms = 0.0
          for summary in summaries:
              batches_count += 1
              records += summary["count"]
              errors += summary["errors"]
              weighted_ms += summary["avg_ms"] * summary["count"]
          avg_ms = round(weighted_ms / records, 1) if records else 0.0
          return {"batches": batches_count, "records": records, "errors": errors, "avg_ms": avg_ms}
    solution_explanation: |
      Конвейер целиком ленивый: `read_lines` → `parse` → `batches` → `process` → `summarize`. В памяти одновременно — одна строка файла и один батч записей, поэтому обработчик справится и с логом на десятки гигабайт.

      Приёмы из блока:

      - `split(maxsplit=4)` отделяет четыре служебных поля, сохраняя пробелы в сообщении;
      - `parse` — фильтр-преобразователь, работающий с любым источником строк: файлом, списком в тесте, сетевым потоком;
      - `batches` — `islice` по одному итератору;
      - `summarize` — однопроходная агрегация с накопителями, потому что сводки приходят генератором.

      Небольшая неточность: `avg_ms` в сводках округлены, поэтому общий средний — приблизительный. Для точного значения в сводку можно добавить сумму `ms`.
    tests:
      - name: "parse_line"
        call: "parse_line(\"2024-05-01T10:00:01 ERROR embed 950 timeout from provider\")"
        expected: "{'ts': '2024-05-01T10:00:01', 'level': 'ERROR', 'service': 'embed', 'ms': 950, 'message': 'timeout from provider'}"
      - name: "Некорректные строки"
        call: "[parse_line(s) for s in (\"\", \"t INFO api\", \"t FATAL api 10\", \"t INFO api 1.5 x\")]"
        expected: "[None, None, None, None]"
      - name: "Без сообщения"
        call: "parse_line(\"t INFO api 12\")[\"message\"]"
        expected: "''"
      - name: "Сводки по батчам"
        code: |
          lines = [
              "t1 INFO chat 100 ok",
              "t2 ERROR embed 900 timeout",
              "мусор",
              "t3 INFO chat 50",
              "t4 ERROR chat 300 boom",
              "t5 DEBUG search 10 x",
          ]
          result = list(process(lines, 2))
          assert result == [
              {"batch": 1, "count": 2, "errors": 1, "avg_ms": 500.0, "slowest": "embed"},
              {"batch": 2, "count": 2, "errors": 1, "avg_ms": 175.0, "slowest": "chat"},
              {"batch": 3, "count": 1, "errors": 0, "avg_ms": 10.0, "slowest": "search"},
          ], result
      - name: "Фильтр уровней и summarize"
        code: |
          lines = ["a ERROR x 100", "b INFO y 1", "c ERROR z 300", "d WARNING w 50"]
          summary = summarize(process(lines, 10, levels={"ERROR", "WARNING"}))
          assert summary == {"batches": 1, "records": 3, "errors": 2, "avg_ms": 150.0}, summary
          assert summarize(iter([])) == {"batches": 0, "records": 0, "errors": 0, "avg_ms": 0.0}
      - name: "Файл"
        code: |
          with open("app.log", "w", encoding="utf-8") as f:
              f.write("t1 INFO chat 100 hi\nt2 ERROR embed 300 fail\n\nt3 INFO chat 200\n")
          assert list(read_lines("app.log"))[0] == "t1 INFO chat 100 hi"
          summary = summarize(process(read_lines("app.log"), 2))
          assert summary == {"batches": 2, "records": 3, "errors": 1, "avg_ms": 200.0}, summary
      - name: "Ленивость"
        code: |
          def lines():
              yield "t1 INFO a 10"
              yield "t2 INFO b 20"
              raise RuntimeError("обработчик прочитал лишнее")
          first = next(process(lines(), 2))
          assert first["count"] == 2 and first["slowest"] == "b"
      - name: "Генераторы"
        code: |
          import inspect
          for fn in (read_lines, parse, batches, process):
              assert inspect.isgeneratorfunction(fn), f"{fn.__name__} должен быть генератором"
