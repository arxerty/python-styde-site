      - input: "parse_line(\"2024-05-01T10:00:01 ERROR embed 950 timeout from provider\")"
        output: "{'ts': '2024-05-01T10:00:01', 'level': 'ERROR', 'service': 'embed', 'ms': 950, 'message': 'timeout from provider'}"
