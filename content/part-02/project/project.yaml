        """Асинхронный клиент Frankfurter API."""

        import asyncio
        import datetime as dt
        import logging

        import httpx
        from pydantic import ValidationError

        from fxcli.config import Settings
        from fxcli.models import Currencies, Rates, TimeSeries

        logger = logging.getLogger(__name__)


        class ApiError(Exception):
            """Ошибка обращения к API; retryable — имеет ли смысл повторить запрос."""

            def __init__(self, message: str, status: int | None = None, retryable: bool = False) -> None:
                super().__init__(message)
                self.status = status
                self.retryable = retryable


        def _error_message(response: httpx.Response) -> str:
            try:
                data = response.json()
            except ValueError:
                data = None
            if isinstance(data, dict) and data.get("message"):
                return str(data["message"])
            return response.reason_phrase or "ошибка"


        class FxClient:
            """Клиент API курсов валют. Используется как async with FxClient(settings) as client."""

            def __init__(self, settings: Settings, http=None) -> None:
                self.settings = settings
                self._http = http
                self._owns_http = http is None

            async def __aenter__(self) -> "FxClient":
                if self._http is None:
                    self._http = httpx.AsyncClient(base_url=self.settings.base_url, timeout=self.settings.timeout)
                return self

            async def __aexit__(self, *exc_info) -> None:
                if self._owns_http and self._http is not None:
                    await self._http.aclose()
                    self._http = None

            async def get_json(self, path: str, params: dict | None = None):
                """GET-запрос; возвращает разобранный JSON."""
                params = {key: value for key, value in (params or {}).items() if value not in (None, "")}
                return await self._get_once(path, params)

            async def _get_once(self, path: str, params: dict):
                if self._http is None:
                    raise RuntimeError("используйте клиент внутри async with")
                logger.debug("GET %s %s", path, params)
                try:
                    response = await self._http.get(path, params=params)
                except httpx.TimeoutException as error:
                    raise ApiError("сервер не ответил вовремя", retryable=True) from error
                except httpx.TransportError as error:
                    raise ApiError(f"сетевая ошибка: {error}", retryable=True) from error
                if response.status_code == 200:
                    return response.json()
                retryable = response.status_code == 429 or response.status_code >= 500
                raise ApiError(
                    f"HTTP {response.status_code}: {_error_message(response)}",
                    status=response.status_code,
                    retryable=retryable,
                )

            @staticmethod
            def _validate(model, data):
                try:
                    return model.model_validate(data)
                except ValidationError as error:
                    raise ApiError(f"неожиданный ответ API: {error.error_count()} ошибок формата") from error

            async def latest(self, base: str, symbols=()) -> Rates:
                """Последние курсы base к валютам symbols (пусто — ко всем)."""
                data = await self.get_json("/latest", {"base": base, "symbols": ",".join(symbols)})
                return self._validate(Rates, data)

            async def historical(self, day: dt.date, base: str, symbols=()) -> Rates:
                """Курсы на дату day."""
                data = await self.get_json(f"/{day.isoformat()}", {"base": base, "symbols": ",".join(symbols)})
                return self._validate(Rates, data)

            async def timeseries(self, start: dt.date, end: dt.date, base: str, symbols=()) -> TimeSeries:
                """Курсы за период от start до end включительно."""
                if end < start:
                    raise ValueError("дата окончания раньше даты начала")
                path = f"/{start.isoformat()}..{end.isoformat()}"
                data = await self.get_json(path, {"base": base, "symbols": ",".join(symbols)})
                return self._validate(TimeSeries, data)

            async def currencies(self) -> Currencies:
                """Все поддерживаемые валюты."""
                return self._validate(Currencies, await self.get_json("/currencies"))

            async def latest_many(self, bases, symbols=()) -> dict[str, Rates]:
                """Последние курсы для нескольких базовых валют — запросы идут одновременно."""
                results = await asyncio.gather(*(self.latest(base, symbols) for base in bases))
                return dict(zip(bases, results, strict=True))
    solution_explanation: 'Клиент — граница между программой и сетью: всё разнообразие сбоев (статусы, таймауты, обрывы, неверный JSON) сводится к одному ApiError с признаком retryable, на который опирается следующий этап. Внедрённый httpx-клиент делает код тестируемым без сети, а latest_many показывает главное преимущество async — одновременные запросы.'
  criteria:
  - Ни один тест не обращается к настоящему API
  - Клиент не печатает в консоль — только возвращает данные, бросает исключения и пишет в лог
- id: stage-05
  title: Декоратор @retry
  description: |
    Сетевые сервисы иногда отвечают 429 (слишком много запросов), 503 (перегружен) или не отвечают вовремя. Такие ошибки временные: через секунду тот же запрос пройдёт. Повторы с **экспоненциальной паузой** (0.5 с, 1 с, 2 с…) — стандартный приём, который вы встречали в блоках 2.3 и 2.7.

    Сделаем повторы отдельным переиспользуемым декоратором, а клиент просто применит его к своему методу запроса. Признак `retryable` у `ApiError` из прошлого этапа говорит декоратору, имеет ли смысл повторять: 404 повторять бессмысленно.
  hints:
  - Функция паузы передаётся параметром `sleep` (по умолчанию `asyncio.sleep`) — тесты подставляют подделку, которая только записывает паузы, и не ждут по-настоящему.
  tasks:
  - id: t1
    title: retry и повторы в клиенте
    mode: local
    difficulty: 2
    statement: |
      1. В `src/fxcli/retry.py` реализуйте фабрику декораторов **`retry(attempts=3, base_delay=0.5, max_delay=8.0, retry_on=(Exception,), sleep=asyncio.sleep)`** для **async**-функций:
         - всего не больше `attempts` вызовов; `attempts < 1` → `ValueError` (сразу при создании декоратора);
         - повтор, если исключение — экземпляр `retry_on` **и** его атрибут `retryable` (если он есть) истинен; иначе исключение пробрасывается сразу;
         - пауза перед повтором номер k (k = 1, 2, …) — `min(base_delay * 2 ** (k - 1), max_delay)`, через `await sleep(пауза)`;
         - на каждый повтор — одно сообщение уровня WARNING в логгер `logging.getLogger(__name__)`;
         - после последней неудачной попытки пробрасывается последняя ошибка;
         - `functools.wraps` сохраняет имя и docstring.
      2. В `client.py` добавьте в `FxClient` параметр `sleep=asyncio.sleep` и примените повторы к одиночному запросу: `retry(attempts=settings.retries + 1, retry_on=(ApiError,), sleep=sleep)`. `retries` — число **повторов**, поэтому попыток на одну больше.
