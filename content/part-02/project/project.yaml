        """Этап 5: декоратор @retry и повторы в клиенте."""

        import asyncio
        import logging

        import httpx
        import pytest
        from conftest import LATEST_USD

        from fxcli.client import ApiError, FxClient
        from fxcli.retry import retry


        class Temporary(Exception):
            retryable = True


        class Permanent(Exception):
            retryable = False


        def make_sleep():
            delays = []

            async def fake_sleep(delay):
                delays.append(delay)

            return fake_sleep, delays


        def flaky(failures, error=Temporary):
            calls = []

            async def func(value):
                calls.append(value)
                if len(calls) <= failures:
                    raise error("сбой")
                return value * 2

            return func, calls


        def test_succeeds_after_failures():
            sleep, delays = make_sleep()
            func, calls = flaky(2)
            wrapped = retry(attempts=3, sleep=sleep)(func)
            assert asyncio.run(wrapped(21)) == 42
            assert len(calls) == 3
            assert delays == [0.5, 1.0]


        def test_delays_are_capped():
            sleep, delays = make_sleep()
            func, _ = flaky(4)
            asyncio.run(retry(attempts=5, base_delay=1, max_delay=3, sleep=sleep)(func)(1))
            assert delays == [1, 2, 3, 3]


        def test_gives_up_with_last_error():
            sleep, delays = make_sleep()
            func, calls = flaky(10)
            with pytest.raises(Temporary):
                asyncio.run(retry(attempts=3, sleep=sleep)(func)(1))
            assert len(calls) == 3 and len(delays) == 2


        def test_not_retryable_error_is_raised_immediately():
            sleep, delays = make_sleep()
            func, calls = flaky(1, error=Permanent)
            with pytest.raises(Permanent):
                asyncio.run(retry(attempts=3, sleep=sleep)(func)(1))
            assert len(calls) == 1 and delays == []


        def test_only_listed_exceptions_are_retried():
            sleep, _ = make_sleep()
            func, calls = flaky(1, error=KeyError)
            with pytest.raises(KeyError):
                asyncio.run(retry(attempts=3, retry_on=(Temporary,), sleep=sleep)(func)(1))
            assert len(calls) == 1


        def test_single_attempt_and_validation():
            sleep, delays = make_sleep()
            func, calls = flaky(1)
            with pytest.raises(Temporary):
                asyncio.run(retry(attempts=1, sleep=sleep)(func)(1))
            assert len(calls) == 1 and delays == []
            with pytest.raises(ValueError):
                retry(attempts=0)


        def test_wraps_and_logs(caplog):
            sleep, _ = make_sleep()

            async def fetch_rates():
                """Документация."""
                raise Temporary("503")

            wrapped = retry(attempts=2, sleep=sleep)(fetch_rates)
            assert wrapped.__name__ == "fetch_rates" and wrapped.__doc__ == "Документация."
            caplog.set_level(logging.WARNING, logger="fxcli")
            with pytest.raises(Temporary):
                asyncio.run(wrapped())
            warnings = [record for record in caplog.records if record.levelno == logging.WARNING]
            assert len(warnings) == 1, "На каждый повтор — одно предупреждение в лог"
            assert warnings[0].name.startswith("fxcli")


        def client_call(settings, api, retries, sleep):
            async def scenario():
                async with FxClient(settings.model_copy(update={"retries": retries}), http=api.http(), sleep=sleep) as client:
                    return await client.latest("USD")

            return asyncio.run(scenario())


        def test_client_retries_temporary_errors(settings, fake_api):
            sleep, delays = make_sleep()
            fake_api.add("/latest", (503, {}), (429, {}), (200, LATEST_USD))
            rates = client_call(settings, fake_api, retries=2, sleep=sleep)
            assert rates.base == "USD"
            assert len(fake_api.calls) == 3
            assert delays == [0.5, 1.0]


        def test_client_retries_timeouts(settings, fake_api):
            sleep, _ = make_sleep()

            def timeout(request):
                raise httpx.ConnectTimeout("timeout", request=request)

            fake_api.add("/latest", timeout, (200, LATEST_USD))
            assert client_call(settings, fake_api, retries=1, sleep=sleep).base == "USD"
            assert len(fake_api.calls) == 2


        def test_client_does_not_retry_404(settings, fake_api):
            sleep, delays = make_sleep()
            fake_api.add("/latest", (404, {"message": "not found"}))
            with pytest.raises(ApiError):
                client_call(settings, fake_api, retries=3, sleep=sleep)
            assert len(fake_api.calls) == 1 and delays == []


        def test_client_gives_up(settings, fake_api):
            sleep, _ = make_sleep()
            fake_api.add("/latest", (500, {}))
            with pytest.raises(ApiError) as info:
                client_call(settings, fake_api, retries=2, sleep=sleep)
            assert info.value.status == 500
            assert len(fake_api.calls) == 3, "retries=2 означает 1 попытку + 2 повтора"
