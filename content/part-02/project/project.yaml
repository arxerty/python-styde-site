        """Этап 6: файловый кэш с TTL и его подключение к клиенту."""

        import asyncio
        import json
        import logging

        import pytest
        from conftest import LATEST_USD

        from fxcli.cache import FileCache
        from fxcli.client import FxClient


        class Clock:
            def __init__(self, now=1000.0):
                self.now = now

            def __call__(self):
                return self.now


        def test_set_and_get(tmp_path):
            cache = FileCache(tmp_path / "cache", ttl=60, clock=Clock())
            assert cache.get("k") is None
            cache.set("k", {"курс": 0.92, "список": [1, 2]})
            assert cache.get("k") == {"курс": 0.92, "список": [1, 2]}
            assert len(list((tmp_path / "cache").glob("*.json"))) == 1


        def test_directory_created_lazily(tmp_path):
            cache = FileCache(tmp_path / "a" / "b", ttl=60)
            assert not (tmp_path / "a").exists()
            cache.set("k", 1)
            assert (tmp_path / "a" / "b").is_dir()


        def test_entries_expire(tmp_path):
            clock = Clock()
            cache = FileCache(tmp_path, ttl=60, clock=clock)
            cache.set("k", "v")
            clock.now += 59.9
            assert cache.get("k") == "v"
            clock.now += 0.1
            assert cache.get("k") is None, "Запись живёт ровно ttl секунд"


        def test_ttl_zero_disables_cache(tmp_path):
            cache = FileCache(tmp_path / "cache", ttl=0)
            cache.set("k", "v")
            assert cache.get("k") is None
            assert not (tmp_path / "cache").exists()


        def test_different_keys(tmp_path):
            cache = FileCache(tmp_path, ttl=60)
            cache.set("/latest?base=USD", 1)
            cache.set("/latest?base=EUR", 2)
            assert (cache.get("/latest?base=USD"), cache.get("/latest?base=EUR")) == (1, 2)


        def test_corrupted_entry(tmp_path, caplog):
            cache = FileCache(tmp_path, ttl=60)
            cache.set("k", "v")
            path = next(tmp_path.glob("*.json"))
            path.write_text("{не json", encoding="utf-8")
            caplog.set_level(logging.WARNING)
            assert cache.get("k") is None
            assert any(record.levelno == logging.WARNING for record in caplog.records), "Сообщите о повреждённой записи в лог"


        def test_entry_format(tmp_path):
            cache = FileCache(tmp_path, ttl=60, clock=Clock(5.0))
            cache.set("k", [1])
            entry = json.loads(next(tmp_path.glob("*.json")).read_text(encoding="utf-8"))
            assert entry == {"key": "k", "saved_at": 5.0, "value": [1]}


        def test_clear(tmp_path):
            cache = FileCache(tmp_path / "cache", ttl=60)
            assert cache.clear() == 0
            cache.set("a", 1)
            cache.set("b", 2)
            assert cache.clear() == 2
            assert cache.get("a") is None


        def test_negative_ttl(tmp_path):
            with pytest.raises(ValueError):
                FileCache(tmp_path, ttl=-1)


        async def two_requests(settings, api, cache, first=("USD",), second=("USD",)):
            async with FxClient(settings, http=api.http(), cache=cache) as client:
                await client.latest(*first)
                return await client.latest(*second)


        def test_client_uses_cache(settings, fake_api, tmp_path):
            cache = FileCache(tmp_path / "c", ttl=60)
            rates = asyncio.run(two_requests(settings, fake_api, cache))
            assert rates.rates["EUR"] == 0.92
            assert len(fake_api.calls) == 1, "Повторный одинаковый запрос должен браться из кэша"


        def test_cache_key_includes_params(settings, fake_api, tmp_path):
            cache = FileCache(tmp_path / "c", ttl=60)
            asyncio.run(two_requests(settings, fake_api, cache, first=("USD", ["EUR"]), second=("USD", ["GBP"])))
            assert len(fake_api.calls) == 2


        def test_cache_survives_new_client(settings, fake_api, tmp_path):
            asyncio.run(two_requests(settings, fake_api, FileCache(tmp_path / "c", ttl=60)))
            asyncio.run(two_requests(settings, fake_api, FileCache(tmp_path / "c", ttl=60)))
            assert len(fake_api.calls) == 1, "Кэш хранится на диске и переживает перезапуск"


        def test_errors_are_not_cached(settings, fake_api, tmp_path):
            fake_api.add("/latest", (404, {"message": "not found"}), (200, LATEST_USD))
            cache = FileCache(tmp_path / "c", ttl=60)

            async def scenario():
                async with FxClient(settings, http=fake_api.http(), cache=cache) as client:
                    try:
                        await client.latest("USD")
                    except Exception:
                        pass
                    return await client.latest("USD")

            assert asyncio.run(scenario()).base == "USD"
            assert len(fake_api.calls) == 2


        def test_client_without_cache(settings, fake_api):
            asyncio.run(two_requests(settings, fake_api, None))
            assert len(fake_api.calls) == 2
