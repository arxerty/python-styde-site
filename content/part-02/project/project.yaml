            rates = run(call(settings, fake_api, "historical", dt.date(2026, 1, 2), "USD", ["EUR"]))
            assert rates.date == dt.date(2026, 1, 2)
            assert fake_api.calls == [("/2026-01-02", {"base": "USD", "symbols": "EUR"})]


