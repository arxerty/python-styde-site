    statement: |
      Перепишите `src/fxcli/cli.py`:

      - **`build_parser()`** — глобальные ключи и четыре подкоманды из таблицы.
      - **`setup_logging(level)`** — `logging.basicConfig(level=level, stream=sys.stderr, format="%(levelname)s %(name)s: %(message)s", force=True)`; логгер `httpx` — не подробнее WARNING, если уровень не DEBUG.
      - **`make_client(settings, no_cache=False)`** — `FxClient(settings, cache=...)`: `FileCache(settings.cache_dir, settings.cache_ttl)`, либо `None`, если `no_cache` или `cache_ttl == 0`.
      - **`main(argv=None, client_factory=None, today=None) -> int`**:
        1. разобрать аргументы; загрузить настройки `load_settings(args.env_file)`; `ConfigError` → `Ошибка конфигурации: ...` в stderr, код 2;
        2. настроить логирование: DEBUG при `-v`, иначе `settings.log_level`;
        3. `client_factory(settings)` — асинхронный контекстный менеджер клиента; по умолчанию — `make_client(settings, no_cache=args.no_cache)`;
        4. выполнить команду через `asyncio.run(...)`: коды валют пропустить через `normalize_code`; `history` без `--end` — до `today` (по умолчанию `date.today()`);
        5. ошибки: `ApiError` → `Ошибка API: ...`, `KeyError` (валюты нет в ответе) → сообщение с кодом валюты, `ValueError` (неверный код и т. п.) → `Ошибка: ...`; всё в stderr, код 1;
        6. при успехе напечатать строки результата в stdout и вернуть 0.

