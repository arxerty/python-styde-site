        def fake_api() -> FakeApi:
            api = FakeApi()
            api.add("/latest", (200, LATEST_USD))
            api.add("/currencies", (200, CURRENCIES))
            api.add("/2026-01-02", (200, HISTORICAL_USD))
            api.add("/2026-10-01..2026-10-05", (200, SERIES_USD_EUR))
