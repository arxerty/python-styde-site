        """Этап 4: асинхронный клиент API на httpx."""

        import asyncio
        import datetime as dt

        import httpx
        import pytest
        from conftest import FakeApi

        from fxcli.client import ApiError, FxClient
        from fxcli.models import Currencies, Rates, TimeSeries


        def run(coro):
            return asyncio.run(coro)


        async def call(settings, api, method, *args):
            async with FxClient(settings, http=api.http()) as client:
                return await getattr(client, method)(*args)


        def test_latest(settings, fake_api):
            rates = run(call(settings, fake_api, "latest", "USD", ["EUR", "GBP"]))
            assert isinstance(rates, Rates) and rates.rates["EUR"] == 0.92
            assert fake_api.calls == [("/latest", {"base": "USD", "symbols": "EUR,GBP"})]


