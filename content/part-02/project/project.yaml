        """Командная строка fxcli."""

        import argparse

        from fxcli import __version__


        def build_parser() -> argparse.ArgumentParser:
            """Аргументы командной строки."""
            parser = argparse.ArgumentParser(prog="fxcli", description="Курсы валют в терминале")
            parser.add_argument("--version", action="version", version=f"fxcli {__version__}")
            return parser


        def main(argv=None) -> int:
            """Точка входа. Команды появятся на этапе 7."""
            build_parser().parse_args(argv)
            print("fxcli: команды появятся на следующих этапах, попробуйте --version")
            return 0
    solution_explanation: 'Каркас по уроку 2.8.4: метаданные и зависимости — в pyproject.toml, версия — в __init__.py, логика запуска — в cli.main, которая принимает argv параметром и поэтому тестируется без запуска процесса. __main__.py и [project.scripts] дают два способа запуска одной функции.'
