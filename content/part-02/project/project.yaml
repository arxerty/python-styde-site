title: CLI-утилита для работы с API курсов валют
mode: local
description: |
  **Проект части 2.** Вы соберёте `fxcli` — консольную утилиту для курсов валют, устроенную как настоящий профессиональный Python-пакет. В ней сходятся все темы части: классы и декораторы, типизация, асинхронные запросы, Pydantic, конфигурация через `.env`, логирование, тесты с моками, структура пакета и `pyproject.toml`.

  Данные берутся из бесплатного публичного API [Frankfurter](https://frankfurter.dev) (курсы Европейского центробанка, ключ не нужен):

  | Запрос | Ответ |
  |---|---|
  | `GET /latest?base=USD&symbols=EUR,GBP` | `{"amount": 1.0, "base": "USD", "date": "2026-10-16", "rates": {"EUR": 0.92, "GBP": 0.79}}` |
  | `GET /2026-01-02?base=USD` | то же на дату |
  | `GET /2026-10-01..2026-10-05?base=USD&symbols=EUR` | `{"amount": 1.0, "base": "USD", "start_date": ..., "end_date": ..., "rates": {"2026-10-01": {"EUR": 0.9}, ...}}` |
  | `GET /currencies` | `{"EUR": "Euro", "USD": "United States Dollar", ...}` |

  **Что получится в итоге:**

  ```text
  $ fxcli rates USD --to EUR GBP
  Курсы USD на 2026-10-16
    EUR  0.9200
    GBP  0.7900
  $ fxcli convert 100 USD EUR
  100.00 USD = 92.00 EUR (курс 0.9200 на 2026-10-16)
  $ fxcli history USD EUR --start 2026-10-01 --end 2026-10-05
  2026-10-01  0.9000
  2026-10-02  0.9200
  2026-10-05  0.9300
  мин 0.9000  макс 0.9300  среднее 0.9167  изменение +3.33%
  ```

  **Архитектура** — слои с чёткими обязанностями, каждый тестируется отдельно:

  ```text
  cli.py ──► client.py ──► httpx (сеть)
    │          ├── retry.py   повторы при 429/5xx/таймаутах
    │          ├── cache.py   файловый кэш с TTL
    │          └── models.py  Pydantic-модели ответов
    └── config.py  настройки из .env и окружения
  ```

  **Как устроен проект.** 8 этапов, каждый — локальное задание с архивом. В архиве этапа N лежит весь проект: модули прошлых этапов в эталонном виде, заготовка модуля текущего этапа и тесты всех этапов с 1 по N. Можно работать двумя способами:

  - вести свой проект в одной папке (лучше — в git-репозитории) и из каждого нового архива копировать только новые файлы тестов `tests/test_stageN_*.py`;
  - или каждый раз начинать с архива этапа — тогда прошлые модули будут эталонными.

  Условие этапа лежит в архиве в файле TASK.md, а README.md — это README самого проекта, который вы допишете на этапе 8.

  Тесты **не ходят в сеть**: API подменяется через `httpx.MockTransport` и `unittest.mock`. Настоящий API понадобится, только когда вы сами запустите `fxcli`.

  Подготовка окружения (один раз):

  ```bash
  python -m venv .venv
  source .venv/bin/activate        # Windows: .venv\Scripts\activate
  pip install httpx pydantic python-dotenv pytest ruff
  ```

  После этапа 1 достаточно `pip install -e ".[dev]"` в папке проекта.
requirements:
- Пакет `fxcli` в src-раскладке с `pyproject.toml`, консольной командой `fxcli` и запуском через `python -m fxcli`
- Конфигурация через `.env` и переменные окружения `FXCLI_*` с проверкой значений (Pydantic)
- Pydantic-модели ответов API с валидацией кодов валют и курсов
- Асинхронные запросы через `httpx.AsyncClient`, одновременные запросы через `asyncio.gather`
- Декоратор `@retry` с экспоненциальной паузой для временных ошибок (429, 5xx, таймауты)
- Файловый кэш ответов с временем жизни (TTL)
- Логирование через `logging` в stderr, результат — в stdout
- Тесты pytest с моками (без сети), README, `.gitignore`, чистый код по ruff
stages:
- id: stage-01
  title: Структура пакета и pyproject.toml
  description: |
    Начнём с каркаса: пакет, который можно установить, запустить через `python -m` и вызвать командой `fxcli`.

    ```text
    fxcli/
    ├── pyproject.toml
    ├── README.md
    ├── src/fxcli/
    │   ├── __init__.py     # __version__
    │   ├── __main__.py     # python -m fxcli
    │   └── cli.py          # main(argv=None) -> int
    └── tests/
    ```

    Этот этап закрепляет урок 2.8.4: src-раскладка, `pyproject.toml`, точка входа `[project.scripts]`.
  hints:
  - Тесты сами добавляют `src` в путь поиска модулей (см. `tests/conftest.py`), поэтому устанавливать пакет для них не обязательно. Но попробуйте `pip install -e ".[dev]"` и команду `fxcli --version` — это и есть цель этапа.
  tasks:
  - id: t1
    title: Каркас пакета fxcli
    mode: local
    difficulty: 1
    statement: |
      Создайте каркас пакета:

      1. **`pyproject.toml`**: `[project]` с `name = "fxcli"`, версией `0.1.0`, `requires-python = ">=3.11"` и зависимостями `httpx`, `pydantic`, `python-dotenv` (с разумными диапазонами версий); группа `[project.optional-dependencies]` `dev` с `pytest` и `ruff`; команда `fxcli = "fxcli.cli:main"` в `[project.scripts]`; секция `[build-system]` (например, hatchling).
      2. **`src/fxcli/__init__.py`** — docstring и `__version__ = "0.1.0"` (та же версия, что в `pyproject.toml`).
      3. **`src/fxcli/cli.py`** — `build_parser()` с `argparse` и ключом `--version` (печатает `fxcli 0.1.0`), и `main(argv=None) -> int`: разбирает аргументы и возвращает 0.
      4. **`src/fxcli/__main__.py`** — вызывает `main()` и передаёт результат в `SystemExit`.

      ```bash
      pytest -q
      pip install -e ".[dev]"
      fxcli --version
      ```
    files:
      tests/conftest.py: |
        """Общие фикстуры тестов fxcli. Не меняйте этот файл."""

        import asyncio
        import sys
        from pathlib import Path

        import pytest

        ROOT = Path(__file__).resolve().parent.parent
        sys.path.insert(0, str(ROOT / "src"))  # тесты работают и без pip install -e .

        LATEST_USD = {"amount": 1.0, "base": "USD", "date": "2026-10-16", "rates": {"EUR": 0.92, "GBP": 0.79, "JPY": 151.3}}
        HISTORICAL_USD = {"amount": 1.0, "base": "USD", "date": "2026-01-02", "rates": {"EUR": 0.95}}
        SERIES_USD_EUR = {
            "amount": 1.0,
            "base": "USD",
            "start_date": "2026-10-01",
            "end_date": "2026-10-05",
            "rates": {"2026-10-05": {"EUR": 0.93}, "2026-10-01": {"EUR": 0.9}, "2026-10-02": {"EUR": 0.92}},
        }
        CURRENCIES = {"USD": "United States Dollar", "EUR": "Euro", "GBP": "British Pound"}


        class FakeApi:
            """Подмена Frankfurter API через httpx.MockTransport.

            add(path, *ответы): ответ — (статус, json) или функция request -> Response (может бросить исключение).
            Ответы выдаются по очереди, последний повторяется. calls — список (путь, параметры) запросов.
            """

            def __init__(self, delay: float = 0.0) -> None:
                self.delay = delay
                self.calls: list[tuple[str, dict]] = []
                self.routes: dict[str, list] = {}
                self.active = 0
                self.peak = 0

            def add(self, path: str, *responses) -> None:
                self.routes[path] = list(responses)

            async def handler(self, request):
                import httpx

                path = request.url.path.removeprefix("/v1")
                self.calls.append((path, dict(request.url.params)))
                self.active += 1
                self.peak = max(self.peak, self.active)
                try:
                    if self.delay:
                        await asyncio.sleep(self.delay)
                    items = self.routes.get(path)
                    if not items:
                        return httpx.Response(404, json={"message": "not found"})
                    item = items.pop(0) if len(items) > 1 else items[0]
                    if callable(item):
                        return item(request)
                    status, payload = item
                    return httpx.Response(status, json=payload)
                finally:
                    self.active -= 1

            def http(self):
                import httpx

                return httpx.AsyncClient(base_url="https://api.test/v1", transport=httpx.MockTransport(self.handler))


        @pytest.fixture
        def fake_api() -> FakeApi:
            api = FakeApi()
            api.add("/latest", (200, LATEST_USD))
            api.add("/currencies", (200, CURRENCIES))
            api.add("/2026-01-02", (200, HISTORICAL_USD))
            api.add("/2026-10-01..2026-10-05", (200, SERIES_USD_EUR))
            return api


        @pytest.fixture
        def settings(tmp_path):
            from fxcli.config import Settings

            return Settings(base_url="https://api.test/v1", retries=0, cache_dir=tmp_path / "cache", cache_ttl=60)


        async def no_sleep(delay: float) -> None:
            """Подмена asyncio.sleep для тестов повторов: не ждать."""
      tests/test_stage1_package.py: |
        """Этап 1: структура пакета и pyproject.toml."""

        import os
        import re
        import subprocess
        import sys
        import tomllib

        from conftest import ROOT


        def load_pyproject():
            path = ROOT / "pyproject.toml"
            assert path.exists(), "Создайте pyproject.toml в корне проекта"
            return tomllib.loads(path.read_text(encoding="utf-8"))


        def dependency_names(specs):
            return {re.match(r"[A-Za-z0-9._-]+", spec.strip()).group().lower().replace("_", "-") for spec in specs}


        def test_layout():
            for name in ["__init__.py", "__main__.py", "cli.py"]:
                assert (ROOT / "src" / "fxcli" / name).exists(), f"Нет файла src/fxcli/{name}"


        def test_project_metadata():
            project = load_pyproject()["project"]
            assert project["name"] == "fxcli"
            assert re.fullmatch(r"\d+\.\d+\.\d+", project["version"]), "Версия в формате MAJOR.MINOR.PATCH"
            assert project["requires-python"].startswith(">=3.1"), 'Укажите requires-python, например ">=3.11"'


        def test_dependencies():
            project = load_pyproject()["project"]
            assert {"httpx", "pydantic", "python-dotenv"} <= dependency_names(project["dependencies"])
            assert "pytest" in dependency_names(project["optional-dependencies"]["dev"]), "Добавьте группу dev с pytest"


        def test_script_and_build_system():
            data = load_pyproject()
            assert data["project"]["scripts"]["fxcli"] == "fxcli.cli:main"
            assert data["build-system"]["requires"] and data["build-system"]["build-backend"]


        def test_version_in_package():
            import fxcli

            assert fxcli.__version__ == load_pyproject()["project"]["version"]


        def test_python_m_version():
            env = {**os.environ, "PYTHONPATH": str(ROOT / "src")}
            completed = subprocess.run(
                [sys.executable, "-m", "fxcli", "--version"],
                cwd=ROOT,
                capture_output=True,
                text=True,
                encoding="utf-8",
                env=env,
            )
            assert completed.returncode == 0, completed.stderr
            assert completed.stdout.strip() == f"fxcli {load_pyproject()['project']['version']}"


        def test_main_is_callable():
            from fxcli.cli import main

            assert callable(main)
