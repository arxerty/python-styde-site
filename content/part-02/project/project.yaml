- id: stage-04
  title: Асинхронный клиент API
  description: |
    Сердце утилиты — асинхронный клиент на `httpx.AsyncClient` (блок 2.7). Его задачи: собрать запрос, отправить, разобрать ответ в модель и превратить любые сбои в одно понятное исключение `ApiError` с признаком `retryable` — можно ли повторить запрос.

    | Ситуация | Результат |
    |---|---|
    | 200 | JSON → модель; не прошёл валидацию → `ApiError` |
    | 404, 422 и другие 4xx | `ApiError(status=..., retryable=False)` |
    | 429, 5xx | `ApiError(status=..., retryable=True)` |
    | `httpx.TimeoutException`, `httpx.TransportError` | `ApiError(status=None, retryable=True)` |

    Клиент получает httpx-клиент **параметром** (внедрение зависимостей): в тестах туда передаётся клиент с `MockTransport`, а в работе `FxClient` создаёт его сам.
  hints:
  - 'Если `http` передан снаружи, `FxClient` не должен его закрывать — его закроет тот, кто создал. Запомните в `__init__`, свой ли это клиент: `self._owns_http = http is None`.'
  tasks:
  - id: t1
    title: FxClient и ApiError
    mode: local
    difficulty: 3
    statement: |
      В `src/fxcli/client.py` реализуйте:

      - **`ApiError(Exception)`** — `ApiError(message, status=None, retryable=False)` с атрибутами `status` и `retryable`.
      - **`FxClient(settings, http=None)`** — асинхронный контекстный менеджер:
        - `__aenter__`: если `http` не передан — создать `httpx.AsyncClient(base_url=settings.base_url, timeout=settings.timeout)` и сохранить в `self._http`; вернуть `self`;
        - `__aexit__`: закрыть httpx-клиент, **только если создали его сами**;
      - **`get_json(path, params=None)`** — GET-запрос; параметры со значениями `None` и `""` не отправляются; обработка ответов — по таблице; в тексте ошибки — статус и поле `message` из JSON-ответа, если оно есть;
      - **`latest(base, symbols=())`** → `Rates` (`GET /latest`, параметры `base` и `symbols` — коды через запятую; без `symbols`, если список пуст);
      - **`historical(day, base, symbols=())`** → `Rates` (`GET /ГГГГ-ММ-ДД`);
      - **`timeseries(start, end, base, symbols=())`** → `TimeSeries` (`GET /начало..конец`); `end < start` → `ValueError` без запроса;
      - **`currencies()`** → `Currencies` (`GET /currencies`);
      - **`latest_many(bases, symbols=())`** → словарь `база → Rates`; запросы идут **одновременно** через `asyncio.gather`.

      Логируйте каждый запрос на уровне DEBUG через `logger = logging.getLogger(__name__)`.
