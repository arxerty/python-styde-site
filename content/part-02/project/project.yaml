  title: Pydantic-модели ответов
  description: |
    Ответы API — внешние данные: им нельзя доверять без проверки. Модели Pydantic (блок 2.5) превращают JSON в объекты с типами и сразу ловят неожиданный формат: строку вместо даты, отрицательный курс, кривой код валюты.

    Модели также несут **предметную логику**: пересчёт сумм и статистику за период. Это чистые функции без сети — их легко тестировать.
