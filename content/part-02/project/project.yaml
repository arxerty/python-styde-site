- id: stage-07
  title: Командная строка и логирование
  description: |
    Осталось собрать всё в интерфейс командной строки. Принципы из уроков 2.8.4 и 2.8.5:

    - **результат — в stdout, логи и ошибки — в stderr**: вывод можно перенаправить в файл, не смешивая с сообщениями;
    - **логирование настраивается один раз в точке входа**, модули только пишут в свои логгеры;
    - **коды выхода**: `0` — успех, `1` — ошибка запроса или данных, `2` — ошибка конфигурации;
    - **`main(argv=None, client_factory=None, today=None)`** принимает зависимости параметрами, чтобы тесты подставили клиент с подменённым API.

    | Команда | Вывод |
    |---|---|
    | `rates USD [--to EUR GBP] [--date ДАТА]` | `Курсы USD на 2026-10-16`, затем строки `  EUR  0.9200` по алфавиту |
    | `convert 100 USD EUR [--date ДАТА]` | `100.00 USD = 92.00 EUR (курс 0.9200 на 2026-10-16)` |
    | `history USD EUR --start ДАТА [--end ДАТА]` | строки `2026-10-01  0.9000`, затем `мин … макс … среднее … изменение +3.33%` |
    | `currencies` | строки `EUR  Euro` по алфавиту кодов |

    Глобальные ключи: `--version`, `-v/--verbose` (уровень DEBUG), `--no-cache`, `--env-file ПУТЬ` (по умолчанию `.env`).
