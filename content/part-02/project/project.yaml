            fake_api.add("/latest", timeout)
            with pytest.raises(ApiError) as info:
                run(call(settings, fake_api, "latest", "USD"))
            assert info.value.retryable is True
            assert info.value.status is None


        def test_unexpected_payload(settings, fake_api):
            fake_api.add("/latest", (200, {"oops": True}))
            with pytest.raises(ApiError):
                run(call(settings, fake_api, "latest", "USD"))


        def test_latest_many_runs_concurrently(settings):
            api = FakeApi(delay=0.05)
            api.add("/latest", (200, {"amount": 1.0, "base": "USD", "date": "2026-10-16", "rates": {"EUR": 0.92}}))

            async def scenario():
                async with FxClient(settings, http=api.http()) as client:
                    return await client.latest_many(["USD", "EUR", "GBP"], ["EUR"])

            result = run(scenario())
            assert list(result) == ["USD", "EUR", "GBP"]
