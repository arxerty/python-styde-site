- id: stage-02
  title: 'Конфигурация: .env и переменные окружения'
  description: |
    Утилите нужны настройки: адрес API, таймаут, число повторов, папка и время жизни кэша, уровень логирования. Их нельзя зашивать в код — у каждого пользователя и окружения свои значения (блок 2.7).

    Порядок приоритета, как у большинства утилит: **значения по умолчанию ← файл `.env` ← переменные окружения**. Все переменные имеют префикс `FXCLI_`, чтобы не конфликтовать с чужими.

    | Переменная | Поле | По умолчанию | Ограничения |
    |---|---|---|---|
    | `FXCLI_BASE_URL` | `base_url` | `https://api.frankfurter.dev/v1` | `http://` или `https://`, без `/` в конце |
    | `FXCLI_TIMEOUT` | `timeout` | `10.0` | больше 0 |
    | `FXCLI_RETRIES` | `retries` | `3` | от 0 до 10 |
    | `FXCLI_CACHE_DIR` | `cache_dir` | `~/.cache/fxcli` (`Path`) | `~` раскрывается |
    | `FXCLI_CACHE_TTL` | `cache_ttl` | `3600` | не меньше 0 (0 — без кэша) |
    | `FXCLI_LOG_LEVEL` | `log_level` | `WARNING` | имя уровня logging, регистр не важен |
  hints:
  - Pydantic сам превратит строку `"5"` в `5.0` для поля `float` и строку пути в `Path` — от вас нужны только ограничения (`Field(gt=0)`) и `field_validator` для особых правил.
  tasks:
  - id: t1
    title: Settings и load_settings
    mode: local
    difficulty: 2
    statement: |
      В `src/fxcli/config.py` реализуйте:

      - **`Settings(BaseModel)`** — неизменяемая модель (`model_config = ConfigDict(frozen=True)`) с полями из таблицы и проверками: `base_url` обрезается по краям и без конечного `/`; `cache_dir` — с раскрытым `~` (`Path.expanduser()`); `log_level` переводится в верхний регистр и должен быть одним из `DEBUG`, `INFO`, `WARNING`, `ERROR`, `CRITICAL`.
      - **`ConfigError(Exception)`**.
      - **`load_settings(env_file=".env", environ=None) -> Settings`**: прочитать файл `env_file` через `dotenv_values` (если путь не `None` и файл существует), поверх — переменные из `environ` (по умолчанию `os.environ`); взять только переменные `FXCLI_<ПОЛЕ>`, пустые значения пропустить; при ошибке проверки бросить `ConfigError`, в сообщении которого перечислены **имена переменных** с ошибками (например, `FXCLI_TIMEOUT`).

      Создайте также **`.env.example`** со всеми шестью переменными и значениями по умолчанию — образец для пользователей (сам `.env` в репозиторий не попадает).
    files:
