        """Тесты командной строки с подменой клиента через unittest.mock."""

        import datetime as dt
        from unittest.mock import AsyncMock, MagicMock, patch

        import pytest

        from fxcli.cli import main
        from fxcli.client import ApiError
        from fxcli.models import Rates

        RATES = Rates(base="USD", date=dt.date(2026, 10, 16), rates={"EUR": 0.9, "GBP": 0.8})


        @pytest.fixture(autouse=True)
        def clean_env(tmp_path, monkeypatch):
            """Без .env и переменных FXCLI_* из окружения разработчика."""
            monkeypatch.chdir(tmp_path)
            for key in [
                "FXCLI_BASE_URL",
                "FXCLI_TIMEOUT",
                "FXCLI_RETRIES",
                "FXCLI_CACHE_DIR",
                "FXCLI_CACHE_TTL",
                "FXCLI_LOG_LEVEL",
            ]:
                monkeypatch.delenv(key, raising=False)


        def fake_client(**methods):
            """MagicMock, который работает как async with и возвращает заданные значения методов."""
            client = MagicMock()
            client.__aenter__.return_value = client
            for name, value in methods.items():
                setattr(client, name, AsyncMock(**{"side_effect" if isinstance(value, Exception) else "return_value": value}))
            return client


        def test_rates_calls_latest_with_normalized_codes(capsys):
            client = fake_client(latest=RATES)
            with patch("fxcli.cli.FxClient", return_value=client):
                assert main(["--no-cache", "rates", "usd", "--to", "eur"]) == 0
            client.latest.assert_awaited_once_with("USD", ["EUR"])
            assert "EUR  0.9000" in capsys.readouterr().out


        def test_rates_with_date_calls_historical():
            client = fake_client(historical=RATES)
            with patch("fxcli.cli.FxClient", return_value=client):
                assert main(["rates", "USD", "--date", "2026-01-02"]) == 0
            client.historical.assert_awaited_once_with(dt.date(2026, 1, 2), "USD", [])
            client.latest.assert_not_called()


        def test_convert_output(capsys):
            client = fake_client(latest=RATES)
            with patch("fxcli.cli.FxClient", return_value=client):
                assert main(["convert", "10", "USD", "GBP"]) == 0
            assert capsys.readouterr().out == "10.00 USD = 8.00 GBP (курс 0.8000 на 2026-10-16)\n"


        def test_api_error_exit_code(capsys):
            client = fake_client(latest=ApiError("HTTP 503: unavailable", status=503, retryable=True))
            with patch("fxcli.cli.FxClient", return_value=client):
                assert main(["rates", "USD"]) == 1
            captured = capsys.readouterr()
            assert captured.out == "" and "503" in captured.err


        def test_no_cache_flag_passes_none():
            client = fake_client(currencies=MagicMock(names=MagicMock(return_value={})))
            with patch("fxcli.cli.FxClient", return_value=client) as fx_client:
                main(["--no-cache", "currencies"])
            assert fx_client.call_args.kwargs["cache"] is None


        def test_cache_enabled_by_default(tmp_path, monkeypatch):
            monkeypatch.setenv("FXCLI_CACHE_DIR", str(tmp_path / "cache"))
            client = fake_client(currencies=MagicMock(names=MagicMock(return_value={})))
            with patch("fxcli.cli.FxClient", return_value=client) as fx_client:
                main(["currencies"])
            cache = fx_client.call_args.kwargs["cache"]
            assert cache is not None and cache.directory == tmp_path / "cache"


        def test_history_uses_today_by_default():
            client = fake_client(timeseries=KeyError("EUR"))
            with patch("fxcli.cli.FxClient", return_value=client):
                assert main(["history", "USD", "EUR", "--start", "2026-10-01"], today=dt.date(2026, 10, 10)) == 1
            client.timeseries.assert_awaited_once_with(dt.date(2026, 10, 1), dt.date(2026, 10, 10), "USD", ["EUR"])
      README.md: |
        # fxcli

        Курсы валют в терминале. Асинхронный клиент [Frankfurter API](https://frankfurter.dev) с кэшем, повторами при сбоях и логированием.

        ## Установка

        ```bash
        git clone https://github.com/<you>/fxcli.git
        cd fxcli
        python -m venv .venv
        source .venv/bin/activate        # Windows: .venv\Scripts\activate
        pip install -e ".[dev]"
        ```

        Или с uv: `uv sync --extra dev`.

        ## Использование

        ```bash
        fxcli rates USD                          # все курсы доллара
        fxcli rates USD --to EUR GBP             # только евро и фунт
        fxcli rates EUR --date 2024-01-02        # курсы на дату
        fxcli convert 100 USD EUR                # пересчитать сумму
        fxcli history USD EUR --start 2026-10-01 --end 2026-10-05
        fxcli currencies                         # список валют
        fxcli -v rates USD                       # подробный лог в stderr
        fxcli --no-cache rates USD               # без кэша
        ```

        Пример:

        ```text
        $ fxcli convert 100 USD EUR
        100.00 USD = 92.00 EUR (курс 0.9200 на 2026-10-16)
        ```

        Коды выхода: `0` — успех, `1` — ошибка запроса или данных, `2` — ошибка конфигурации. Результат печатается в stdout, сообщения лога — в stderr.

        ## Конфигурация

        Настройки читаются из переменных окружения с префиксом `FXCLI_` и из файла `.env` (переменные окружения важнее). Образец — `.env.example`:

        | Переменная | По умолчанию | Описание |
        |---|---|---|
        | `FXCLI_BASE_URL` | `https://api.frankfurter.dev/v1` | адрес API |
        | `FXCLI_TIMEOUT` | `10` | таймаут запроса, секунд |
        | `FXCLI_RETRIES` | `3` | повторов при временных ошибках (429, 5xx, таймаут) |
        | `FXCLI_CACHE_DIR` | `~/.cache/fxcli` | папка кэша |
        | `FXCLI_CACHE_TTL` | `3600` | время жизни кэша, секунд (`0` — без кэша) |
        | `FXCLI_LOG_LEVEL` | `WARNING` | уровень логирования |

        ## Разработка

        ```bash
        pytest -q              # тесты (сеть не нужна: API подменяется моками)
        ruff check src tests   # линтер
        ruff format src tests  # форматирование
        ```

        Структура пакета:

        ```text
        src/fxcli/
        ├── config.py   # Settings и загрузка .env
        ├── models.py   # Pydantic-модели ответов
        ├── retry.py    # декоратор @retry
        ├── cache.py    # файловый кэш с TTL
        ├── client.py   # асинхронный клиент httpx
        └── cli.py      # argparse, логирование, вывод
        ```
      .gitignore: |
        # окружение и кэши
        .venv/
        __pycache__/
        *.pyc
        .pytest_cache/
        .ruff_cache/

        # артефакты сборки
        dist/
        build/
        *.egg-info/

        # секреты и локальные настройки
        .env
        !.env.example
    solution_explanation: Тесты с patch проверяют контракт между CLI и клиентом — какие методы и с какими аргументами вызываются, — не касаясь сети и форматов ответа API. Вместе с README, .gitignore и чистым по ruff кодом проект готов к публикации и командной работе.
