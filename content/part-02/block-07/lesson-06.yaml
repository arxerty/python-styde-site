        import asyncio

        import httpx


        async def fetch_cards(client: httpx.AsyncClient, names: list[str], limit: int = 3) -> dict:
            """Загрузить карточки моделей с ограничением одновременности."""
            semaphore = asyncio.Semaphore(limit)

            async def one(name):
                async with semaphore:
                    try:
                        response = await client.get(f"/models/{name}")
                    except httpx.TimeoutException:
                        return name, "ошибка: таймаут"
                if response.status_code != 200:
                    return name, f"ошибка: {response.status_code}"
                return name, response.json()

            pairs = await asyncio.gather(*(one(name) for name in names))
            return dict(pairs)
    solution_explanation: "Семафор пропускает не больше limit запросов одновременно, а каждая корутина сама превращает ошибку в строку, поэтому gather не прерывается. gather возвращает пары в порядке names, и dict сохраняет этот порядок."
