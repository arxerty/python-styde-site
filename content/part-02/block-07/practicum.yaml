      - "RateLimiter без блокировок: в `wait()` вычислите `start = max(time.monotonic(), self._next)`, сразу запишите `self._next = start + self.interval` и только потом `await asyncio.sleep(start - now)` — между чтением и записью нет await, поэтому корутины не мешают друг другу."
