      Соберите асинхронный сборщик данных из публичного API (например, `https://jsonplaceholder.typicode.com/posts/1` … `/posts/100`), который вежливо относится к серверу. Скачайте архив и реализуйте в `collector.py`:

      1. **`RateLimiter(per_second)`** — асинхронный `wait()`: каждый следующий вызов стартует не раньше чем через `1 / per_second` с после предыдущего, первый — сразу; `per_second <= 0` → `ValueError`.
      2. **`async def fetch_json(client, path, *, limiter=None, retries=2, backoff=0.1)`** — GET-запрос через `httpx.AsyncClient`:
         - перед **каждой** попыткой — `await limiter.wait()` (если передан);
         - 200 → вернуть JSON;
         - 429 или 5xx → пауза (`Retry-After` в секундах, если есть, иначе `backoff * 2 ** номер_попытки`) и повтор;
         - `httpx.TimeoutException` → пауза `backoff * 2 ** номер_попытки` и повтор;
         - другие статусы → сразу `httpx.HTTPStatusError` (`raise_for_status()`);
         - после `retries` неудачных повторов — пробросить последнюю ошибку.
      3. **`async def collect(client, paths, *, concurrency=5, per_second=10.0, retries=2, backoff=0.1)`** — загрузить все пути: не больше `concurrency` одновременно (семафор), не чаще `per_second` запросов в секунду (один общий `RateLimiter`). Вернуть `{"ok": {путь: json}, "failed": {путь: причина}}`, ключи в порядке `paths`; причина — `"HTTP <статус>"` или `"таймаут"`.
      4. **`summarize(posts)`** — по списку постов (`{"userId": ..., "title": ...}`) вернуть `{"total": n, "by_user": {userId: число, ...}}` (ключи по возрастанию) и `"longest_title"` — самый длинный заголовок (при равенстве — первый; для пустого списка — `None`).
