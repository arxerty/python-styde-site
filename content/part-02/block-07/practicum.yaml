    title: "Пакетная обработка с прогрессом"
    difficulty: 3
    statement: |
      Напишите `async def process_batches(items, call, batch_size, on_progress=None)`:

      - обрабатывает `items` **пачками** по `batch_size`: внутри пачки все вызовы `await call(item)` идут одновременно, следующая пачка начинается после завершения предыдущей;
      - исключение одного вызова не прерывает пачку: результат такого элемента — `None`;
      - после каждой пачки, если передан `on_progress`, вызывает его (обычная функция) с аргументами `(обработано_всего, всего)`;
      - возвращает словарь `{"results": [...], "failed": [индексы с ошибкой]}`; результаты — в исходном порядке;
      - `batch_size < 1` → `ValueError`.
    examples:
      - input: "asyncio.run(process_batches([1, 2, 0, 4], inverse, 2))"
        output: "{'results': [1.0, 0.5, None, 0.25], 'failed': [2]}"
    setup: |
      import asyncio


      async def inverse(x):
          await asyncio.sleep(0.01)
          return 1 / x
    starter: |
      async def process_batches(items, call, batch_size, on_progress=None):
          results = [await call(item) for item in items]
          return {"results": results, "failed": []}
    hints:
      - "Пачки: `for start in range(0, len(items), batch_size): batch = items[start:start + batch_size]`; внутри — `await asyncio.gather(*(call(x) for x in batch), return_exceptions=True)`."
      - "Если элемент результата — экземпляр `BaseException`, запишите `None` и добавьте индекс `start + offset` в `failed`."
    solution: |
      import asyncio


      async def process_batches(items, call, batch_size, on_progress=None):
          """Обработать элементы пачками с одновременными вызовами внутри пачки."""
          if batch_size < 1:
              raise ValueError("batch_size должен быть не меньше 1")
          results, failed = [], []
          for start in range(0, len(items), batch_size):
              batch = items[start:start + batch_size]
              outcomes = await asyncio.gather(*(call(item) for item in batch), return_exceptions=True)
              for offset, outcome in enumerate(outcomes):
                  if isinstance(outcome, BaseException):
                      results.append(None)
                      failed.append(start + offset)
                  else:
                      results.append(outcome)
              if on_progress is not None:
                  on_progress(len(results), len(items))
          return {"results": results, "failed": failed}
    solution_explanation: "Пачки — простейший способ ограничить одновременность (хотя семафор эффективнее: он не ждёт самого медленного в пачке). return_exceptions=True не даёт одной ошибке прервать gather."
    tests:
      - name: "Пример"
        call: "asyncio.run(process_batches([1, 2, 0, 4], inverse, 2))"
        expected: "{'results': [1.0, 0.5, None, 0.25], 'failed': [2]}"
      - name: "Прогресс"
        code: |
          progress = []
          asyncio.run(process_batches(list(range(1, 8)), inverse, 3, on_progress=lambda done, total: progress.append((done, total))))
          assert progress == [(3, 7), (6, 7), (7, 7)], progress
      - name: "Пачки по очереди, внутри одновременно"
        code: |
          state = {"now": 0, "peak": 0}
          async def tracked(x):
              state["now"] += 1
              state["peak"] = max(state["peak"], state["now"])
              await asyncio.sleep(0.05)
              state["now"] -= 1
              return x
