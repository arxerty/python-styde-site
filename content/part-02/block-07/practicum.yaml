    solution_files:
      collector.py: |
        import asyncio
        import os
        import time
        from collections import Counter

        import httpx


        class RateLimiter:
            """Не больше per_second стартов в секунду."""

            def __init__(self, per_second: float) -> None:
                if per_second <= 0:
                    raise ValueError("per_second должен быть положительным")
                self.interval = 1 / per_second
                self._next = 0.0

            async def wait(self) -> None:
                now = time.monotonic()
                start = max(now, self._next)
                self._next = start + self.interval
                if start > now:
                    await asyncio.sleep(start - now)


        async def fetch_json(client, path, *, limiter=None, retries=2, backoff=0.1):
            """GET с повтором временных ошибок."""
            for attempt in range(retries + 1):
                if limiter is not None:
                    await limiter.wait()
                try:
                    response = await client.get(path)
                except httpx.TimeoutException:
                    if attempt == retries:
                        raise
                    await asyncio.sleep(backoff * 2 ** attempt)
                    continue
                retryable = response.status_code == 429 or response.status_code >= 500
                if not retryable or attempt == retries:
                    response.raise_for_status()
                    return response.json()
                delay = response.headers.get("retry-after")
                await asyncio.sleep(float(delay) if delay is not None else backoff * 2 ** attempt)
            raise AssertionError("недостижимо")


        async def collect(client, paths, *, concurrency=5, per_second=10.0, retries=2, backoff=0.1):
            """Загрузить все пути с ограничением одновременности и частоты."""
            semaphore = asyncio.Semaphore(concurrency)
            limiter = RateLimiter(per_second)

            async def one(path):
                async with semaphore:
                    try:
                        data = await fetch_json(client, path, limiter=limiter, retries=retries, backoff=backoff)
                    except httpx.HTTPStatusError as error:
                        return path, False, f"HTTP {error.response.status_code}"
                    except httpx.TimeoutException:
                        return path, False, "таймаут"
                    return path, True, data

            outcomes = await asyncio.gather(*(one(path) for path in paths))
            ok = {path: value for path, success, value in outcomes if success}
            failed = {path: value for path, success, value in outcomes if not success}
            return {"ok": ok, "failed": failed}


        def summarize(posts):
            """Сводка по постам."""
            by_user = Counter(post["userId"] for post in posts)
            longest = max((post["title"] for post in posts), key=len, default=None)
            return {
                "total": len(posts),
                "by_user": dict(sorted(by_user.items())),
                "longest_title": longest,
            }


        async def main():
            base_url = os.getenv("COLLECTOR_BASE_URL", "https://jsonplaceholder.typicode.com")
            count = int(os.getenv("COLLECTOR_COUNT", "20"))
            concurrency = int(os.getenv("COLLECTOR_CONCURRENCY", "5"))
            per_second = float(os.getenv("COLLECTOR_PER_SECOND", "10"))
            paths = [f"/posts/{i}" for i in range(1, count + 1)]
            start = time.perf_counter()
            async with httpx.AsyncClient(base_url=base_url, timeout=10) as client:
                result = await collect(client, paths, concurrency=concurrency, per_second=per_second)
            elapsed = time.perf_counter() - start
            print(f"загружено {len(result['ok'])}, ошибок {len(result['failed'])} за {elapsed:.1f} с")
            for path, reason in result["failed"].items():
                print(f"  {path}: {reason}")
            print(summarize(list(result["ok"].values())))


        if __name__ == "__main__":
            asyncio.run(main())
    solution_explanation: "Два независимых ограничения работают вместе: семафор держит не больше concurrency запросов «в полёте», а общий RateLimiter раздаёт слоты времени каждой попытке, включая повторы. fetch_json отличает временные ошибки от постоянных, а collect превращает исключения в причины, чтобы один сбойный путь не прервал сбор."
