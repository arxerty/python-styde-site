          start = time.perf_counter()
          result = asyncio.run(process_batches(list(range(9)), tracked, 3))
          elapsed = time.perf_counter() - start
          assert result["results"] == list(range(9)) and state["peak"] == 3, (result, state)
          assert 0.13 < elapsed < 0.4, f"{elapsed:.2f} с: ожидалось около 0.15 с (три пачки)"
