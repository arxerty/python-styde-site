    hints:
      - "dedupe — множество `seen`; top_words — `Counter` и `sorted(counts.items(), key=lambda p: (-p[1], p[0]))[:k]`; running_mean — бегущая сумма: прибавить новое значение, вычесть выпавшее из окна; lookup — один проход по событиям с `defaultdict(list)`, затем ответ для каждого id."
      - "measure: `t_slow = min(timeit.repeat(lambda: slow(*args), number=number, repeat=3))`, аналогично fast; перед замером сравните `slow(*args) == fast(*args)`. В running_mean результат зависит от порядка вычислений float — округление до 4 знаков делает его одинаковым."
    solution: |
      import timeit
      from collections import Counter, defaultdict


      def fast_dedupe(docs):
          """O(n): множество просмотренных документов."""
          seen = set()
          result = []
          for doc in docs:
              if doc not in seen:
                  seen.add(doc)
                  result.append(doc)
          return result


      def fast_top_words(docs, k):
          """O(N + u log u): Counter вместо list.count."""
          counts = Counter(word for doc in docs for word in doc.lower().split())
          return sorted(counts.items(), key=lambda pair: (-pair[1], pair[0]))[:k]


      def fast_running_mean(values, window):
          """O(n): бегущая сумма окна."""
          result = []
          total = 0.0
          for i, value in enumerate(values):
              total += value
              if i >= window:
                  total -= values[i - window]
              if i >= window - 1:
                  result.append(round(total / window, 4))
          return result


      def fast_lookup(events, user_ids):
          """O(E + U): один проход по событиям."""
          by_user = defaultdict(list)
          for user, event in events:
              by_user[user].append(event)
          return {user_id: list(by_user.get(user_id, [])) for user_id in user_ids}


      def measure(slow, fast, *args, number=3):
          """Замер до и после оптимизации."""
          assert slow(*args) == fast(*args), "результаты медленной и быстрой версий различаются"
          t_slow = min(timeit.repeat(lambda: slow(*args), number=number, repeat=3))
          t_fast = min(timeit.repeat(lambda: fast(*args), number=number, repeat=3))
          return {"slow": t_slow, "fast": t_fast, "speedup": round(t_slow / t_fast, 1)}
    solution_explanation: |
      | Функция | Было | Стало | Приём |
      |---|---|---|---|
      | dedupe | O(n²) | O(n) | множество вместо `in` по списку |
      | top_words | O(N·u) | O(N + u log u) | `Counter` вместо `list.count` |
      | running_mean | O(n·w) | O(n) | бегущая сумма вместо пересчёта окна |
      | lookup | O(E·U) | O(E + U) | индекс `defaultdict(list)` за один проход |

      Порядок работы, который стоит повторять в реальных проектах:

      1. **Сохранить медленную версию** как эталон и сравнивать результаты — оптимизация, меняющая ответ, хуже медленного кода. `measure` проверяет это перед замером.
      2. **Найти скрытые циклы**: `in` по списку, `list.count`, срезы с `sum` внутри цикла, вложенный проход по данным.
      3. **Подобрать структуру данных**: множество, словарь-счётчик, индекс, бегущее состояние.
      4. **Измерить**: минимум нескольких серий `timeit`, ускорение — отношением, а не «на глаз».

      Обратите внимание на `fast_running_mean`: сумма, накопленная бегущим способом, может отличаться от пересчитанной в последних знаках из-за погрешности float — округление до 4 знаков делает результаты одинаковыми. В численном коде всегда думайте, что значит «тот же результат».
    timeout: 20
    tests:
      - name: "Тот же результат: dedupe и top_words"
        code: |
          docs = ["Кот спит", "пёс ест", "Кот спит", "кот ест", "пёс ест"]
          assert fast_dedupe(docs) == slow_dedupe(docs)
          for k in (1, 3, 10):
              assert fast_top_words(docs, k) == slow_top_words(docs, k), k
      - name: "Тот же результат: running_mean и lookup"
        code: |
          values = [((i * 37) % 101) / 7 for i in range(500)]
          for window in (1, 3, 50):
              assert fast_running_mean(values, window) == slow_running_mean(values, window), window
          events = [(f"u{i % 7}", f"e{i}") for i in range(100)]
          ids = ["u1", "u3", "нет"]
          assert fast_lookup(events, ids) == slow_lookup(events, ids)
      - name: "Крайние случаи"
        code: |
          assert fast_dedupe([]) == [] and fast_top_words([], 3) == []
          assert fast_running_mean([1, 2], 5) == [] and fast_lookup([], ["x"]) == {"x": []}
      - name: "Большие данные"
        code: |
          docs = [f"документ {i % 20_000}" for i in range(60_000)]
          assert len(fast_dedupe(docs)) == 20_000
          words_docs = [f"w{i % 5000} w{i % 7}" for i in range(60_000)]
          assert fast_top_words(words_docs, 1)[0][0] in {f"w{i}" for i in range(7)}
          values = list(range(200_000))
          assert fast_running_mean(values, 1000)[0] == 499.5
          events = [(i % 5000, i) for i in range(200_000)]
          assert len(fast_lookup(events, list(range(5000)))[42]) == 40
      - name: "measure: ускорение"
        code: |
          docs = [f"d{i % 1500}" for i in range(3000)]
          report = measure(slow_dedupe, fast_dedupe, docs, number=1)
          assert set(report) == {"slow", "fast", "speedup"} and report["speedup"] > 5, report
      - name: "measure проверяет результаты"
        code: |
          try:
              measure(lambda: [1], lambda: [2])
          except AssertionError:
              pass
          else:
              raise AssertionError("measure должна отвергать разные результаты")
