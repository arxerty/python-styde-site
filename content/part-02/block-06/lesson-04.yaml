questions:
  - id: q1
    type: output
    prompt: "Сколько раз выполнится сравнение? Что выведет код?"
    code: |
      items = [3, 1, 4, 1, 5]
      count = 0
      for i in range(len(items)):
          for j in range(i + 1, len(items)):
              count += 1
      print(count)
    options:
      - text: "`10`"
        correct: true
        why: "Число пар из 5 элементов: 5·4/2 = 10 — квадратичный рост."
      - text: "`25`"
        why: "Внутренний цикл начинается с i + 1 — каждая пара один раз."
      - text: "`5`"
        why: "Циклы вложенные — число итераций перемножается, а не складывается."
    explanation: "Перебор всех пар — n(n−1)/2, то есть O(n²)."

  - id: q2
    type: single
    prompt: "Какова сложность функции?"
    code: |
      def common(a, b):
          return [x for x in a if x in b]
    options:
      - text: "O(n·m), если b — список; O(n), если b — множество"
        correct: true
        why: "Проверка in по списку — перебор, по множеству — O(1)."
      - text: "Всегда O(n)"
        why: "Зависит от типа b: x in list — скрытый цикл."
      - text: "O(log n)"
        why: "Здесь нет деления задачи пополам."
      - text: "O(1)"
        why: "Перебирается весь список a."
    explanation: "Учитывайте скрытые циклы операций над коллекциями."

  - id: q3
    type: single
    prompt: "Функция делает `3n + 100` операций. Как записать её сложность?"
    options:
      - text: "O(n)"
        correct: true
        why: "Константы и младшие слагаемые отбрасываются."
      - text: "O(3n + 100)"
        why: "Big O описывает класс роста без констант."
      - text: "O(1)"
        why: "Число операций растёт с n."
      - text: "O(n²)"
        why: "Рост линейный."
    explanation: "Big O показывает характер роста, а не точное число операций."

  - id: q4
    type: find_bug
    prompt: "Замер показывает, что сортировка «очень медленная». Что не так с замером?"
    code: |
      import timeit

      t = timeit.timeit("data = [i % 997 for i in range(100_000)]; sorted(data)", number=10)
    options:
      - text: "В замер попало создание данных; его нужно вынести в setup"
        correct: true
        why: "Измеряется и генерация списка, и сортировка."
      - text: "timeit нельзя использовать для сортировки"
        why: "Можно — с правильным разделением stmt и setup."
      - text: "number должен быть 1"
        why: "Несколько повторов как раз повышают точность."
    explanation: "Подготовку данных выносите в setup, измеряйте только интересующий код."

  - id: q5
    type: single
    prompt: "При удвоении размера входа время выросло в ~4 раза, при следующем удвоении — снова в ~4. Какая сложность вероятнее всего?"
    options:
      - text: "O(n²)"
        correct: true
        why: "(2n)² = 4n²."
      - text: "O(n)"
        why: "Линейная сложность дала бы рост в 2 раза."
      - text: "O(n log n)"
        why: "Рост был бы чуть больше чем в 2 раза."
      - text: "O(2ⁿ)"
        why: "Экспоненциальный рост при удвоении n — квадрат времени, а не ×4."
    explanation: "Тест удвоения: ×2 — линейная, ×4 — квадратичная."

  - id: q6
    type: multiple
    prompt: "Какие операции внутри цикла по n элементам делают алгоритм квадратичным? Выберите все."
    options:
      - text: "`x in big_list`"
        correct: true
        why: "Перебор списка на каждой итерации."
      - text: "`big_list.index(x)`"
        correct: true
        why: "Тоже линейный поиск."
      - text: "`big_list.insert(0, x)`"
        correct: true
        why: "Сдвиг всех элементов."
      - text: "`big_dict[x]`"
        why: "Поиск в словаре — O(1) в среднем."
    explanation: "Скрытые O(n) внутри цикла по n дают O(n²)."

tasks:
  - id: t1
    title: "Уникальные элементы за O(n)"
    difficulty: 1
    statement: |
      Напишите `unique_ordered(items)` — элементы без повторов в порядке первого появления. Решение должно быть линейным: 200 000 элементов, из них 100 000 различных, — быстро.
    examples:
      - input: "unique_ordered([3, 1, 3, 2, 1])"
        output: "[3, 1, 2]"
    starter: |
      def unique_ordered(items):
          result = []
          for item in items:
              if item not in result:
                  result.append(item)
          return result
    hints:
      - "Проверка `item not in result` по списку — скрытый цикл. Нужна структура с O(1)-проверкой."
      - "Храните множество `seen` рядом со списком результата или используйте `list(dict.fromkeys(items))`."
    solution: |
      def unique_ordered(items):
          """Уникальные элементы в порядке первого появления."""
          seen = set()
          result = []
          for item in items:
              if item not in seen:
                  seen.add(item)
                  result.append(item)
          return result
    solution_explanation: "Множество отвечает на «уже было?» за O(1), список хранит порядок. Итого O(n) вместо O(n²). Короткая альтернатива — list(dict.fromkeys(items)): словарь тоже хранит порядок вставки."
    timeout: 5
    tests:
      - name: "Пример"
        call: "unique_ordered([3, 1, 3, 2, 1])"
        expected: "[3, 1, 2]"
      - name: "Строки"
        call: "unique_ordered(\"абракадабра\")"
        expected: "['а', 'б', 'р', 'к', 'д']"
      - name: "Пусто"
        call: "unique_ordered([])"
        expected: "[]"
      - name: "Производительность"
        code: |
          data = [i % 100_000 for i in range(200_000)]
          result = unique_ordered(data)
          assert len(result) == 100_000 and result[:3] == [0, 1, 2]
      - name: "Аргумент не меняется"
        code: |
          data = [1, 1]
          unique_ordered(data)
          assert data == [1, 1]
      - name: "Тест удвоения: рост линейный"
        code: |
          import timeit
          small = list(range(20_000))
          large = list(range(40_000))
          t_small = min(timeit.repeat(lambda: unique_ordered(small), number=3, repeat=3))
          t_large = min(timeit.repeat(lambda: unique_ordered(large), number=3, repeat=3))
          assert t_large / t_small < 3, f"При удвоении данных время выросло в {t_large / t_small:.1f} раза — похоже на O(n²)"

  - id: t2
    title: "Оценка сложности по замерам"
    difficulty: 2
    statement: |
      Время работы функции замерено на разных размерах входа: словарь `{n: секунды}`. Напишите:

      - `doubling_ratios(timings)` — список отношений `t(2n) / t(n)` для всех `n`, у которых в словаре есть `2n` (по возрастанию `n`), округлённых до 2 знаков;
      - `estimate_order(timings)` — оценка сложности по **среднему** из этих отношений: меньше 1.5 → `"O(1)"`, меньше 2.6 → `"O(n)"`, меньше 6 → `"O(n^2)"`, иначе `"O(n^3+)"`. Если ни одной пары нет — `ValueError`.
    examples:
      - input: "estimate_order({1000: 0.01, 2000: 0.04, 4000: 0.16})"
        output: "'O(n^2)'"
    starter: |
      def estimate_order(timings):
          return "O(n)"
    hints:
      - "`for n in sorted(timings): if 2 * n in timings: ratios.append(round(timings[2 * n] / timings[n], 2))`."
      - "Среднее — `sum(ratios) / len(ratios)`; пороги проверяйте по возрастанию."
    solution: |
      def doubling_ratios(timings):
          """Отношения времени при удвоении размера."""
          return [round(timings[2 * n] / timings[n], 2) for n in sorted(timings) if 2 * n in timings]


      def estimate_order(timings):
          """Грубая оценка класса сложности по тесту удвоения."""
          ratios = doubling_ratios(timings)
          if not ratios:
              raise ValueError("нужны замеры для n и 2n")
          average = sum(ratios) / len(ratios)
          if average < 1.5:
              return "O(1)"
          if average < 2.6:
              return "O(n)"
          if average < 6:
              return "O(n^2)"
          return "O(n^3+)"
    solution_explanation: "Для O(n^k) удвоение входа умножает время на 2^k: 1, 2, 4, 8. Пороги между этими значениями позволяют грубо классифицировать реальные замеры, в которых всегда есть шум. O(n log n) попадёт в «O(n)» — тест удвоения различает их плохо."
    tests:
      - name: "Пример"
        call: "estimate_order({1000: 0.01, 2000: 0.04, 4000: 0.16})"
        expected: "'O(n^2)'"
      - name: "doubling_ratios"
        call: "doubling_ratios({100: 1.0, 200: 2.1, 300: 5.0, 400: 4.0})"
        expected: "[2.1, 1.9]"
      - name: "Классы"
        call: "[estimate_order({1: 1.0, 2: 1.1}), estimate_order({10: 1.0, 20: 2.2, 40: 4.3}), estimate_order({5: 1.0, 10: 8.5})]"
        expected: "['O(1)', 'O(n)', 'O(n^3+)']"
      - name: "Нет пар"
        code: |
          try:
              estimate_order({100: 1.0, 300: 2.0})
          except ValueError:
              pass
          else:
              raise AssertionError("Ожидался ValueError")
      - name: "Настоящие замеры"
        code: |
          import timeit
          def quadratic(n):
              return sum(1 for i in range(n) for j in range(n))
          timings = {n: min(timeit.repeat(lambda n=n: quadratic(n), number=1, repeat=3)) for n in (150, 300, 600)}
          assert estimate_order(timings) in ("O(n^2)", "O(n^3+)"), timings

  - id: t3
    title: "Сравнение реализаций"
    difficulty: 2
    statement: |
      Напишите `benchmark(funcs, data, number=3, repeat=3)`: `funcs` — словарь `{имя: функция одного аргумента}`. Для каждой функции измерьте время через `timeit.repeat` (вызов `func(data)` `number` раз, `repeat` серий), возьмите **минимум** серии и верните список пар `(имя, время)`, отсортированный от быстрой к медленной.
    examples:
      - input: "[name for name, _ in benchmark({\"sum\": sum, \"sorted\": sorted}, list(range(10)))]"
        output: "['sum', 'sorted']"
    starter: |
      import time


      def benchmark(funcs, data, number=3, repeat=3):
          results = []
          for name, func in funcs.items():
              start = time.perf_counter()
              func(data)
              results.append((name, time.perf_counter() - start))
          return results
    hints:
      - "`times = timeit.repeat(lambda: func(data), number=number, repeat=repeat)` — внутри цикла lambda видит текущую func, потому что вызывается сразу."
      - "`results.append((name, min(times)))`, затем `sorted(results, key=lambda pair: pair[1])`."
    solution: |
      import timeit


      def benchmark(funcs, data, number=3, repeat=3):
          """Время работы реализаций, от быстрой к медленной."""
          results = []
          for name, func in funcs.items():
              times = timeit.repeat(lambda: func(data), number=number, repeat=repeat)
              results.append((name, min(times)))
          return sorted(results, key=lambda pair: pair[1])
    solution_explanation: "Несколько серий и минимум убирают влияние случайных помех. lambda внутри цикла безопасна: timeit.repeat вызывает её сразу, до перехода к следующей функции, поэтому ловушка позднего связывания не срабатывает."
    tests:
      - name: "Порядок по скорости"
        code: |
          def slow(items):
              return [x for x in items if items.count(x) == 1]
          def fast(items):
              return sum(items)
          data = list(range(2000))
          names = [name for name, _ in benchmark({"slow": slow, "fast": fast}, data)]
          assert names == ["fast", "slow"], names
      - name: "Формат результата"
        code: |
          result = benchmark({"len": len}, [1, 2, 3], number=10, repeat=2)
          assert len(result) == 1 and result[0][0] == "len" and isinstance(result[0][1], float) and result[0][1] >= 0
      - name: "Используется timeit"
        code: |
          assert "timeit" in __source__
      - name: "number и repeat"
        code: |
          calls = []
          def tracked(data):
              calls.append(1)
          benchmark({"t": tracked}, None, number=4, repeat=3)
          assert len(calls) == 12, f"Ожидалось 4 × 3 = 12 вызовов, было {len(calls)}"
      - name: "Пустой словарь"
        call: "benchmark({}, [1])"
        expected: "[]"

  - id: t4
    title: "Пары анаграмм за O(n)"
    difficulty: 3
    statement: |
      Анаграммы — слова из одинаковых букв (`"кот"`, `"ток"`). Медленное решение из заготовки сравнивает все пары слов. Напишите быстрое `count_anagram_pairs(words)` — число пар индексов `i < j`, где слова — анаграммы (без учёта регистра). Для 50 000 слов — быстро.
    examples:
      - input: "count_anagram_pairs([\"кот\", \"ток\", \"окт\", \"пёс\"])"
        output: "3"
    starter: |
      def count_anagram_pairs(words):
          count = 0
          for i in range(len(words)):
              for j in range(i + 1, len(words)):
                  if sorted(words[i].lower()) == sorted(words[j].lower()):
                      count += 1
          return count
    hints:
      - "Ключ группы — отсортированные буквы слова: `\"\".join(sorted(word.lower()))`. Посчитайте размер каждой группы словарём."
      - "Группа из k слов даёт k·(k−1)/2 пар: `sum(k * (k - 1) // 2 for k in sizes.values())`."
    solution: |
      def count_anagram_pairs(words):
          """Число пар слов-анаграмм."""
          sizes = {}
          for word in words:
              key = "".join(sorted(word.lower()))
              sizes[key] = sizes.get(key, 0) + 1
          return sum(k * (k - 1) // 2 for k in sizes.values())
    solution_explanation: "Вместо сравнения всех пар (O(n²)) слова группируются по каноническому ключу за один проход, а число пар внутри группы считается формулой. Пары даже не нужно перебирать."
    timeout: 5
    tests:
      - name: "Пример"
        call: "count_anagram_pairs([\"кот\", \"ток\", \"окт\", \"пёс\"])"
        expected: "3"
      - name: "Регистр"
        call: "count_anagram_pairs([\"Кот\", \"ТОК\"])"
        expected: "1"
      - name: "Нет пар"
        call: "[count_anagram_pairs([\"a\", \"b\"]), count_anagram_pairs([])]"
        expected: "[0, 0]"
      - name: "Одинаковые слова"
        call: "count_anagram_pairs([\"ab\", \"ab\", \"ba\", \"ab\"])"
        expected: "6"
      - name: "Производительность"
        code: |
          words = [chr(0x4E00 + i % 1000) * 3 for i in range(50_000)]
          assert count_anagram_pairs(words) == 1000 * (50 * 49 // 2)
