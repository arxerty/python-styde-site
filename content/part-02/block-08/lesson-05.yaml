        """Очистка текстовых записей перед загрузкой в индекс."""
        import json
        import logging
        import sys

        logger = logging.getLogger(__name__)


        def process(records):
            """records — список словарей {"id", "text"}; вернуть список очищенных текстов."""
            logger.info("старт: %d записей", len(records))
            result = []
            for record in records:
                text = record.get("text")
                if not text or not text.strip():
                    logger.warning("пустой текст в записи %s", record.get("id"))
                    continue
                cleaned = " ".join(text.split())
                logger.debug("обработана запись %s, длина %d", record.get("id"), len(cleaned))
                result.append(cleaned)
            if not result:
                logger.error("нет ни одной валидной записи")
            logger.info("готово: %d из %d", len(result), len(records))
            return result


        def main(argv=None):
            """Точка входа: настройка логирования, чтение файла, вывод результата."""
            args = sys.argv[1:] if argv is None else argv
            verbose = "-v" in args
            paths = [arg for arg in args if arg != "-v"]
            logging.basicConfig(
                level=logging.DEBUG if verbose else logging.INFO,
                stream=sys.stderr,
                format="%(levelname)s %(name)s: %(message)s",
                force=True,
            )
            path = paths[0]
            try:
                with open(path, encoding="utf-8") as file:
                    records = json.load(file)
            except FileNotFoundError:
                logger.error("нет файла: %s", path)
                return 1
            print(json.dumps(process(records), ensure_ascii=False))
            return 0


        if __name__ == "__main__":
            raise SystemExit(main())
    solution_explanation: "Модуль только пишет в свой логгер, а настраивает логирование main — точка входа приложения. Логи идут в stderr, результат — в stdout, поэтому вывод можно перенаправить в файл или передать другой программе, не смешивая с сообщениями."
