    solution_files:
      messy.py: |
        """Подсчёт слов и статистика по текстам."""

        import json


        def normalize_text(text: str) -> str:
            """Убрать лишние пробелы и привести к нижнему регистру."""
            return " ".join(text.split()).lower()


        def count_words(texts: list[str], stop_words: set[str] | None = None) -> dict[str, int]:
            """Частоты слов без стоп-слов."""
            stop_words = stop_words or set()
            counts: dict[str, int] = {}
            for text in texts:
                for word in normalize_text(text).split():
                    if word in stop_words:
                        continue
                    counts[word] = counts.get(word, 0) + 1
            return counts


        def load_texts(path: str) -> list[str] | None:
            """Прочитать список текстов из JSON; при ошибке — None."""
            try:
                with open(path, encoding="utf-8") as file:
                    data = json.load(file)
            except (OSError, json.JSONDecodeError):
                return None
            if data is None:
                return None
            return [str(item) for item in data]


        class TextStats:
            """Статистика по набору текстов."""

            def __init__(self, texts: list[str]) -> None:
                self.texts = texts

            def longest(self) -> str | None:
                """Самый длинный текст (первый при равенстве)."""
                result = None
                for text in self.texts:
                    if result is None or len(text) > len(result):
                        result = text
                return result
      .pre-commit-config.yaml: |
        repos:
          - repo: https://github.com/astral-sh/ruff-pre-commit
            rev: v0.6.9
            hooks:
              - id: ruff
                args: [--fix]
              - id: ruff-format
    solution_explanation: "Автоматические исправления ruff убирают мусор и модернизируют аннотации, а оставшиеся замечания — это как раз то, что требует понимания: переименования с сохранением поведения, None вместо изменяемого значения по умолчанию, конкретные исключения вместо голого except. pre-commit закрепляет результат: неряшливый код больше не попадёт в коммит."
