      test_prices.py: |
        import pytest

        from prices import cheapest_model, request_cost, total_cost


        def test_mini_input_only():
            assert request_cost("mini", 1_000_000, 0) == pytest.approx(0.15)


        def test_mini_output_only():
            assert request_cost("mini", 0, 1_000_000) == pytest.approx(0.60)


        def test_large_mixed():
            assert request_cost("large", 2_000, 500) == pytest.approx(0.01)


        def test_unknown_model():
            with pytest.raises(KeyError):
                request_cost("gpt-unknown", 1, 1)


        def test_negative_input_tokens():
            with pytest.raises(ValueError):
                request_cost("mini", -1, 10)


        def test_negative_output_tokens():
            with pytest.raises(ValueError):
                request_cost("mini", 10, -1)


        def test_total_cost_small_values_keep_precision():
            requests = [{"model": "mini", "input": 100, "output": 0}] * 2
            assert total_cost(requests) == pytest.approx(0.00003)


        def test_total_cost_empty():
            assert total_cost([]) == 0


        def test_cheapest_model():
            assert cheapest_model(1_000, 1_000) == "mini"
    solution_explanation: "Каждая испорченная версия ловится отдельным тестом: раздельные проверки цен входа и выхода, оба отрицательных аргумента, точное значение для известного объёма, маленькая сумма для проверки округления и выбор самой дешёвой модели."
