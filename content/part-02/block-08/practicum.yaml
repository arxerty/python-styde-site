        """Утилиты для чат-приложения на LLM."""
        import json
        import re

        PRICES = {"mini": (0.15, 0.60), "large": (2.50, 10.00)}  # $ за 1 млн токенов: (вход, выход)


        def count_tokens(text):
            """Грубая оценка числа токенов: слова и знаки препинания считаются отдельно.

            count_tokens("Привет, мир!") == 4
            """
            return len(re.findall(r"\w+|[^\w\s]", text))


        def message_tokens(message):
            """Токены сообщения: текст + 4 служебных токена на сообщение."""
            return count_tokens(message["content"]) + 4


        def trim_history(messages, max_tokens):
            """Оставить системные сообщения и как можно больше ПОСЛЕДНИХ остальных.

            - системные сообщения (role == "system") сохраняются всегда и идут первыми;
            - остальные добавляются начиная с последнего, пока сумма message_tokens всех
              оставленных сообщений не превышает max_tokens (сумма, равная max_tokens, допустима);
              как только очередное сообщение не помещается, более ранние не рассматриваются;
            - относительный порядок сообщений сохраняется, исходный список не меняется.
            """
            system = [m for m in messages if m["role"] == "system"]
            budget = max_tokens - sum(message_tokens(m) for m in system)
            kept = []
            for message in reversed([m for m in messages if m["role"] != "system"]):
                cost = message_tokens(message)
                if cost > budget:
                    break
                kept.append(message)
                budget -= cost
            return system + kept[::-1]


        def estimate_cost(model, input_tokens, output_tokens):
            """Стоимость запроса в долларах, округлённая до 6 знаков. Неизвестная модель → KeyError."""
            price_in, price_out = PRICES[model]
            return round((input_tokens * price_in + output_tokens * price_out) / 1_000_000, 6)


        def parse_json_answer(text):
            """Достать JSON-объект из ответа модели.

            Модель может обернуть JSON в ```json ... ``` или добавить текст вокруг.
            Берётся фрагмент от первой «{» до последней «}». Нет объекта или он некорректен → ValueError.
            """
            start = text.find("{")
            end = text.rfind("}")
            if start == -1 or end < start:
                raise ValueError("в ответе нет JSON-объекта")
            try:
                return json.loads(text[start:end + 1])
            except json.JSONDecodeError as error:
                raise ValueError(f"некорректный JSON: {error}") from error


        def retry_delays(attempts, base=0.5, cap=8.0):
            """Паузы перед повторами: base, 2·base, 4·base, ... но не больше cap.

            retry_delays(4, base=1, cap=5) == [1, 2, 4, 5]
            """
            return [min(base * 2 ** attempt, cap) for attempt in range(attempts)]
