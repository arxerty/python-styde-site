        # Найденные ошибки

        - `trim_history`: сообщение, которое ровно заполняло оставшийся бюджет, отбрасывалось из-за сравнения `cost >= budget`. По ТЗ сумма, равная `max_tokens`, допустима — исправлено на `cost > budget`.
        - `parse_json_answer`: конец JSON искался через `text.find("}")` — по первой закрывающей скобке, поэтому вложенные объекты обрезались и вызывали ValueError. Исправлено на `text.rfind("}")` (последняя «}»).
        - `retry_delays`: показатель степени начинался с 1, и первая пауза была `2·base` вместо `base`. Исправлено на `range(attempts)`.
    solution_explanation: |
      Тесты написаны строго по docstring: каждое утверждение ТЗ превращено в проверку, а основное внимание уделено границам — точному бюджету, вложенному JSON, первой паузе. Три бага прятались именно там:

      - `trim_history` — `>=` вместо `>` на границе бюджета;
      - `parse_json_answer` — `find` вместо `rfind` для закрывающей скобки;
      - `retry_delays` — степень с 1 вместо 0.

      Полезное следствие: тот же набор тестов ловит и шесть других типичных ошибок (служебные токены, знаки препинания, перепутанные цены, потерю системных сообщений, порядок истории, отсутствие верхней границы пауз) — это и есть защита от регрессий.
