        import copy

        import pytest

        from chat_utils import count_tokens, estimate_cost, message_tokens, parse_json_answer, retry_delays, trim_history


        @pytest.mark.parametrize(
            "text, expected",
            [
                ("Привет, мир!", 4),
                ("", 0),
                ("один", 1),
                ("a-b", 3),
                ("  много   пробелов  ", 2),
            ],
        )
        def test_count_tokens(text, expected):
            assert count_tokens(text) == expected


        def test_message_tokens():
            assert message_tokens({"role": "user", "content": "Привет, мир!"}) == 8


        @pytest.fixture
        def history():
            return [
                {"role": "system", "content": "Ты помощник"},   # 2 + 4 = 6
                {"role": "user", "content": "раз"},             # 1 + 4 = 5
                {"role": "assistant", "content": "два три"},    # 2 + 4 = 6
                {"role": "user", "content": "четыре"},          # 1 + 4 = 5
            ]


        def test_trim_keeps_everything_when_budget_is_large(history):
            assert trim_history(history, 1000) == history


        def test_trim_exact_budget_is_allowed(history):
            assert trim_history(history, 22) == history


        def test_trim_drops_oldest_and_keeps_order(history):
            assert trim_history(history, 17) == [history[0], history[2], history[3]]


        def test_trim_keeps_system_even_without_budget(history):
            assert trim_history(history, 0) == [history[0]]


        def test_trim_stops_at_first_message_that_does_not_fit(history):
            assert trim_history(history, 12) == [history[0], history[3]]


        def test_trim_does_not_modify_input(history):
            original = copy.deepcopy(history)
            trim_history(history, 10)
            assert history == original


        @pytest.mark.parametrize(
            "model, input_tokens, output_tokens, expected",
            [
                ("mini", 1_000_000, 0, 0.15),
                ("mini", 0, 1_000_000, 0.6),
                ("large", 1000, 500, 0.0075),
                ("mini", 1, 0, 0.0),
                ("mini", 100, 0, 0.000015),
            ],
        )
        def test_estimate_cost(model, input_tokens, output_tokens, expected):
            assert estimate_cost(model, input_tokens, output_tokens) == pytest.approx(expected)


        def test_estimate_cost_unknown_model():
            with pytest.raises(KeyError):
                estimate_cost("gpt-unknown", 1, 1)


        @pytest.mark.parametrize(
            "text, expected",
            [
                ('{"a": 1}', {"a": 1}),
                ('Ответ: {"a": 1} — готово', {"a": 1}),
                ('```json\n{"a": {"b": [1, 2]}}\n```', {"a": {"b": [1, 2]}}),
            ],
        )
        def test_parse_json_answer(text, expected):
            assert parse_json_answer(text) == expected


        @pytest.mark.parametrize("text", ["", "нет json", '{"a": 1', "} {", '{"a": }'])
        def test_parse_json_answer_errors(text):
            with pytest.raises(ValueError):
                parse_json_answer(text)


        @pytest.mark.parametrize(
            "args, kwargs, expected",
            [
                ((4,), {"base": 1, "cap": 5}, [1, 2, 4, 5]),
                ((3,), {}, [0.5, 1.0, 2.0]),
                ((0,), {}, []),
                ((6,), {"base": 1, "cap": 8}, [1, 2, 4, 8, 8, 8]),
            ],
        )
        def test_retry_delays(args, kwargs, expected):
            assert retry_delays(*args, **kwargs) == expected
