        #!/usr/bin/env python3
        """pre-commit: не пускать в коммит секреты."""
        import re
        import subprocess
        import sys
        from pathlib import Path

        RULES = [
            (re.compile(r"sk-[A-Za-z0-9_-]{16,}"), "похоже на API-ключ"),
            (re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"), "приватный ключ"),
        ]


        def git(*args):
            return subprocess.run(
                ["git", *args], capture_output=True, text=True, encoding="utf-8", errors="replace", check=True
            ).stdout


        def main():
            problems = []
            for path in git("diff", "--cached", "--name-only", "--diff-filter=ACM").splitlines():
                if Path(path).name == ".env":
                    problems.append(f"{path}: файл .env нельзя коммитить")
                    continue
                for number, line in enumerate(git("show", f":{path}").splitlines(), start=1):
                    for pattern, reason in RULES:
                        if pattern.search(line):
                            problems.append(f"{path}:{number}: {reason}")
            for problem in problems:
                print(problem, file=sys.stderr)
            if problems:
                print("Коммит отменён: уберите секреты из индекса (git restore --staged <файл>).", file=sys.stderr)
            return 1 if problems else 0


        if __name__ == "__main__":
            sys.exit(main())
