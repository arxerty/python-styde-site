        #!/usr/bin/env python3
        """commit-msg: проверить формат сообщения коммита."""
        import re
        import sys
        from pathlib import Path

        TYPES = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore", "revert"]
        HEADER = re.compile(rf"({'|'.join(TYPES)})(\([^()\s]+\))?!?: \S.*")
        MAX_LENGTH = 72


        def check(text):
            """Текст ошибки или None, если сообщение в порядке."""
            lines = [line for line in text.splitlines() if not line.startswith("#")]
            if not lines or not lines[0].strip():
                return "пустое сообщение коммита"
            header = lines[0].rstrip()
            if header.startswith("Merge "):
                return None
            if len(header) > MAX_LENGTH:
                return f"первая строка длиннее {MAX_LENGTH} символов ({len(header)})"
            if not HEADER.fullmatch(header):
                return "формат: тип(область): описание, тип — " + ", ".join(TYPES)
            return None


        def main(argv):
            text = Path(argv[0]).read_text(encoding="utf-8")
            error = check(text)
            if error:
                print(f"Сообщение коммита не по Conventional Commits: {error}", file=sys.stderr)
                return 1
            return 0


        if __name__ == "__main__":
            sys.exit(main(sys.argv[1:]))
