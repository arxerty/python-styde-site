    solution_explanation: "Хук pre-commit смотрит именно на индекс: `--cached` даёт список подготовленных файлов, а `git show :путь` — их версию в индексе, то есть ровно то, что попадёт в коммит. Хук commit-msg проверяет первую значимую строку сообщения; ненулевой код выхода любого хука отменяет коммит. .gitignore дополняет защиту: секреты и мусор вообще не попадают в git status."
