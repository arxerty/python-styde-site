        """Тесты задания. Не меняйте этот файл."""
        import shutil
        import subprocess
        import sys
        from pathlib import Path

        import pytest

        HERE = Path(__file__).parent
        HOOKS = HERE / "hooks"
        pytestmark = pytest.mark.skipif(shutil.which("git") is None, reason="нужен установленный git")


        def git(repo, *args):
            return subprocess.run(["git", *args], cwd=repo, capture_output=True, text=True, check=True)


        @pytest.fixture
        def repo(tmp_path):
            git(tmp_path, "init", "-q")
            git(tmp_path, "config", "user.email", "test@example.com")
            git(tmp_path, "config", "user.name", "Test")
            git(tmp_path, "config", "core.autocrlf", "false")
            return tmp_path


        def write(repo, path, text):
            file = repo / path
            file.parent.mkdir(parents=True, exist_ok=True)
            file.write_text(text, encoding="utf-8")


        def stage(repo, path, text):
            write(repo, path, text)
            git(repo, "add", "-f", path)


        def secrets(repo):
            return subprocess.run(
                [sys.executable, str(HOOKS / "check_secrets.py")],
                cwd=repo, capture_output=True, text=True, encoding="utf-8", errors="replace",
            )


        def commit_msg(tmp_path, message):
            path = tmp_path / "COMMIT_EDITMSG"
            path.write_text(message, encoding="utf-8")
            return subprocess.run(
                [sys.executable, str(HOOKS / "check_commit_msg.py"), str(path)],
                capture_output=True, text=True, encoding="utf-8", errors="replace",
            )


        # --- check_secrets.py ---

        def test_clean_files_pass(repo):
            stage(repo, "app.py", "print('hello')\nAPI_URL = 'https://api.example.com'\n")
            stage(repo, ".env.example", "LLM_API_KEY=\n")
            assert secrets(repo).returncode == 0


        def test_api_key_blocked(repo):
            stage(repo, "app.py", "x = 1\n")
            stage(repo, "src/config.py", "import os\nKEY = 'sk-abcdefghijklmnop1234'\n")
            result = secrets(repo)
            assert result.returncode == 1
            assert "src/config.py:2" in result.stderr, result.stderr


        def test_short_sk_is_fine(repo):
            stage(repo, "notes.md", "токены вида sk-short не ключи\n")
            assert secrets(repo).returncode == 0


        @pytest.mark.parametrize("path", [".env", "app/.env"])
        def test_env_file_blocked(repo, path):
            stage(repo, path, "DEBUG=1\n")
            result = secrets(repo)
            assert result.returncode == 1
            assert path in result.stderr, result.stderr


        def test_private_key_blocked(repo):
            stage(repo, "deploy/key.pem", "-----BEGIN RSA PRIVATE KEY-----\nMIIE...\n-----END RSA PRIVATE KEY-----\n")
            result = secrets(repo)
            assert result.returncode == 1
            assert "deploy/key.pem:1" in result.stderr, result.stderr


        def test_checks_staged_version_not_working_copy(repo):
            stage(repo, "a.py", "KEY = 'sk-abcdefghijklmnop1234'\n")
            write(repo, "a.py", "KEY = None\n")
            assert secrets(repo).returncode == 1, "В индексе ключ есть — коммит нужно блокировать"
            stage(repo, "b.py", "x = 1\n")
            git(repo, "rm", "-q", "--cached", "-f", "a.py")
            write(repo, "b.py", "KEY = 'sk-abcdefghijklmnop1234'\n")
            assert secrets(repo).returncode == 0, "Неиндексированные изменения в коммит не попадут"


        def test_untracked_and_deleted_files(repo):
            stage(repo, "old.py", "x = 1\n")
            git(repo, "commit", "-q", "-m", "init")
            git(repo, "rm", "-q", "old.py")
            write(repo, "untracked.py", "KEY = 'sk-abcdefghijklmnop1234'\n")
            assert secrets(repo).returncode == 0


        # --- check_commit_msg.py ---

        @pytest.mark.parametrize("message", [
            "feat(cli): добавить команду history\n",
            "fix: повторять запрос при 503\n\nПодробности в теле.\n",
            "refactor!: переименовать клиент\n",
            "# Please enter the commit message\n# Lines starting with '#' will be ignored\nchore: обновить зависимости\n",
            "Merge branch 'feature/cache'\n",
        ])
        def test_good_messages(tmp_path, message):
            result = commit_msg(tmp_path, message)
            assert result.returncode == 0, result.stderr


        @pytest.mark.parametrize("message", [
            "обновил код\n",
            "feat: \n",
            "Feat: добавить\n",
            "feature: добавить\n",
            "fix:без пробела\n",
            "feat: " + "x" * 70 + "\n",
            "# только комментарий\n",
        ])
        def test_bad_messages(tmp_path, message):
            result = commit_msg(tmp_path, message)
            assert result.returncode == 1
            assert result.stderr.strip(), "Объясните в stderr, что не так"


        # --- .gitignore ---

        @pytest.mark.parametrize("path, ignored", [
            (".env", True),
            ("app/.env", True),
            (".env.example", False),
            (".venv/bin/python", True),
            ("src/pkg/__pycache__/m.cpython-312.pyc", True),
            ("tools/x.pyc", True),
            (".pytest_cache/v/cache", True),
            ("dist/fxcli-0.1.0.whl", True),
            ("src/fxcli/client.py", False),
            ("README.md", False),
        ])
        def test_gitignore(repo, path, ignored):
            shutil.copy(HERE / ".gitignore", repo / ".gitignore")
            write(repo, path, "x\n")
            result = subprocess.run(["git", "check-ignore", "-q", path], cwd=repo)
            assert (result.returncode == 0) == ignored, f"{path}: ожидалось {'игнорировать' if ignored else 'не игнорировать'}"
