title: "Практикум: первые шаги"
description: |
  Вопросы и задачи по всему блоку: print(), переменные, числа, строки, ввод и ошибки.
  У вопросов одна попытка. Порог прохождения — 70%. Последняя задача — мини-проект «Калькулятор чаевых и деления счёта».
pass_threshold: 0.7
questions:
  - id: q1
    type: output
    prompt: "Что выведет код?"
    code: |
      print("x", "y", sep="", end="!")
      print("z")
    options:
      - text: "`xy!z`"
        correct: true
        why: "sep=\"\" склеивает x и y, end=\"!\" заменяет перевод строки на «!», затем z."
      - text: |
          ```
          xy!
          z
          ```
        why: "Перевод строки заменён на «!», поэтому z продолжает ту же строку."
      - text: "`x y!z`"
        why: "sep=\"\" — пустой разделитель, пробела нет."
    explanation: "sep — между аргументами, end — в конце вывода конкретного print()."

  - id: q2
    type: single
    prompt: "Что делает интерпретатор, если в последней строке файла синтаксическая ошибка?"
    options:
      - text: "Не выполняет ни одной строки и сообщает об ошибке"
        correct: true
        why: "Синтаксис проверяется при разборе всего файла до выполнения."
      - text: "Выполняет все строки, кроме последней"
        why: "До выполнения дело не доходит."
      - text: "Пропускает ошибочную строку"
        why: "Python не пропускает ошибки."
    explanation: "SyntaxError обнаруживается до запуска, поэтому программа не выполняет ничего."

  - id: q3
    type: output
    prompt: "Что выведет код?"
    code: |
      a = 10
      b = a
      a = a + 5
      print(a, b)
    options:
      - text: "`15 10`"
        correct: true
        why: "`b = a` привязывает b к объекту 10. Затем a перепривязывается к новому объекту 15, а b остаётся на 10."
      - text: "`15 15`"
        why: "b не «следит» за a: она получила значение в момент присваивания."
      - text: "`10 10`"
        why: "a изменилась на 15."
    explanation: "Переменная хранит значение (ссылку на объект), а не формулу."

  - id: q4
    type: multiple
    prompt: "Какие имена допустимы и соответствуют PEP 8 для обычной переменной?"
    options:
      - text: "`max_tokens`"
        correct: true
        why: "snake_case — стиль PEP 8 для переменных."
      - text: "`batch_size2`"
        correct: true
        why: "Цифра не в начале — допустимо, стиль snake_case."
      - text: "`MaxTokens`"
        why: "Синтаксически допустимо, но CapWords в PEP 8 — для классов."
      - text: "`max-tokens`"
        why: "Дефис — это минус, такое имя недопустимо."
      - text: "`for`"
        why: "Ключевое слово."
    explanation: "Переменные — snake_case; константы — UPPER_CASE; классы — CapWords."

  - id: q5
    type: output
    prompt: "Что выведет код?"
    code: |
      print(23 // 4, 23 % 4, 2 ** -1)
    options:
      - text: "`5 3 0.5`"
        correct: true
        why: "23 = 4 × 5 + 3; 2 в степени −1 — это 1/2."
      - text: "`5.75 3 0.5`"
        why: "`//` даёт целое."
      - text: "`5 3 -2`"
        why: "Отрицательная степень — деление, а не умножение на −1."
    explanation: "`//` — целая часть, `%` — остаток, `**` с отрицательным показателем даёт дробь."

  - id: q6
    type: single
    prompt: "Как правильно проверить, что `x = 0.1 + 0.2` равно 0.3?"
    options:
      - text: "`abs(x - 0.3) < 1e-9`"
        correct: true
        why: "Сравнение с допуском учитывает погрешность хранения float."
      - text: "`x == 0.3`"
        why: "Даст False: x = 0.30000000000000004."
      - text: "`int(x) == int(0.3)`"
        why: "Оба дадут 0 — сравнение бессмысленно."
      - text: "`str(x) == \"0.3\"`"
        why: "str(x) = '0.30000000000000004'."
    explanation: "float сравнивают с допуском — это стандартная практика в численных вычислениях и ML."

  - id: q7
    type: output
    prompt: "Что выведет код?"
    code: |
      print(round(4.5), round(5.5), round(-1.5))
    options:
      - text: "`4 6 -2`"
        correct: true
        why: "Банковское округление: середина округляется к ближайшему чётному."
      - text: "`5 6 -1`"
        why: "Python не округляет середину «вверх»."
      - text: "`5 6 -2`"
        why: "round(4.5) = 4 — ближайшее чётное."
    explanation: "round() в Python использует округление к чётному при ровно .5."

  - id: q8
    type: output
    prompt: "Что выведет код?"
    code: |
      word = "ML"
      print(word * 3 + "!" * 2, len(word * 3))
    options:
      - text: "`MLMLML!! 6`"
        correct: true
        why: "Повторение: MLMLML, затем «!!», длина MLMLML — 6 символов."
      - text: "`ML3!2 6`"
        why: "Строку на число не «приклеивают», а повторяют."
      - text: "`MLMLML!! 3`"
        why: "len считает символы, а не повторения."
    explanation: "`*` для строки и int — повторение; len() — число символов."

  - id: q9
    type: find_bug
    prompt: "Что не так в коде?"
    code: |
      path = "C:\new_folder\table.csv"
      print(path)
    options:
      - text: "`\\n` и `\\t` внутри строки превратятся в перевод строки и табуляцию; нужна сырая строка `r\"...\"`"
        correct: true
        why: "Обратная косая черта начинает экранированную последовательность."
      - text: "Пути нельзя хранить в строках"
        why: "Можно, это обычная практика."
      - text: "Нужно использовать одинарные кавычки"
        why: "Вид кавычек не влияет на экранирование."
    explanation: "Для путей Windows используйте `r\"C:\\new_folder\\table.csv\"` или двойные косые черты."

  - id: q10
    type: multiple
    prompt: "Пользователь вводит `3.5`. Какие строки отработают **без ошибки**?"
    options:
      - text: "`float(input())`"
        correct: true
        why: "«3.5» — корректная запись дробного числа."
      - text: "`int(float(input()))`"
        correct: true
        why: "Сначала 3.5, затем int → 3."
      - text: "`input() + \"0\"`"
        correct: true
        why: "Склейка строк: «3.50»."
      - text: "`int(input())`"
        why: "int() не принимает строку с дробной частью → ValueError."
      - text: "`input() + 1`"
        why: "str + int → TypeError."
    explanation: "input() возвращает строку; int() требует строку из целого числа."

  - id: q11
    type: output
    prompt: "Что выведет код?"
    code: |
      x = "7"
      y = int(x) + 3
      z = x + str(3)
      print(y, z)
    answer: "10 73"
    explanation: "int(\"7\") + 3 = 10 (арифметика), \"7\" + \"3\" = \"73\" (склейка)."

  - id: q12
    type: single
    prompt: "Программа выполнилась без сообщений об ошибках, но вывела неверный результат. Какая это ошибка и как её искать?"
    options:
      - text: "Логическая; проверять на примерах с известным ответом и выводить промежуточные значения"
        correct: true
        why: "Логические ошибки не вызывают исключений — их находят тестами и отладочным выводом."
      - text: "Синтаксическая; читать traceback"
        why: "При синтаксической ошибке программа не запустилась бы."
      - text: "Это не ошибка, Python всегда прав"
        why: "Python выполняет то, что написано, — а написано может быть не то, что задумано."
    explanation: "Логическая ошибка — расхождение между намерением и кодом. Помогают тесты, трассировка и print() значений."

  - id: q13
    type: find_bug
    prompt: "Программа должна вывести, сколько полных недель в 100 днях (ожидается 14). Что не так?"
    code: |
      days = 100
      weeks = days / 7
      print(weeks)
    options:
      - text: "`/` даёт дробный результат 14.28…; для полных недель нужен `//`"
        correct: true
        why: "Целочисленное деление отбрасывает неполную неделю."
      - text: "Нужно `days % 7`"
        why: "Это остаток — 2 дня, а не число недель."
      - text: "Нужно `round(days / 7)`"
        why: "round округлит до 14 здесь, но для 104 дней (14.86) даст 15 — а полных недель 14."
    explanation: "«Сколько целых раз помещается» — это `//`; «сколько осталось» — `%`."

tasks:
  - id: t1
    title: "Конвертер валют"
    difficulty: 1
    statement: |
      Программа читает сумму в рублях (дробное число) и курс доллара (дробное число, рублей за 1 доллар).
      Выведите: `<сумма> руб. = <долларов> USD`, где долларов — округлено до 2 знаков, а сумма выводится так, как её прочитал `float()`.
    examples:
      - input: "10000\n92.5"
        output: "10000.0 руб. = 108.11 USD"
    starter: |
      rubles = input()
      rate = input()
    hints:
      - "Оба значения преобразуйте в float."
      - "`print(rubles, \"руб. =\", round(rubles / rate, 2), \"USD\")`."
    solution: |
      rubles = float(input())
      rate = float(input())
      dollars = round(rubles / rate, 2)
      print(rubles, "руб. =", dollars, "USD")
    solution_explanation: "Делим рубли на курс; print через запятую сам расставляет пробелы."
    tests:
      - name: "10000 по 92.5"
        stdin: "10000\n92.5\n"
        stdout: "10000.0 руб. = 108.11 USD"
      - name: "Ровный курс"
        stdin: "500\n100\n"
        stdout: "500.0 руб. = 5.0 USD"
      - name: "Ноль рублей"
        stdin: "0\n90\n"
        stdout: "0.0 руб. = 0.0 USD"
      - name: "Копейки"
        stdin: "99.99\n33.33\n"
        stdout: "99.99 руб. = 3.0 USD"
      - name: "Дробный результат"
        stdin: "1\n3\n"
        stdout: "1.0 руб. = 0.33 USD"

  - id: t2
    title: "Делим пиццу"
    difficulty: 1
    statement: |
      Программа читает три целых числа: количество пицц, кусков в одной пицце и количество людей.
      Все куски делятся поровну, остаток откладывается. Выведите:

      ```text
      Каждому: <кусков на человека>
      Останется: <остаток>
      ```
    examples:
      - input: "3\n8\n5"
        output: "Каждому: 4\nОстанется: 4"
    starter: |
      pizzas = int(input())
      slices = int(input())
      people = int(input())
    hints:
      - "Всего кусков: `pizzas * slices`."
      - "Каждому — `total // people`, остаток — `total % people`."
    solution: |
      pizzas = int(input())
      slices = int(input())
      people = int(input())
      total = pizzas * slices
      print("Каждому:", total // people)
      print("Останется:", total % people)
    solution_explanation: "`//` и `%` — пара операций для деления «поровну с остатком»."
    tests:
      - name: "3 пиццы по 8 на 5 человек"
        stdin: "3\n8\n5\n"
        stdout: "Каждому: 4\nОстанется: 4"
      - name: "Делится поровну"
        stdin: "2\n6\n4\n"
        stdout: "Каждому: 3\nОстанется: 0"
      - name: "Людей больше, чем кусков"
        stdin: "1\n4\n6\n"
        stdout: "Каждому: 0\nОстанется: 4"
      - name: "Один человек"
        stdin: "5\n8\n1\n"
        stdout: "Каждому: 40\nОстанется: 0"
      - name: "Нет пиццы"
        stdin: "0\n8\n3\n"
        stdout: "Каждому: 0\nОстанется: 0"

  - id: t3
    title: "Инициалы"
    difficulty: 2
    statement: |
      Программа читает имя и фамилию (на отдельных строках) и выводит фамилию с инициалом: `<первая буква имени>. <фамилия>`.

      Первый символ строки — `s[0]` (это было в уроке про строки).
    examples:
      - input: "Ада\nЛавлейс"
        output: "А. Лавлейс"
    starter: |
      first_name = input()
      last_name = input()
      print(first_name + " " + last_name)
    hints:
      - "Первая буква имени: `first_name[0]`."
      - "Склейте: инициал, точку, пробел и фамилию."
    solution: |
      first_name = input()
      last_name = input()
      print(first_name[0] + ". " + last_name)
    solution_explanation: "Индекс 0 — первый символ строки. Склейка через `+` позволяет поставить точку вплотную к инициалу."
    tests:
      - name: "Ада Лавлейс"
        stdin: "Ада\nЛавлейс\n"
        stdout: "А. Лавлейс"
      - name: "Латиница"
        stdin: "Guido\nvan Rossum\n"
        stdout: "G. van Rossum"
      - name: "Короткое имя"
        stdin: "Ян\nКум\n"
        stdout: "Я. Кум"
      - name: "Одна буква"
        stdin: "Э\nШмидт\n"
        stdout: "Э. Шмидт"
      - name: "Двойная фамилия"
        stdin: "Мария\nСклодовская-Кюри\n"
        stdout: "М. Склодовская-Кюри"

  - id: t4
    title: "Индекс массы тела"
    difficulty: 2
    statement: |
      Программа читает вес в килограммах (дробное) и рост в сантиметрах (целое). Выведите `ИМТ: <значение>` с округлением до 1 знака.

      `ИМТ = вес / (рост в метрах)²`
    examples:
      - input: "70\n175"
        output: "ИМТ: 22.9"
    starter: |
      weight = float(input())
      height = int(input())
      bmi = weight / height ** 2
      print("ИМТ:", round(bmi, 1))
    hints:
      - "Рост приходит в сантиметрах, а в формуле — метры."
      - "`height_m = height / 100`, затем `weight / height_m ** 2`."
    solution: |
      weight = float(input())
      height = int(input())
      height_m = height / 100
      bmi = weight / height_m ** 2
      print("ИМТ:", round(bmi, 1))
    solution_explanation: "Перевод единиц — классический источник логических ошибок. Отдельная переменная `height_m` делает перевод явным."
    tests:
      - name: "70 кг, 175 см"
        stdin: "70\n175\n"
        stdout: "ИМТ: 22.9"
      - name: "Рост 100 см"
        stdin: "25\n100\n"
        stdout: "ИМТ: 25.0"
      - name: "Дробный вес"
        stdin: "58.5\n160\n"
        stdout: "ИМТ: 22.9"
      - name: "Высокий рост"
        stdin: "95\n200\n"
        stdout: "ИМТ: 23.8"
      - name: "Маленький вес"
        stdin: "45\n170\n"
        stdout: "ИМТ: 15.6"

  - id: t5
    title: "Калькулятор чаевых и деления счёта"
    mini_project: true
    difficulty: 3
    statement: |
      **Мини-проект.** Компания друзей в ресторане хочет разделить счёт с чаевыми.

      Программа читает:

      1. сумму счёта (дробное число);
      2. процент чаевых (целое число);
      3. количество человек (целое, больше нуля).

      И выводит ровно четыре строки (все суммы округлены до 2 знаков):

      ```text
      Счёт: <сумма счёта>
      Чаевые (<процент>%): <сумма чаевых>
      Итого: <счёт + чаевые>
      С каждого: <итого / количество человек>
      ```
    examples:
      - input: "2500\n10\n3"
        output: "Счёт: 2500.0\nЧаевые (10%): 250.0\nИтого: 2750.0\nС каждого: 916.67"
    starter: |
      # 1. Ввод
      bill = float(input("Сумма счёта: "))

      # 2. Вычисления

      # 3. Вывод
    hints:
      - "Чаевые = счёт × процент / 100. Итого = счёт + чаевые. С каждого = итого / людей."
      - "Строку с процентом удобно собрать склейкой: `\"Чаевые (\" + str(tip_percent) + \"%):\"`, а значение передать в print через запятую."
    solution: |
      # 1. Ввод
      bill = float(input("Сумма счёта: "))
      tip_percent = int(input("Чаевые, %: "))
      people = int(input("Количество человек: "))

      # 2. Вычисления
      tip = bill * tip_percent / 100
      total = bill + tip
      per_person = total / people

      # 3. Вывод
      print("Счёт:", round(bill, 2))
      print("Чаевые (" + str(tip_percent) + "%):", round(tip, 2))
      print("Итого:", round(total, 2))
      print("С каждого:", round(per_person, 2))
    solution_explanation: |
      Программа следует схеме «ввод → вычисления → вывод». Округляем только при выводе: если округлять промежуточные значения, ошибки округления накапливаются и итог «с каждого» может не сойтись.

      Приглашения в `input()` делают программу удобной для человека и не мешают проверке. Строку с процентом собираем склейкой, чтобы `%` встал вплотную к числу.
    tests:
      - name: "Пример из условия"
        stdin: "2500\n10\n3\n"
        stdout: "Счёт: 2500.0\nЧаевые (10%): 250.0\nИтого: 2750.0\nС каждого: 916.67"
      - name: "Без чаевых"
        stdin: "1000\n0\n4\n"
        stdout: "Счёт: 1000.0\nЧаевые (0%): 0.0\nИтого: 1000.0\nС каждого: 250.0"
      - name: "Один человек"
        stdin: "1234.5\n16\n1\n"
        stdout: "Счёт: 1234.5\nЧаевые (16%): 197.52\nИтого: 1432.02\nС каждого: 1432.02"
      - name: "Копейки в счёте"
        stdin: "999.99\n12\n7\n"
        stdout: "Счёт: 999.99\nЧаевые (12%): 120.0\nИтого: 1119.99\nС каждого: 160.0"
      - name: "Большая компания"
        stdin: "15000\n20\n12\n"
        stdout: "Счёт: 15000.0\nЧаевые (20%): 3000.0\nИтого: 18000.0\nС каждого: 1500.0"
      - name: "Щедрые чаевые"
        stdin: "100\n100\n2\n"
        stdout: "Счёт: 100.0\nЧаевые (100%): 100.0\nИтого: 200.0\nС каждого: 100.0"
