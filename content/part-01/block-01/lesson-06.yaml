questions:
  - id: q1
    type: single
    prompt: "С чего правильно начинать чтение traceback?"
    options:
      - text: "С последней строки: тип исключения и сообщение"
        correct: true
        why: "Последняя строка говорит, ЧТО случилось, — это главная подсказка."
      - text: "С первой строки `Traceback (most recent call last):`"
        why: "Это просто заголовок, информации о причине в нём нет."
      - text: "С середины — там всегда причина"
        why: "В середине — цепочка вызовов; она нужна после того, как понятен тип ошибки."
      - text: "Traceback читать не нужно — достаточно перезапустить программу"
        why: "Без исправления ошибка повторится."
    explanation: "Порядок: последняя строка (что) → строка кода (где именно) → файл и номер строки (куда идти)."

  - id: q2
    type: multiple
    prompt: "Какие ошибки Python обнаружит **до выполнения первой строки** программы? Выберите все."
    options:
      - text: "`SyntaxError`"
        correct: true
        why: "Синтаксис проверяется при разборе всего файла перед запуском."
      - text: "`IndentationError`"
        correct: true
        why: "Это разновидность синтаксической ошибки — тоже до запуска."
      - text: "`NameError`"
        why: "Имя ищется в момент выполнения строки, предыдущие строки успеют выполниться."
      - text: "`ZeroDivisionError`"
        why: "Деление выполняется во время работы программы."
      - text: "`ValueError`"
        why: "Например, `int(\"abc\")` — ошибка проявится только при выполнении."
    explanation: "Синтаксические ошибки ловятся при разборе файла, поэтому программа с ними не выполнит ни одной строки. Остальные — исключения во время выполнения."

  - id: q3
    type: output
    prompt: "Что выведет код?"
    code: |
      # print("A")
      print("B")  # print("C")
      x = 5  # x = 10
      print(x)
    options:
      - text: |
          ```
          B
          5
          ```
        correct: true
        why: "Всё после `#` игнорируется: первая строка целиком, `print(\"C\")` и `x = 10`."
      - text: |
          ```
          A
          B
          C
          10
          ```
        why: "Закомментированный код не выполняется."
      - text: |
          ```
          B
          10
          ```
        why: "`x = 10` находится в комментарии, x остаётся 5."
    explanation: "`#` отключает всё до конца строки — как целые строки, так и хвосты строк с кодом."

  - id: q4
    type: find_bug
    prompt: "Программа падает с `TypeError`. В чём причина?"
    code: |
      items = 3
      price = 199.9
      total = items * price
      print("Сумма: " + total)
    options:
      - text: "В строке 4 строка склеивается с числом `total`; нужно `str(total)` или запятая в print"
        correct: true
        why: "`\"Сумма: \" + 599.7` — str + float → TypeError."
      - text: "В строке 3 нельзя умножать int на float"
        why: "Можно: результат float 599.7."
      - text: "Переменная price должна быть целой"
        why: "Дробная цена допустима."
      - text: "Ошибка в строке 1: items нужно писать в кавычках"
        why: "Тогда умножение превратилось бы в повторение строки — это другая ошибка."
    explanation: "Traceback укажет на строку 4 и сообщение `can only concatenate str (not \"float\") to str`."

  - id: q5
    type: single
    prompt: "Что означает сообщение `ValueError: invalid literal for int() with base 10: 'abc'`?"
    options:
      - text: "В int() передали строку, которую нельзя превратить в целое число"
        correct: true
        why: "Тип аргумента подходящий (str), но содержимое — не число."
      - text: "Переменная int не определена"
        why: "Это был бы NameError."
      - text: "Число слишком большое"
        why: "int в Python не ограничен по размеру."
      - text: "Нужно использовать десятичную систему"
        why: "«base 10» — это просто указание системы счисления, проблема в содержимом строки."
    explanation: "ValueError — «тип правильный, значение нет». Чаще всего так бывает, когда пользователь ввёл не то, что ожидала программа."

  - id: q6
    type: output
    prompt: "Что произойдёт при запуске?"
    code: |
      print("Старт")
      print(10 / 0)
      print("Финиш")
    options:
      - text: "Выведется `Старт`, затем возникнет ошибка ZeroDivisionError, `Финиш` не выведется"
        correct: true
        why: "Строки до ошибки выполняются, на ошибке программа останавливается."
      - text: "Ничего не выведется: Python найдёт ошибку до запуска"
        why: "Деление на ноль — ошибка выполнения, а не синтаксиса."
      - text: "Выведется `Старт`, `0` и `Финиш`"
        why: "Деление на ноль не даёт 0 — это исключение."
      - text: "Выведется `Старт` и `Финиш`, ошибочная строка пропустится"
        why: "Python не пропускает ошибки — программа прерывается."
    explanation: "Исключение прерывает выполнение в месте ошибки. Перехватывать исключения вы научитесь в блоке 1.7 (try/except)."

tasks:
  - id: t1
    title: "Исправь синтаксис"
    difficulty: 1
    statement: |
      Программа должна прочитать два целых числа и вывести:

      ```text
      Сумма: <a + b>
      Произведение: <a * b>
      ```

      В заготовке три синтаксические ошибки. Найдите и исправьте их, не меняя логику.
    examples:
      - input: "3\n4"
        output: "Сумма: 7\nПроизведение: 12"
    starter: |
      a = int(input()
      b = int(input())
      print("Сумма:" a + b)
      print("Произведение:", a * b
    hints:
      - "Запустите код и прочитайте первую ошибку. Исправьте её и запустите снова — ошибки находятся по одной."
      - "Проверьте парность скобок в строках 1 и 4 и разделитель аргументов в строке 3."
    solution: |
      a = int(input())
      b = int(input())
      print("Сумма:", a + b)
      print("Произведение:", a * b)
    solution_explanation: "Ошибки: незакрытая скобка в строке 1, пропущенная запятая между аргументами в строке 3, незакрытая скобка в строке 4. Python показывает синтаксические ошибки по одной — исправляйте и перезапускайте."
    tests:
      - name: "3 и 4"
        stdin: "3\n4\n"
        stdout: "Сумма: 7\nПроизведение: 12"
      - name: "С нулём"
        stdin: "0\n9\n"
        stdout: "Сумма: 9\nПроизведение: 0"
      - name: "Отрицательные"
        stdin: "-2\n-5\n"
        stdout: "Сумма: -7\nПроизведение: 10"
      - name: "Разные знаки"
        stdin: "6\n-3\n"
        stdout: "Сумма: 3\nПроизведение: -18"
      - name: "Большие"
        stdin: "1000\n1000\n"
        stdout: "Сумма: 2000\nПроизведение: 1000000"

  - id: t2
    title: "Исправь ошибки выполнения"
    difficulty: 2
    statement: |
      Программа читает цену товара (дробное число) и количество (целое) и выводит:

      ```text
      Итого: <цена × количество, округлённая до 2 знаков>
      Скидка: <10% от итога, округлённая до 2 знаков>
      ```

      Синтаксис в заготовке верный, но при запуске она падает. Исправьте все ошибки выполнения.
    examples:
      - input: "199.9\n3"
        output: "Итого: 599.7\nСкидка: 59.97"
    starter: |
      price = float(input())
      quantity = int(input())
      total = round(price * quantity, 2)
      print("Итого: " + total)
      discount = round(totl * 0.1, 2)
      print("Скидка:", discount)
    hints:
      - "Первая ошибка — TypeError в строке 4: строку нельзя склеить с числом."
      - "После её исправления появится NameError — внимательно сравните имена переменных."
    solution: |
      price = float(input())
      quantity = int(input())
      total = round(price * quantity, 2)
      print("Итого:", total)
      discount = round(total * 0.1, 2)
      print("Скидка:", discount)
    solution_explanation: "TypeError исправляется передачей значений в print через запятую (или `str(total)`), NameError — исправлением опечатки `totl` → `total`. Исключения тоже появляются по одному: программа останавливается на первом."
    tests:
      - name: "199.9 × 3"
        stdin: "199.9\n3\n"
        stdout: "Итого: 599.7\nСкидка: 59.97"
      - name: "Один товар"
        stdin: "100\n1\n"
        stdout: "Итого: 100.0\nСкидка: 10.0"
      - name: "Ноль штук"
        stdin: "50.5\n0\n"
        stdout: "Итого: 0.0\nСкидка: 0.0"
      - name: "Много товаров"
        stdin: "12.34\n100\n"
        stdout: "Итого: 1234.0\nСкидка: 123.4"
      - name: "Копейки"
        stdin: "0.99\n7\n"
        stdout: "Итого: 6.93\nСкидка: 0.69"

  - id: t3
    title: "Найди логическую ошибку"
    difficulty: 2
    statement: |
      Программа должна читать три оценки (целые числа) и выводить их среднее, округлённое до 2 знаков:
      `Среднее: <значение>`. Программа запускается без ошибок, но результат неверный. Исправьте.
    examples:
      - input: "4\n5\n3"
        output: "Среднее: 4.0"
    starter: |
      a = int(input())
      b = int(input())
      c = int(input())
      average = a + b + c / 3
      print("Среднее:", round(average, 2))
    hints:
      - "Проверьте на примере из условия: что получается вместо 4.0? Какая операция выполняется первой?"
      - "Нужны скобки: `(a + b + c) / 3`."
    solution: |
      a = int(input())
      b = int(input())
      c = int(input())
      average = (a + b + c) / 3
      print("Среднее:", round(average, 2))
    solution_explanation: "Деление старше сложения, поэтому без скобок делилась только `c`. Логические ошибки не дают traceback — их находят проверкой на примерах с известным ответом."
    tests:
      - name: "4, 5, 3"
        stdin: "4\n5\n3\n"
        stdout: "Среднее: 4.0"
      - name: "Одинаковые"
        stdin: "5\n5\n5\n"
        stdout: "Среднее: 5.0"
      - name: "Дробное среднее"
        stdin: "5\n4\n4\n"
        stdout: "Среднее: 4.33"
      - name: "Нули"
        stdin: "0\n0\n0\n"
        stdout: "Среднее: 0.0"
      - name: "Округление вверх"
        stdin: "2\n3\n3\n"
        stdout: "Среднее: 2.67"

  - id: t4
    title: "Отладка конвертера времени"
    difficulty: 3
    statement: |
      Программа читает количество минут (целое, не меньше нуля) и выводит `<часы> ч <минуты> мин`, например `125` → `2 ч 5 мин`.
      В заготовке **три** ошибки разных видов: синтаксическая, логическая и ошибка выполнения. Найдите все.
    examples:
      - input: "125"
        output: "2 ч 5 мин"
      - input: "59"
        output: "0 ч 59 мин"
    starter: |
      total = int(input())
      hours = total / 60
      minutes = total % 6O
      print(str(hours) + " ч " + minutes + " мин")
    hints:
      - "`6O` в строке 3 — это не шестьдесят. Присмотритесь к последнему символу. А какой результат даёт `/`?"
      - "Часы должны быть целыми — нужно `//`. И в print склейка требует, чтобы все части были строками."
    solution: |
      total = int(input())
      hours = total // 60
      minutes = total % 60
      print(str(hours) + " ч " + str(minutes) + " мин")
    solution_explanation: "Ошибки: `6O` с буквой O вместо нуля — SyntaxError (invalid decimal literal), его Python находит до запуска; `/` вместо `//` — логическая ошибка, часы получаются дробными (`2.0833333333333335 ч`), и её видно только по неверному выводу; склейка строки с числом `minutes` — TypeError во время выполнения."
    tests:
      - name: "125 минут"
        stdin: "125\n"
        stdout: "2 ч 5 мин"
      - name: "Меньше часа"
        stdin: "59\n"
        stdout: "0 ч 59 мин"
      - name: "Ровно час"
        stdin: "60\n"
        stdout: "1 ч 0 мин"
      - name: "Ноль"
        stdin: "0\n"
        stdout: "0 ч 0 мин"
      - name: "Сутки"
        stdin: "1440\n"
        stdout: "24 ч 0 мин"
      - name: "Много часов"
        stdin: "1000\n"
        stdout: "16 ч 40 мин"
