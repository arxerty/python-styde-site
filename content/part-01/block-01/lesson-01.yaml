questions:
  - id: q1
    type: single
    prompt: "Что делает интерпретатор Python, когда вы запускаете программу?"
    options:
      - text: "Проверяет синтаксис, переводит код в байт-код и выполняет его строка за строкой сверху вниз"
        correct: true
        why: "Именно так: сначала проверка синтаксиса, затем перевод в байт-код и выполнение по порядку."
      - text: "Выполняет строки в случайном порядке, чтобы ускорить работу"
        why: "Порядок выполнения строго сверху вниз — иначе программы были бы непредсказуемы."
      - text: "Сначала выполняет все строки с print(), потом остальные"
        why: "У print() нет особого приоритета, это обычная инструкция в общем порядке."
      - text: "Целиком компилирует программу в машинный код, как C++"
        why: "Так работают компилируемые языки. Python переводит код в байт-код и интерпретирует его."
    explanation: "Интерпретатор читает файл, проверяет синтаксис (при ошибке ничего не выполняется), переводит код в байт-код и выполняет инструкции по порядку."

  - id: q2
    type: output
    prompt: "Что выведет этот код?"
    code: |
      print("a", "b", "c", sep="-")
    options:
      - text: "`a-b-c`"
        correct: true
        why: "`sep` вставляется между соседними значениями: a, -, b, -, c."
      - text: "`a b c`"
        why: "Пробел — разделитель по умолчанию, но здесь задан `sep=\"-\"`."
      - text: "`-a-b-c-`"
        why: "Разделитель ставится только между значениями, не по краям."
      - text: "`abc-`"
        why: "Это было бы похоже на действие `end`, а не `sep`."
    explanation: "`sep` — разделитель между аргументами print(). По умолчанию это пробел."

  - id: q3
    type: multiple
    prompt: "Какие строки вызовут ошибку? Выберите все."
    options:
      - text: "`Print(\"Hi\")`"
        correct: true
        why: "Python различает регистр: `Print` не определено → NameError."
      - text: "`print(Hi)`"
        correct: true
        why: "Без кавычек `Hi` — имя переменной, которой нет → NameError."
      - text: "`print('Hi')`"
        why: "Одинарные кавычки так же допустимы, как двойные."
      - text: "`print(\"Hi\", 5)`"
        why: "print() принимает несколько значений любых типов через запятую."
    explanation: "Регистр букв имеет значение, а текст должен быть в кавычках. Тип кавычек — на ваш выбор."

  - id: q4
    type: find_bug
    prompt: "Почему программа не запустится?"
    code: |
      print("Начало")
      print("Итог:" 42)
    options:
      - text: "Во второй строке нет запятой между `\"Итог:\"` и `42`"
        correct: true
        why: "Аргументы функции разделяются запятыми. Без неё Python не понимает выражение → SyntaxError."
      - text: "Нельзя выводить число и текст одним print()"
        why: "Можно: `print(\"Итог:\", 42)` — корректный код."
      - text: "Первая строка должна быть последней"
        why: "Порядок строк влияет на порядок вывода, но не вызывает ошибку."
      - text: "Число 42 нужно взять в кавычки"
        why: "Можно и так, но настоящая причина ошибки — отсутствующая запятая."
    explanation: "SyntaxError обнаруживается до запуска: даже первая строка не выполнится, потому что интерпретатор сначала проверяет весь файл."

  - id: q5
    type: output
    prompt: "Что выведет этот код?"
    code: |
      print("A", end="")
      print("B")
      print("C")
    options:
      - text: |
          ```
          AB
          C
          ```
        correct: true
        why: "Первый print закончил вывод пустой строкой вместо перевода строки, поэтому B оказалась рядом с A."
      - text: |
          ```
          A
          B
          C
          ```
        why: "Так было бы без `end=\"\"`."
      - text: "`ABC`"
        why: "Второй print() использует `end` по умолчанию — перевод строки, поэтому C на новой строке."
    explanation: "`end` задаёт, чем закончится вывод конкретного print(). По умолчанию — `\\n`."

  - id: q6
    type: output
    prompt: "Введите ответ: что выведет код?"
    code: |
      print(2 + 3, "2 + 3")
    answer: "5 2 + 3"
    explanation: "Первый аргумент без кавычек — выражение, Python вычисляет его (5). Второй — строка, выводится как есть. Между ними пробел (sep по умолчанию)."

tasks:
  - id: t1
    title: "Визитка"
    difficulty: 1
    statement: |
      Выведите ровно три строки:

      ```text
      Привет, мир!
      Я учу Python.
      Цель: AI-инженер
      ```
    examples:
      - input: "(ввода нет)"
        output: "Привет, мир!\nЯ учу Python.\nЦель: AI-инженер"
    starter: |
      print("Привет, мир!")
    hints:
      - "Каждая строка вывода — отдельный вызов `print()`."
      - "Сравните текст посимвольно: точка в конце второй строки, двоеточие в третьей."
    solution: |
      print("Привет, мир!")
      print("Я учу Python.")
      print("Цель: AI-инженер")
    solution_explanation: "Три вызова print() выводят три строки по порядку. Важно точное совпадение текста, включая знаки препинания."
    tests:
      - name: "Полный вывод совпадает"
        stdout: "Привет, мир!\nЯ учу Python.\nЦель: AI-инженер"
      - name: "Первая строка"
        code: |
          lines = __stdout__.strip().splitlines()
          assert lines and lines[0] == "Привет, мир!", "Первая строка должна быть «Привет, мир!»"
      - name: "Вторая строка"
        code: |
          lines = __stdout__.strip().splitlines()
          assert len(lines) > 1 and lines[1] == "Я учу Python.", "Вторая строка должна быть «Я учу Python.»"
      - name: "Ровно три строки"
        code: |
          lines = __stdout__.strip().splitlines()
          assert len(lines) == 3, f"Ожидалось 3 строки, получено {len(lines)}"
      - name: "Нет лишних пробелов по краям"
        code: |
          for line in __stdout__.strip().splitlines():
              assert line == line.strip(), f"Лишние пробелы в строке: {line!r}"

  - id: t2
    title: "Дата через sep"
    difficulty: 1
    statement: |
      Выведите дату `16.10.2026` **одним** вызовом `print()`, передав числа `16`, `10` и `2026` отдельными аргументами и задав подходящий разделитель `sep`.
    examples:
      - input: "(ввода нет)"
        output: "16.10.2026"
    starter: |
      print(16, 10, 2026)
    hints:
      - "Сейчас числа выводятся через пробел. Какой параметр меняет разделитель?"
      - "`print(16, 10, 2026, sep=\".\")`"
    solution: |
      print(16, 10, 2026, sep=".")
    solution_explanation: "`sep` вставляется между аргументами. Числа выводятся без кавычек — print() сам превращает их в текст."
    tests:
      - name: "Вывод — 16.10.2026"
        stdout: "16.10.2026"
      - name: "Используется sep"
        code: |
          assert "sep" in __source__, "Используйте параметр sep"
      - name: "Ровно один print()"
        code: |
          assert __source__.count("print(") == 1, "Нужен ровно один вызов print()"
      - name: "Дата не записана готовой строкой"
        code: |
          assert "16.10" not in __source__, "Передайте числа отдельными аргументами, а не готовой строкой"
      - name: "Одна строка вывода"
        code: |
          assert len(__stdout__.strip().splitlines()) == 1, "Должна быть одна строка"

  - id: t3
    title: "Минуты в неделе"
    difficulty: 1
    statement: |
      Выведите строку `Минут в неделе: 10080`, но **не пишите число 10080 руками** — пусть Python вычислит его как `7 * 24 * 60`.

      Подсказка по формату: текст и число — разные аргументы `print()`.
    examples:
      - input: "(ввода нет)"
        output: "Минут в неделе: 10080"
    starter: |
      print("Минут в неделе:")
    hints:
      - "Добавьте второй аргумент через запятую — выражение `7 * 24 * 60`."
      - "Между аргументами print() сам поставит пробел."
    solution: |
      print("Минут в неделе:", 7 * 24 * 60)
    solution_explanation: "Python сначала вычисляет выражение-аргумент, затем выводит результат. Так код остаётся понятным: видно, откуда взялось число."
    constraints:
      forbid: ["10080"]
      message: "Число должно вычисляться выражением."
    tests:
      - name: "Точный вывод"
        stdout: "Минут в неделе: 10080"
      - name: "Число вычислено"
        code: |
          assert "*" in __source__, "Используйте умножение 7 * 24 * 60"
      - name: "Начало строки"
        code: |
          assert __stdout__.startswith("Минут в неделе:"), "Строка должна начинаться с «Минут в неделе:»"
      - name: "Результат 10080 в выводе"
        stdout_contains: ["10080"]
      - name: "Одна строка"
        code: |
          assert len(__stdout__.strip().splitlines()) == 1

  - id: t4
    title: "Индикатор загрузки"
    difficulty: 2
    statement: |
      Выведите ровно две строки:

      ```text
      Загрузка: 25% 50% 75% 100%
      Готово
      ```

      Условие: первую строку соберите из **пяти** вызовов `print()` (по одному на каждый кусок: `Загрузка:`, `25%`, `50%`, `75%`, `100%`), используя параметр `end`.
    examples:
      - input: "(ввода нет)"
        output: "Загрузка: 25% 50% 75% 100%\nГотово"
    starter: |
      print("Загрузка:")
      print("25%")
      print("50%")
      print("75%")
      print("100%")
      print("Готово")
    hints:
      - "Чтобы следующий print() продолжил ту же строку, передайте `end=\" \"` — пробел вместо перевода строки."
      - "Последний кусок (`100%`) должен закончиться обычным переводом строки — не меняйте у него `end`."
    solution: |
      print("Загрузка:", end=" ")
      print("25%", end=" ")
      print("50%", end=" ")
      print("75%", end=" ")
      print("100%")
      print("Готово")
    solution_explanation: "`end=\" \"` заменяет перевод строки пробелом, и следующий вывод продолжает строку. У `100%` end по умолчанию — `\\n`, поэтому «Готово» начинается с новой строки. Так работают индикаторы прогресса и стриминг ответов LLM."
    tests:
      - name: "Точный вывод"
        stdout: "Загрузка: 25% 50% 75% 100%\nГотово"
      - name: "Используется end"
        code: |
          assert "end=" in __source__.replace(" ", ""), "Используйте параметр end"
      - name: "Шесть вызовов print()"
        code: |
          assert __source__.count("print(") >= 6, "Первая строка — из пяти print(), плюс print() для «Готово»"
      - name: "Ровно две строки"
        code: |
          assert len(__stdout__.strip().splitlines()) == 2, "Должно получиться две строки"
      - name: "Первая строка заканчивается на 100%"
        code: |
          first = __stdout__.split("\n")[0]
          assert first.endswith("100%"), f"Первая строка должна заканчиваться на 100%, а сейчас: {first!r}"
