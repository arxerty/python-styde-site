questions:
  - id: q1
    type: output
    prompt: "Что выведет код?"
    code: |
      print("ab" + "cd" * 2)
    options:
      - text: "`abcdcd`"
        correct: true
        why: "Повторение `*` старше склейки `+`: сначала `\"cd\" * 2` = `cdcd`, затем `ab` + `cdcd`."
      - text: "`abcdabcd`"
        why: "Так было бы для `(\"ab\" + \"cd\") * 2` — со скобками."
      - text: "`abcd2`"
        why: "Строка умножается на число — это повторение, а не приклеивание цифры."
      - text: "Ошибку TypeError"
        why: "Строку можно умножать на целое число."
    explanation: "Для строк действует тот же приоритет, что и для чисел: `*` выполняется раньше `+`."

  - id: q2
    type: single
    prompt: "Чему равно `len(\"Привет, мир!\")`?"
    options:
      - text: "12"
        correct: true
        why: "6 букв «Привет», запятая, пробел, 3 буквы «мир» и «!»: 6 + 1 + 1 + 3 + 1 = 12."
      - text: "10"
        why: "Запятая, пробел и восклицательный знак тоже символы."
      - text: "2"
        why: "len() считает символы, а не слова."
      - text: "14"
        why: "Кавычки не входят в строку — они лишь обозначают её границы в коде."
    explanation: "len() возвращает количество символов, включая пробелы и знаки препинания."

  - id: q3
    type: find_bug
    prompt: "Почему код падает с ошибкой?"
    code: |
      age = 25
      print("Мне " + age + " лет")
    options:
      - text: "Нельзя склеить строку с числом: нужно `str(age)`"
        correct: true
        why: "`+` между str и int даёт TypeError. `\"Мне \" + str(age) + \" лет\"` работает."
      - text: "В print() нельзя использовать `+`"
        why: "Можно: аргумент вычисляется перед выводом."
      - text: "Строки нужно писать в одинарных кавычках"
        why: "Вид кавычек не важен."
      - text: "Переменная age должна называться Age"
        why: "Имя не связано с ошибкой."
    explanation: "Python не превращает типы неявно при `+`. Варианты исправления: `str(age)` или `print(\"Мне\", age, \"лет\")`."

  - id: q4
    type: multiple
    prompt: "Какие строки кода корректно создают строку? Выберите все."
    options:
      - text: "`s = 'текст'`"
        correct: true
        why: "Одинарные кавычки — обычная запись строки."
      - text: "`s = \"\"\"многострочный текст\"\"\"`"
        correct: true
        why: "Тройные кавычки допускают многострочный текст."
      - text: "`s = \"Он сказал: \\\"да\\\"\"`"
        correct: true
        why: "Внутренние кавычки экранированы обратной косой чертой."
      - text: "`s = 'It's ok'`"
        why: "Апостроф закрывает строку раньше времени → SyntaxError."
      - text: "`s = текст`"
        why: "Без кавычек это имя переменной, а не строка."
    explanation: "Выбирайте внешние кавычки, которых нет внутри текста, или экранируйте внутренние."

  - id: q5
    type: output
    prompt: "Что выведет код?"
    code: |
      print(len(""), len(" "), len("a\nb"))
    options:
      - text: "`0 1 3`"
        correct: true
        why: "Пустая строка — 0 символов, пробел — 1, `\\n` — один символ перевода строки."
      - text: "`0 0 4`"
        why: "Пробел — полноценный символ, а `\\n` — один символ, хотя в коде записан двумя знаками."
      - text: "`1 1 3`"
        why: "В пустой строке нет ни одного символа."
    explanation: "Экранированная последовательность в коде занимает два знака, но в строке это один символ."

  - id: q6
    type: output
    prompt: "Что выведет код?"
    code: |
      arrow = "=" * 3 + ">"
      print(arrow * 2)
    answer: "===>===>"
    explanation: "Сначала собирается `===>`, затем строка повторяется дважды."

tasks:
  - id: t1
    title: "Приветствие через склейку"
    difficulty: 1
    statement: |
      Переменная `name` уже задана. Выведите `Привет, <name>!`, собрав строку **оператором `+`** (а не запятыми в print).
    examples:
      - input: 'name = "Ада"'
        output: "Привет, Ада!"
    setup: |
      name = "Ада"
    starter: |
      greeting = ""
      print(greeting)
    hints:
      - "Склейте три части: `\"Привет, \"`, `name` и `\"!\"`."
      - "Не забудьте пробел после запятой — он должен быть внутри первой строки."
    solution: |
      greeting = "Привет, " + name + "!"
      print(greeting)
    solution_explanation: "`+` склеивает строки вплотную, поэтому пробел включаем в литерал `\"Привет, \"`."
    constraints:
      require: ["+"]
    tests:
      - name: "Ада"
        stdout: "Привет, Ада!"
      - name: "Латиница"
        setup: 'name = "Guido"'
        stdout: "Привет, Guido!"
      - name: "Имя из двух слов"
        setup: 'name = "Анна Мария"'
        stdout: "Привет, Анна Мария!"
      - name: "Пустое имя"
        setup: 'name = ""'
        stdout: "Привет, !"
      - name: "Длинное имя"
        setup: 'name = "Александра"'
        stdout: "Привет, Александра!"

  - id: t2
    title: "Рамка вокруг слова"
    difficulty: 2
    statement: |
      Переменная `word` уже задана. Выведите её в рамке. Ширина рамки зависит от длины слова:

      ```text
      +--------+
      | Python |
      +--------+
      ```

      Количество `-` равно длине слова плюс 2 (по пробелу с каждой стороны).
    examples:
      - input: 'word = "Python"'
        output: "+--------+\n| Python |\n+--------+"
      - input: 'word = "AI"'
        output: "+----+\n| AI |\n+----+"
    setup: |
      word = "Python"
    starter: |
      print("+------+")
      print("| " + word + " |")
      print("+------+")
    hints:
      - "Граница — это `\"+\" + \"-\" * число + \"+\"`."
      - "Число дефисов: `len(word) + 2`. Сохраните границу в переменную, чтобы не писать её дважды."
    solution: |
      border = "+" + "-" * (len(word) + 2) + "+"
      print(border)
      print("| " + word + " |")
      print(border)
    solution_explanation: "Длина рамки вычисляется из длины слова, поэтому код работает для любого `word`. Скобки вокруг `len(word) + 2` обязательны: иначе умножение выполнится раньше сложения."
    tests:
      - name: "Python"
        stdout: "+--------+\n| Python |\n+--------+"
      - name: "Короткое слово"
        setup: 'word = "AI"'
        stdout: "+----+\n| AI |\n+----+"
      - name: "Одна буква"
        setup: 'word = "x"'
        stdout: "+---+\n| x |\n+---+"
      - name: "Кириллица"
        setup: 'word = "Нейросеть"'
        stdout: "+-----------+\n| Нейросеть |\n+-----------+"
      - name: "С пробелом внутри"
        setup: 'word = "big data"'
        stdout: "+----------+\n| big data |\n+----------+"
      - name: "Пустое слово"
        setup: 'word = ""'
        stdout: "+--+\n|  |\n+--+"

  - id: t3
    title: "Сборка промпта"
    difficulty: 2
    statement: |
      Заданы две строки: `system` (инструкция для модели) и `question` (вопрос пользователя).
      Создайте переменные:

      - `prompt` — строка вида `<system>`, перевод строки, `Вопрос: <question>`;
      - `prompt_length` — длина `prompt` в символах.

      Выведите `prompt`, а затем строку `Символов: <prompt_length>`.
    examples:
      - input: 'system = "Отвечай кратко.", question = "Что такое AI?"'
        output: "Отвечай кратко.\nВопрос: Что такое AI?\nСимволов: 37"
    setup: |
      system = "Отвечай кратко."
      question = "Что такое AI?"
    starter: |
      prompt = system + question
      print(prompt)
    hints:
      - "Перевод строки внутри строки — `\"\\n\"`. Склейте: `system + \"\\n\" + \"Вопрос: \" + question`."
      - "Для последней строки: `print(\"Символов:\", prompt_length)`."
    solution: |
      prompt = system + "\n" + "Вопрос: " + question
      prompt_length = len(prompt)
      print(prompt)
      print("Символов:", prompt_length)
    solution_explanation: "`\\n` — один символ, поэтому он учитывается в длине. Длину вычисляем от готового промпта, а не складываем длины частей вручную — так меньше шансов ошибиться."
    tests:
      - name: "Пример из условия"
        stdout: "Отвечай кратко.\nВопрос: Что такое AI?\nСимволов: 37"
      - name: "Переменная prompt"
        code: |
          assert prompt == "Отвечай кратко.\nВопрос: Что такое AI?", f"prompt = {prompt!r}"
      - name: "Переменная prompt_length"
        setup: |
          system = "Ты — помощник."
          question = "Привет"
        code: |
          assert prompt_length == len("Ты — помощник.\nВопрос: Привет"), f"prompt_length = {prompt_length!r}"
      - name: "Пустой вопрос"
        setup: |
          system = "A"
          question = ""
        stdout: "A\nВопрос:\nСимволов: 10"
      - name: "Длинная инструкция"
        setup: |
          system = "Ты эксперт по машинному обучению. Объясняй на примерах."
          question = "Что такое градиент?"
        code: |
          expected = system + "\nВопрос: " + question
          assert prompt == expected and prompt_length == len(expected)

  - id: t4
    title: "Заголовок по центру"
    difficulty: 3
    statement: |
      Заданы `title` (текст заголовка) и `width` (ширина строки, не меньше `len(title) + 2`).
      Выведите строку длиной ровно `width`: заголовок, окружённый пробелами, а оставшееся место заполнено знаками `=` слева и справа.
      Если поровну разделить нельзя, лишний `=` ставится **справа**.

      Формат: `<слева =><пробел><title><пробел><справа =>`
    examples:
      - input: 'title = "Отчёт", width = 15'
        output: "==== Отчёт ===="
      - input: 'title = "AI", width = 9'
        output: "== AI ==="
    setup: |
      title = "Отчёт"
      width = 15
    starter: |
      print("=" * 4 + " " + title + " " + "=" * 4)
    hints:
      - "Сколько всего `=`: `width - len(title) - 2` (минус два пробела)."
      - "Слева — `total // 2`, справа — всё остальное: `total - left`."
    solution: |
      total = width - len(title) - 2
      left = total // 2
      right = total - left
      print("=" * left + " " + title + " " + "=" * right)
    solution_explanation: "Сначала считаем, сколько места занимают знаки `=` в сумме. Целочисленное деление даёт левую часть (меньшую при нечётном количестве), а правая — остаток до целого. Так длина строки всегда ровно `width`."
    tests:
      - name: "Отчёт, ширина 15"
        stdout: "==== Отчёт ===="
      - name: "Нечётный остаток"
        setup: |
          title = "AI"
          width = 9
        stdout: "== AI ==="
      - name: "Без знаков ="
        setup: |
          title = "Ровно"
          width = 7
        stdout: " Ровно"
      - name: "Широкая строка"
        setup: |
          title = "Итоги"
          width = 30
        code: |
          line = __stdout__.rstrip("\n")
          assert len(line) == 30, f"Длина строки должна быть 30, получено {len(line)}"
          assert line == "=" * 11 + " Итоги " + "=" * 12, f"Получено: {line!r}"
      - name: "Один = справа"
        setup: |
          title = "x"
          width = 4
        stdout: " x ="
