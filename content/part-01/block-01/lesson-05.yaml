questions:
  - id: q1
    type: single
    prompt: "Пользователь ввёл `42`. Какой тип у значения, которое вернёт `input()`?"
    options:
      - text: "`str`"
        correct: true
        why: "input() всегда возвращает строку, что бы ни ввёл пользователь."
      - text: "`int`"
        why: "Python не угадывает тип. Чтобы получить int, нужно `int(input())`."
      - text: "`float`"
        why: "Преобразование в число — всегда явное."
      - text: "Зависит от того, что ввели"
        why: "Нет: тип результата input() всегда один — str."
    explanation: "input() возвращает строку. Для вычислений её нужно преобразовать: `int()` или `float()`."

  - id: q2
    type: output
    prompt: "Что выведет код?"
    code: |
      x = "5"
      y = 3
      print(int(x) * y, x * y)
    options:
      - text: "`15 555`"
        correct: true
        why: "`int(\"5\") * 3` = 15 (арифметика), `\"5\" * 3` = `555` (повторение строки)."
      - text: "`15 15`"
        why: "Во втором выражении x — строка, умножение строки на число её повторяет."
      - text: "`555 555`"
        why: "В первом выражении строка преобразована в число."
      - text: "Ошибку TypeError"
        why: "Строку можно умножать на целое число."
    explanation: "Результат операции определяется типами: число × число — умножение, строка × число — повторение."

  - id: q3
    type: find_bug
    prompt: "Программа должна вывести возраст через год. Почему она падает?"
    code: |
      age = input("Сколько вам лет? ")
      print(age + 1)
    options:
      - text: "`age` — строка, её нельзя сложить с числом; нужно `int(input(...))`"
        correct: true
        why: "input() возвращает str, а `str + int` даёт TypeError."
      - text: "У input() не может быть текста в скобках"
        why: "Может: это приглашение к вводу."
      - text: "Нужно писать `print(age, + 1)`"
        why: "Это синтаксически странная запись, проблему типов она не решает."
      - text: "Переменная должна называться `user_age`"
        why: "Имя не влияет на ошибку."
    explanation: "Решение: `age = int(input(\"Сколько вам лет? \"))` — преобразование сразу при вводе."

  - id: q4
    type: multiple
    prompt: "Какие вызовы вызовут `ValueError`? Выберите все."
    options:
      - text: "`int(\"4.2\")`"
        correct: true
        why: "int() не понимает строку с дробной частью."
      - text: "`float(\"abc\")`"
        correct: true
        why: "Строка не похожа на число."
      - text: "`float(\"4,2\")`"
        correct: true
        why: "Python ожидает точку, а не запятую."
      - text: "`int(\" 7 \")`"
        why: "Пробелы по краям игнорируются — результат 7."
      - text: "`float(\"4.2\")`"
        why: "Корректная запись дробного числа — 4.2."
      - text: "`int(4.9)`"
        why: "Из числа float int() берёт целую часть: 4. Ошибки нет."
    explanation: "ValueError — значение подходящего типа (строка), но содержимое нельзя превратить в число."

  - id: q5
    type: output
    prompt: "Что выведет код?"
    code: |
      print(int(float("3.99")) + int("2"))
    options:
      - text: "`5`"
        correct: true
        why: "float(\"3.99\") = 3.99, int(3.99) = 3 (отбрасывание), 3 + 2 = 5."
      - text: "`6`"
        why: "int() не округляет, а отбрасывает дробную часть."
      - text: "`5.99`"
        why: "После int() дробной части уже нет."
      - text: "`32`"
        why: "Здесь складываются числа, а не склеиваются строки."
    explanation: "Преобразования читаются изнутри наружу: строка → float → int."

  - id: q6
    type: output
    prompt: "Что выведет код?"
    code: |
      a = str(10)
      b = str(5)
      print(a + b, len(a + b))
    answer: "105 3"
    explanation: "`str(10) + str(5)` — склейка строк `\"10\"` и `\"5\"` = `\"105\"`, длина — 3 символа."

tasks:
  - id: t1
    title: "Площадь прямоугольника"
    difficulty: 1
    statement: |
      Программа читает два целых числа — ширину и высоту прямоугольника (каждое на своей строке) — и выводит его площадь.
    examples:
      - input: "4\n5"
        output: "20"
    starter: |
      width = input()
      height = input()
      print(width * height)
    hints:
      - "Сейчас width и height — строки. Что будет при умножении двух строк?"
      - "`width = int(input())`."
    solution: |
      width = int(input())
      height = int(input())
      print(width * height)
    solution_explanation: "Ввод преобразуется в int сразу при чтении, после этого умножение — арифметическое."
    tests:
      - name: "4 × 5"
        stdin: "4\n5\n"
        stdout: "20"
      - name: "Квадрат"
        stdin: "7\n7\n"
        stdout: "49"
      - name: "Нулевая сторона"
        stdin: "0\n10\n"
        stdout: "0"
      - name: "Большие числа"
        stdin: "12345\n6789\n"
        stdout: "83810205"
      - name: "Пробелы вокруг чисел"
        stdin: " 3 \n 6 \n"
        stdout: "18"

  - id: t2
    title: "Конвертер температуры"
    difficulty: 1
    statement: |
      Программа читает температуру в градусах Цельсия (дробное число) и выводит её в градусах Фаренгейта, округлённую до 1 знака:

      `F = C × 9 / 5 + 32`
    examples:
      - input: "36.6"
        output: "97.9"
      - input: "-40"
        output: "-40.0"
    starter: |
      celsius = input()
    hints:
      - "Для дробного ввода используйте `float(input())`."
      - "`print(round(fahrenheit, 1))`."
    solution: |
      celsius = float(input())
      fahrenheit = celsius * 9 / 5 + 32
      print(round(fahrenheit, 1))
    solution_explanation: "float() принимает и целые, и дробные строки. Формула вычисляется слева направо: сначала умножение и деление, затем прибавление 32."
    tests:
      - name: "Температура тела"
        stdin: "36.6\n"
        stdout: "97.9"
      - name: "Ноль"
        stdin: "0\n"
        stdout: "32.0"
      - name: "Кипение воды"
        stdin: "100\n"
        stdout: "212.0"
      - name: "-40 совпадает"
        stdin: "-40\n"
        stdout: "-40.0"
      - name: "Дробное с округлением"
        stdin: "21.35\n"
        stdout: "70.4"

  - id: t3
    title: "Возраст через 10 лет"
    difficulty: 1
    statement: |
      Программа читает имя (первая строка) и возраст (вторая строка, целое число) и выводит:

      `<имя>, через 10 лет вам будет <возраст + 10>`
    examples:
      - input: "Ада\n36"
        output: "Ада, через 10 лет вам будет 46"
    starter: |
      name = input()
      age = input()
    hints:
      - "Имя оставьте строкой, а возраст преобразуйте в int."
      - "`print(name + \",\", \"через 10 лет вам будет\", age + 10)` — print сам расставит пробелы."
    solution: |
      name = input()
      age = int(input())
      print(name + ",", "через 10 лет вам будет", age + 10)
    solution_explanation: "Преобразуем только то, с чем будем считать. Запятую приклеиваем к имени через `+`, а остальные части отдаём print через запятую — он поставит пробелы."
    tests:
      - name: "Ада"
        stdin: "Ада\n36\n"
        stdout: "Ада, через 10 лет вам будет 46"
      - name: "Новорождённый"
        stdin: "Миша\n0\n"
        stdout: "Миша, через 10 лет вам будет 10"
      - name: "Имя из двух слов"
        stdin: "Анна Мария\n25\n"
        stdout: "Анна Мария, через 10 лет вам будет 35"
      - name: "Латиница"
        stdin: "Guido\n70\n"
        stdout: "Guido, через 10 лет вам будет 80"
      - name: "Старше 100"
        stdin: "Долгожитель\n99\n"
        stdout: "Долгожитель, через 10 лет вам будет 109"

  - id: t4
    title: "Средняя скорость"
    difficulty: 2
    statement: |
      Программа читает расстояние в километрах (дробное число) и время в пути в минутах (целое, больше нуля).
      Выведите среднюю скорость в км/ч, округлённую до 2 знаков, в формате:

      `Скорость: <значение> км/ч`
    examples:
      - input: "42.2\n180"
        output: "Скорость: 14.07 км/ч"
        explanation: "180 минут — это 3 часа; 42.2 / 3 = 14.0666… → 14.07"
    starter: |
      distance = float(input())
      minutes = int(input())
      print("Скорость:", distance / minutes, "км/ч")
    hints:
      - "Скорость в км/ч — километры, делённые на **часы**. Сколько часов в `minutes` минутах?"
      - "`hours = minutes / 60`, затем `round(distance / hours, 2)`."
    solution: |
      distance = float(input())
      minutes = int(input())
      hours = minutes / 60
      speed = round(distance / hours, 2)
      print("Скорость:", speed, "км/ч")
    solution_explanation: "Сначала переводим минуты в часы, затем делим. Отдельные переменные `hours` и `speed` делают формулу понятной — так легче найти ошибку в единицах измерения."
    tests:
      - name: "Марафон"
        stdin: "42.2\n180\n"
        stdout: "Скорость: 14.07 км/ч"
      - name: "Ровно час"
        stdin: "60\n60\n"
        stdout: "Скорость: 60.0 км/ч"
      - name: "Полчаса"
        stdin: "10\n30\n"
        stdout: "Скорость: 20.0 км/ч"
      - name: "Одна минута"
        stdin: "1.5\n1\n"
        stdout: "Скорость: 90.0 км/ч"
      - name: "Стоим на месте"
        stdin: "0\n45\n"
        stdout: "Скорость: 0.0 км/ч"
