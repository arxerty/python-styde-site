questions:
  - id: q1
    type: output
    prompt: "Что выведет код?"
    code: |
      total = 0
      for k in range(1, 6):
          if k % 2 == 1:
              total += k
      print(total)
    options:
      - text: "`9`"
        correct: true
        why: "Нечётные 1, 3, 5: 1 + 3 + 5 = 9."
      - text: "`15`"
        why: "Это сумма всех чисел 1…5; условие пропускает чётные."
      - text: "`6`"
        why: "Это сумма чётных 2 + 4."
    explanation: "Накопитель с условием: прибавляем только подходящие элементы."

  - id: q2
    type: find_bug
    prompt: "Программа должна выводить сумму введённых чисел, но выводит только последнее. Почему?"
    code: |
      n = int(input())
      for _ in range(n):
          total = 0
          total += int(input())
      print(total)
    options:
      - text: "`total = 0` стоит внутри цикла и обнуляет накопитель на каждой итерации"
        correct: true
        why: "Инициализацию нужно вынести до цикла."
      - text: "Нужно `total = total + input()`"
        why: "Тогда была бы ошибка типов: строка не складывается с числом."
      - text: "Переменную `_` нельзя использовать в range"
        why: "`_` — обычное имя для неиспользуемой переменной."
      - text: "print нужно перенести в цикл"
        why: "Тогда печатались бы промежуточные значения, проблема с обнулением осталась бы."
    explanation: "Инициализация накопителя — строго до цикла."

  - id: q3
    type: single
    prompt: "Почему нельзя начинать поиск максимума с `best = 0`?"
    options:
      - text: "Если все числа отрицательные, ответом окажется 0, которого нет в данных"
        correct: true
        why: "0 больше любого отрицательного числа — он «победит» все элементы."
      - text: "Переменная best не может быть равна нулю"
        why: "Может, но это неправильное начальное значение для максимума."
      - text: "Это замедлит программу"
        why: "Скорость здесь ни при чём, страдает корректность."
      - text: "Python запрещает сравнивать с нулём"
        why: "Сравнивать с нулём можно."
    explanation: "Начинайте с первого элемента или с None — тогда ответ всегда будет из данных."

  - id: q4
    type: output
    prompt: "Что выведет код?"
    code: |
      product = 0
      for i in range(1, 5):
          product *= i
      print(product)
    options:
      - text: "`0`"
        correct: true
        why: "0 × что угодно = 0. Произведение нужно начинать с 1."
      - text: "`24`"
        why: "Так было бы при product = 1."
      - text: "`10`"
        why: "Это сумма, а здесь умножение."
    explanation: "Нейтральный элемент умножения — 1, сложения — 0."

  - id: q5
    type: multiple
    prompt: "Какие утверждения о накопителях верны? Выберите все."
    options:
      - text: "Для пустых данных «все ли элементы положительные» — True"
        correct: true
        why: "Нет ни одного контрпримера — бессодержательная истина."
      - text: "Для пустых данных «есть ли положительный» — False"
        correct: true
        why: "Не найдено ни одного подходящего элемента."
      - text: "Среднее можно считать без проверки количества — Python вернёт 0 для пустых данных"
        why: "Будет ZeroDivisionError."
      - text: "Сумму, минимум и максимум можно посчитать за один проход"
        correct: true
        why: "Несколько накопителей обновляются в одном цикле."
    explanation: "Начальные значения накопителей отвечают на вопрос: каков результат для пустых данных?"

  - id: q6
    type: output
    prompt: "Что выведет код?"
    code: |
      data = [7, 3, 9, 9, 2]
      best = 0
      for i in range(len(data)):
          if data[i] > data[best]:
              best = i
      print(best)
    answer: "2"
    explanation: "Максимум 9 встречается на позициях 2 и 3; строгое > оставляет первое вхождение — 2."

tasks:
  - id: t1
    title: "Статистика оценок"
    difficulty: 2
    statement: |
      Программа читает `n`, затем `n` целых оценок. Выведите четыре строки:

      ```text
      Сумма: <сумма>
      Среднее: <среднее, округлённое до 2 знаков>
      Минимум: <минимум>
      Максимум: <максимум>
      ```

      Если `n = 0`, выведите одну строку `Нет данных`. Функции `sum`, `min`, `max` использовать нельзя.
    examples:
      - input: "5\n4\n5\n3\n5\n4"
        output: "Сумма: 21\nСреднее: 4.2\nМинимум: 3\nМаксимум: 5"
    starter: |
      n = int(input())
      total = 0
    hints:
      - "Минимум и максимум начните с `None` и обновляйте через `if smallest is None or value < smallest:`."
      - "После цикла проверьте `if n == 0:` — тогда печатайте «Нет данных»."
    solution: |
      n = int(input())
      total = 0
      smallest = None
      largest = None
      for _ in range(n):
          value = int(input())
          total += value
          if smallest is None or value < smallest:
              smallest = value
          if largest is None or value > largest:
              largest = value
      if n == 0:
          print("Нет данных")
      else:
          print("Сумма:", total)
          print("Среднее:", round(total / n, 2))
          print("Минимум:", smallest)
          print("Максимум:", largest)
    solution_explanation: "Все четыре показателя собираются за один проход. None означает «рекорда ещё нет», а проверка n == 0 защищает от деления на ноль."
    constraints:
      forbid: ["sum(", "min(", "max("]
    tests:
      - name: "Пять оценок"
        stdin: "5\n4\n5\n3\n5\n4\n"
        stdout: "Сумма: 21\nСреднее: 4.2\nМинимум: 3\nМаксимум: 5"
      - name: "Нет данных"
        stdin: "0\n"
        stdout: "Нет данных"
      - name: "Одна оценка"
        stdin: "1\n7\n"
        stdout: "Сумма: 7\nСреднее: 7.0\nМинимум: 7\nМаксимум: 7"
      - name: "Отрицательные"
        stdin: "3\n-5\n-2\n-9\n"
        stdout: "Сумма: -16\nСреднее: -5.33\nМинимум: -9\nМаксимум: -2"
      - name: "Округление среднего"
        stdin: "3\n1\n1\n2\n"
        stdout: "Сумма: 4\nСреднее: 1.33\nМинимум: 1\nМаксимум: 2"

  - id: t2
    title: "Где максимум"
    difficulty: 2
    statement: |
      Программа читает строку чисел через пробел (`input().split()`). Выведите максимальное значение и его позицию, **считая с 1**. Если максимумов несколько — позицию первого.

      Формат: `<максимум> на позиции <номер>`. Строка содержит хотя бы одно число. Числа целые.
    examples:
      - input: "3 9 2 9"
        output: "9 на позиции 2"
    starter: |
      numbers = input().split()
    hints:
      - "Пройдите по индексам: `for i in range(len(numbers)):` и преобразуйте `int(numbers[i])`."
      - "Храните лучший индекс; обновляйте при строго большем значении."
    solution: |
      numbers = input().split()
      best_index = 0
      for i in range(len(numbers)):
          if int(numbers[i]) > int(numbers[best_index]):
              best_index = i
      print(numbers[best_index], "на позиции", best_index + 1)
    solution_explanation: "argmax: храним индекс рекорда. Позиция для человека — индекс + 1, потому что индексы в Python начинаются с нуля."
    constraints:
      forbid: ["max(", ".index("]
    tests:
      - name: "Пример"
        stdin: "3 9 2 9\n"
        stdout: "9 на позиции 2"
      - name: "Одно число"
        stdin: "42\n"
        stdout: "42 на позиции 1"
      - name: "Максимум последний"
        stdin: "1 2 3 4 5\n"
        stdout: "5 на позиции 5"
      - name: "Отрицательные"
        stdin: "-7 -3 -10\n"
        stdout: "-3 на позиции 2"
      - name: "Многозначные (не строки!)"
        stdin: "9 10 100 25\n"
        stdout: "100 на позиции 3"

  - id: t3
    title: "Все положительные? Есть ли ноль?"
    difficulty: 2
    statement: |
      Программа читает целые числа по одному в строке до слова `конец`. Выведите две строки:

      ```text
      Все положительные: <True/False>
      Есть ноль: <True/False>
      ```

      Для пустого набора: все положительные — `True`, ноль — `False`.
    examples:
      - input: "3\n0\n5\nконец"
        output: "Все положительные: False\nЕсть ноль: True"
    starter: |
      all_positive = False
      has_zero = False
    hints:
      - "«Все ли» начинается с True и сбрасывается на первом неподходящем, «есть ли» начинается с False."
      - "Здесь нельзя выходить из цикла break-ом сразу: нужно дочитать ввод до слова «конец»."
    solution: |
      all_positive = True
      has_zero = False
      while True:
          text = input()
          if text == "конец":
              break
          value = int(text)
          if value <= 0:
              all_positive = False
          if value == 0:
              has_zero = True
      print("Все положительные:", all_positive)
      print("Есть ноль:", has_zero)
    solution_explanation: "Флаги-накопители all/any. Начальные значения — ответы для пустых данных. Ноль не положительный, поэтому он тоже сбрасывает all_positive."
    timeout: 5
    tests:
      - name: "Пример"
        stdin: "3\n0\n5\nконец\n"
        stdout: "Все положительные: False\nЕсть ноль: True"
      - name: "Пусто"
        stdin: "конец\n"
        stdout: "Все положительные: True\nЕсть ноль: False"
      - name: "Все положительные"
        stdin: "1\n2\n3\nконец\n"
        stdout: "Все положительные: True\nЕсть ноль: False"
      - name: "Отрицательное без нуля"
        stdin: "4\n-1\nконец\n"
        stdout: "Все положительные: False\nЕсть ноль: False"
      - name: "Только ноль"
        stdin: "0\nконец\n"
        stdout: "Все положительные: False\nЕсть ноль: True"

  - id: t4
    title: "Анализ слов"
    difficulty: 3
    statement: |
      Программа читает строку из слов, разделённых пробелами (хотя бы одно слово). Выведите:

      ```text
      Самое длинное: <первое из самых длинных слов>
      Средняя длина: <средняя длина слова, округлённая до 2 знаков>
      Длиннее среднего: <сколько слов длиннее средней длины>
      ```
    examples:
      - input: "я учу машинное обучение"
        output: "Самое длинное: машинное\nСредняя длина: 5.0\nДлиннее среднего: 2"
    starter: |
      words = input().split()
    hints:
      - "Первый проход: суммарная длина, количество и самое длинное слово. Средняя = сумма / количество."
      - "Второй проход по тем же словам: считаем слова, у которых `len(word) > average` (сравнивайте с неокруглённым средним)."
    solution: |
      words = input().split()
      total_length = 0
      longest = words[0]
      for word in words:
          total_length += len(word)
          if len(word) > len(longest):
              longest = word
      average = total_length / len(words)
      above = 0
      for word in words:
          if len(word) > average:
              above += 1
      print("Самое длинное:", longest)
      print("Средняя длина:", round(average, 2))
      print("Длиннее среднего:", above)
    solution_explanation: "Сравнение со средним требует знать среднее заранее, поэтому нужны два прохода: первый считает статистику, второй — сравнивает. Округляем только при выводе, а сравниваем с точным значением."
    tests:
      - name: "Пример"
        stdin: "я учу машинное обучение\n"
        stdout: "Самое длинное: машинное\nСредняя длина: 5.0\nДлиннее среднего: 2"
      - name: "Одно слово"
        stdin: "нейросеть\n"
        stdout: "Самое длинное: нейросеть\nСредняя длина: 9.0\nДлиннее среднего: 0"
      - name: "Одинаковая длина"
        stdin: "кот пёс кит\n"
        stdout: "Самое длинное: кот\nСредняя длина: 3.0\nДлиннее среднего: 0"
      - name: "Дробное среднее"
        stdin: "a bb ccc\n"
        stdout: "Самое длинное: ccc\nСредняя длина: 2.0\nДлиннее среднего: 1"
      - name: "Округление"
        stdin: "ab abc abcd\n"
        stdout: "Самое длинное: abcd\nСредняя длина: 3.0\nДлиннее среднего: 1"
      - name: "Лишние пробелы"
        stdin: "  data   science  \n"
        stdout: "Самое длинное: science\nСредняя длина: 5.5\nДлиннее среднего: 1"
