questions:
  - id: q1
    type: output
    prompt: "Что выведет код?"
    code: |
      for i in range(2, 10, 3):
          print(i, end=" ")
    options:
      - text: "`2 5 8`"
        correct: true
        why: "Начинаем с 2, шаг 3: 2, 5, 8; следующее 11 ≥ 10 — стоп."
      - text: "`2 5 8 11`"
        why: "stop не включается и не превышается."
      - text: "`3 6 9`"
        why: "Первое число — start, то есть 2."
    explanation: "range(start, stop, step): start включается, stop — нет."

  - id: q2
    type: single
    prompt: "Сколько итераций выполнит `for i in range(5, 0, -1):`?"
    options:
      - text: "5"
        correct: true
        why: "Числа 5, 4, 3, 2, 1 — пять итераций; 0 не включается."
      - text: "6"
        why: "stop = 0 не включается даже при обратном шаге."
      - text: "0"
        why: "При отрицательном шаге start > stop — последовательность непустая."
      - text: "4"
        why: "start = 5 включается."
    explanation: "Длина range(a, b, -1) — это a − b."

  - id: q3
    type: output
    prompt: "Что выведет код?"
    code: |
      for ch in "abc":
          print(ch * 2)
    options:
      - text: |
          ```
          aa
          bb
          cc
          ```
        correct: true
        why: "Каждый символ удваивается и печатается на своей строке."
      - text: "`aabbcc`"
        why: "print() каждый раз переходит на новую строку."
      - text: "`abcabc`"
        why: "Удваивается каждый символ отдельно, а не строка целиком."
    explanation: "for перебирает строку по символам."

  - id: q4
    type: find_bug
    prompt: "Программа должна вывести сумму чисел от 1 до 10 (ожидается 55), но выводит 45. Почему?"
    code: |
      total = 0
      for k in range(1, 10):
          total += k
      print(total)
    options:
      - text: "range(1, 10) не включает 10; нужно range(1, 11)"
        correct: true
        why: "Числа 1…9 дают 45."
      - text: "total нужно начинать с 1"
        why: "Тогда получилось бы 46 — тоже неверно."
      - text: "Нужно `total = k`"
        why: "Тогда в total осталось бы только последнее число."
      - text: "for нельзя использовать для сумм"
        why: "Это типичное применение for."
    explanation: "Полуоткрытый интервал: чтобы включить конец, прибавьте к stop единицу."

  - id: q5
    type: multiple
    prompt: "Какие вызовы дают последовательность 0, 1, 2? Выберите все."
    options:
      - text: "`range(3)`"
        correct: true
        why: "От 0 до 3, не включая."
      - text: "`range(0, 3)`"
        correct: true
        why: "То же самое с явным началом."
      - text: "`range(0, 3, 1)`"
        correct: true
        why: "Шаг по умолчанию — 1."
      - text: "`range(1, 3)`"
        why: "Даёт 1, 2."
      - text: "`range(2, -1, -1)`"
        why: "Даёт 2, 1, 0 — те же числа, но в обратном порядке."
    explanation: "Все три формы range с параметрами по умолчанию эквивалентны."

  - id: q6
    type: output
    prompt: "Что выведет код?"
    code: |
      total = 0
      for i in range(1, 5):
          total += i
      print(total, i)
    answer: "10 4"
    explanation: "Сумма 1 + 2 + 3 + 4 = 10, после цикла i хранит последнее значение — 4."

tasks:
  - id: t1
    title: "Сумма от 1 до n"
    difficulty: 1
    statement: |
      Программа читает целое `n` (n ≥ 0) и выводит сумму чисел от 1 до n включительно. Используйте `for`; функцию `sum()` использовать нельзя.
    examples:
      - input: "10"
        output: "55"
    starter: |
      n = int(input())
      total = 0
      for k in range(n):
          total += k
      print(total)
    hints:
      - "range(n) даёт 0…n−1. Нужно 1…n."
      - "`range(1, n + 1)`."
    solution: |
      n = int(input())
      total = 0
      for k in range(1, n + 1):
          total += k
      print(total)
    solution_explanation: "Чтобы включить n, верхняя граница range — n + 1. Для n = 0 диапазон пуст, цикл не выполняется, сумма — 0."
    constraints:
      forbid: ["sum("]
    tests:
      - name: "10"
        stdin: "10\n"
        stdout: "55"
      - name: "Ноль"
        stdin: "0\n"
        stdout: "0"
      - name: "Один"
        stdin: "1\n"
        stdout: "1"
      - name: "Сто"
        stdin: "100\n"
        stdout: "5050"
      - name: "Тысяча"
        stdin: "1000\n"
        stdout: "500500"

  - id: t2
    title: "Таблица умножения"
    difficulty: 1
    statement: |
      Программа читает целое число `n` и выводит таблицу умножения на него от 1 до 10 в формате `n x i = результат`.
    examples:
      - input: "7"
        output: "7 x 1 = 7\n7 x 2 = 14\n...\n7 x 10 = 70"
    starter: |
      n = int(input())
    hints:
      - "`for i in range(1, 11):`."
      - "`print(n, \"x\", i, \"=\", n * i)`."
    solution: |
      n = int(input())
      for i in range(1, 11):
          print(n, "x", i, "=", n * i)
    solution_explanation: "Цикл перебирает множители от 1 до 10; print расставляет пробелы между частями."
    tests:
      - name: "Таблица на 7"
        stdin: "7\n"
        stdout: "7 x 1 = 7\n7 x 2 = 14\n7 x 3 = 21\n7 x 4 = 28\n7 x 5 = 35\n7 x 6 = 42\n7 x 7 = 49\n7 x 8 = 56\n7 x 9 = 63\n7 x 10 = 70"
      - name: "Таблица на 1"
        stdin: "1\n"
        stdout: "1 x 1 = 1\n1 x 2 = 2\n1 x 3 = 3\n1 x 4 = 4\n1 x 5 = 5\n1 x 6 = 6\n1 x 7 = 7\n1 x 8 = 8\n1 x 9 = 9\n1 x 10 = 10"
      - name: "Ровно 10 строк"
        stdin: "3\n"
        code: |
          assert len(__stdout__.strip().splitlines()) == 10, "Должно быть 10 строк"
      - name: "Последняя строка"
        stdin: "12\n"
        code: |
          assert __stdout__.strip().splitlines()[-1] == "12 x 10 = 120"
      - name: "Отрицательное"
        stdin: "-2\n"
        code: |
          assert __stdout__.strip().splitlines()[0] == "-2 x 1 = -2"

  - id: t3
    title: "Чётные числа в диапазоне"
    difficulty: 2
    statement: |
      Программа читает два целых числа `a` и `b` (a ≤ b) и выводит все чётные числа от a до b **включительно**, каждое на своей строке.
      Используйте `range` с шагом 2 — без проверки чётности каждого числа в цикле.
    examples:
      - input: "3\n10"
        output: "4\n6\n8\n10"
    starter: |
      a = int(input())
      b = int(input())
      for x in range(a, b):
          if x % 2 == 0:
              print(x)
    hints:
      - "Найдите первое чётное число ≥ a: если a нечётное — `a + 1`. Тернарный оператор: `start = a if a % 2 == 0 else a + 1`."
      - "Затем `range(start, b + 1, 2)`."
    solution: |
      a = int(input())
      b = int(input())
      start = a if a % 2 == 0 else a + 1
      for x in range(start, b + 1, 2):
          print(x)
    solution_explanation: "Шаг 2 от чётного начала перебирает только чётные числа — в два раза меньше итераций. `b + 1` включает правую границу."
    constraints:
      forbid: ["% 2 == 0:"]
      message: "Не проверяйте чётность внутри цикла — используйте шаг range."
    tests:
      - name: "3..10"
        stdin: "3\n10\n"
        stdout: "4\n6\n8\n10"
      - name: "Чётные границы"
        stdin: "2\n8\n"
        stdout: "2\n4\n6\n8"
      - name: "Одно число"
        stdin: "6\n6\n"
        stdout: "6"
      - name: "Нет чётных"
        stdin: "7\n7\n"
        stdout: ""
      - name: "Отрицательные"
        stdin: "-5\n1\n"
        stdout: "-4\n-2\n0"

  - id: t4
    title: "Подсчёт гласных"
    difficulty: 2
    statement: |
      Программа читает строку текста и выводит количество гласных русских букв в ней (`аеёиоуыэюя`, в нижнем регистре; заглавные тоже считаются — `АЕЁИОУЫЭЮЯ`).
    examples:
      - input: "Мама мыла раму"
        output: "6"
    starter: |
      text = input()
      count = 0
    hints:
      - "Перебирайте символы: `for char in text:`."
      - "Проверка: `if char in \"аеёиоуыэюяАЕЁИОУЫЭЮЯ\":`."
    solution: |
      text = input()
      vowels = "аеёиоуыэюяАЕЁИОУЫЭЮЯ"
      count = 0
      for char in text:
          if char in vowels:
              count += 1
      print(count)
    solution_explanation: "Строка-набор гласных и оператор `in` превращают длинную цепочку `or` в одну проверку."
    tests:
      - name: "Мама мыла раму"
        stdin: "Мама мыла раму\n"
        stdout: "6"
      - name: "Пустая строка"
        stdin: "\n"
        stdout: "0"
      - name: "Без гласных"
        stdin: "ткнм 123\n"
        stdout: "0"
      - name: "Заглавные"
        stdin: "ЁЛКА И ЯБЛОКО\n"
        stdout: "6"
      - name: "Латиница не считается"
        stdin: "Python и AI\n"
        stdout: "1"
