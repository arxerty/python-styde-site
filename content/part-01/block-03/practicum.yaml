title: "Практикум: циклы"
description: |
  Вопросы и задачи по всему блоку: while, for и range, break/continue/else, вложенные циклы, накопители и алгоритмы.
  Последняя задача — мини-проект «Угадай число» со статистикой попыток.
pass_threshold: 0.7
questions:
  - id: q1
    type: output
    prompt: "Что выведет код?"
    code: |
      i = 10
      while i > 0:
          i -= 3
      print(i)
    options:
      - text: "`-2`"
        correct: true
        why: "10 → 7 → 4 → 1 → −2; при −2 условие ложно."
      - text: "`1`"
        why: "При i = 1 условие i > 0 ещё истинно — будет ещё одна итерация."
      - text: "`0`"
        why: "Шаг 3 «перепрыгивает» ноль."
    explanation: "После while переменная уже нарушает условие — это стоит учитывать."

  - id: q2
    type: single
    prompt: "Какой цикл лучше подходит для задачи «читать сообщения пользователя, пока он не введёт /exit»?"
    options:
      - text: "`while True:` с `break` при /exit"
        correct: true
        why: "Количество сообщений заранее неизвестно."
      - text: "`for i in range(100):`"
        why: "Пользователь может написать больше или меньше 100 сообщений."
      - text: "Вложенные for"
        why: "Здесь один поток событий, вложенность не нужна."
    explanation: "while — для неизвестного числа повторений, for — для перебора известной последовательности."

  - id: q3
    type: output
    prompt: "Что выведет код?"
    code: |
      for i in range(10, 0, -3):
          print(i, end=" ")
    options:
      - text: "`10 7 4 1`"
        correct: true
        why: "Начало 10, шаг −3: 10, 7, 4, 1; следующее −2 < 0 — стоп."
      - text: "`10 7 4 1 -2`"
        why: "stop = 0 не переходится."
      - text: "Ничего — range пуст"
        why: "При отрицательном шаге start > stop — диапазон непуст."
    explanation: "Отрицательный шаг: идём вниз от start, не доходя до stop."

  - id: q4
    type: output
    prompt: "Что выведет код?"
    code: |
      for ch in "data":
          if ch == "t":
              continue
          print(ch, end="")
    options:
      - text: "`daa`"
        correct: true
        why: "Буква «t» пропущена continue."
      - text: "`da`"
        why: "continue не завершает цикл — это был бы break."
      - text: "`data`"
        why: "Для «t» print не выполняется."
    explanation: "continue пропускает остаток текущей итерации."

  - id: q5
    type: output
    prompt: "Что выведет код?"
    code: |
      for n in [4, 6, 8]:
          if n % 2 == 1:
              print("нечётное есть")
              break
      else:
          print("все чётные")
    options:
      - text: "`все чётные`"
        correct: true
        why: "break не сработал — выполняется else цикла."
      - text: "`нечётное есть`"
        why: "Все числа чётные."
      - text: "Ничего"
        why: "else цикла выполняется при отсутствии break."
    explanation: "for…else: else — «если не было break»."

  - id: q6
    type: single
    prompt: "Сколько раз выполнится тело внутреннего цикла?"
    code: |
      for a in range(5):
          for b in range(a):
              pass
    options:
      - text: "10"
        correct: true
        why: "0 + 1 + 2 + 3 + 4 = 10."
      - text: "25"
        why: "Внутренний цикл зависит от a и не всегда делает 5 итераций."
      - text: "5"
        why: "Итерации внутреннего цикла суммируются по всем a."
    explanation: "Для зависимого внутреннего цикла складывайте количество итераций по каждой внешней."

  - id: q7
    type: find_bug
    prompt: "Ищем максимум температуры за зимнюю неделю. Почему результат — 0?"
    code: |
      temps = [-8, -3, -12, -5]
      warmest = 0
      for t in temps:
          if t > warmest:
              warmest = t
      print(warmest)
    options:
      - text: "Начальное значение 0 больше всех отрицательных температур"
        correct: true
        why: "Нужно `warmest = temps[0]` или None."
      - text: "Нужно `<` вместо `>`"
        why: "Тогда искался бы минимум."
      - text: "Нельзя сравнивать отрицательные числа"
        why: "Можно."
    explanation: "Начальное значение максимума — первый элемент или None, но не произвольное число."

  - id: q8
    type: multiple
    prompt: "Какие начальные значения накопителей правильные? Выберите все."
    options:
      - text: "Сумма: `total = 0`"
        correct: true
        why: "Ноль — нейтральный элемент сложения."
      - text: "Произведение: `product = 1`"
        correct: true
        why: "Единица — нейтральный элемент умножения."
      - text: "«Все ли подходят»: `all_ok = True`"
        correct: true
        why: "Без контрпримеров ответ — истина."
      - text: "«Есть ли хоть один»: `found = True`"
        why: "До находки — False."
      - text: "Произведение: `product = 0`"
        why: "Результат всегда будет 0."
    explanation: "Начальное значение — ответ для пустых данных."

  - id: q9
    type: output
    prompt: "Что выведет код?"
    code: |
      word = "abc"
      result = ""
      for ch in word:
          result = ch + result
      print(result)
    options:
      - text: "`cba`"
        correct: true
        why: "Каждый символ ставится перед накопленными: a → ba → cba."
      - text: "`abc`"
        why: "Так было бы при `result = result + ch`."
      - text: "`c`"
        why: "result накапливается, а не перезаписывается."
    explanation: "Порядок склейки определяет порядок символов в результате."

  - id: q10
    type: find_bug
    prompt: "Программа должна выйти из обоих циклов, найдя первую пару с суммой 10, но печатает много пар. Как исправить?"
    code: |
      for a in range(1, 10):
          for b in range(1, 10):
              if a + b == 10:
                  print(a, b)
                  break
    options:
      - text: "break прерывает только внутренний цикл — нужен флаг и второй break во внешнем цикле"
        correct: true
        why: "Флаг found = True, затем `if found: break` после внутреннего цикла."
      - text: "Нужно поставить continue вместо break"
        why: "continue только перешёл бы к следующему b."
      - text: "Поменять range(1, 10) на range(10)"
        why: "Это не влияет на выход из циклов."
    explanation: "break и continue действуют только на ближайший цикл."

  - id: q11
    type: single
    prompt: "Почему алгоритм Евклида быстрее перебора всех возможных делителей?"
    options:
      - text: "Каждый шаг `(a, b) → (b, a % b)` резко уменьшает числа — нужно лишь десятки шагов даже для огромных чисел"
        correct: true
        why: "Количество шагов растёт как логарифм, а не как само число."
      - text: "Он использует встроенную функцию Python"
        why: "Это обычный цикл while."
      - text: "Он перебирает делители с конца"
        why: "Он вообще не перебирает делители."
    explanation: "Правильная идея алгоритма важнее скорости компьютера."

  - id: q12
    type: output
    prompt: "Что выведет код?"
    code: |
      count = 0
      for i in range(1, 4):
          for j in range(1, 4):
              if i == j:
                  continue
              count += 1
      print(count)
    options:
      - text: "`6`"
        correct: true
        why: "9 пар минус 3 пары с i == j."
      - text: "`9`"
        why: "continue пропускает пары с одинаковыми числами."
      - text: "`3`"
        why: "Пропускаются только 3 пары из 9."
    explanation: "continue во внутреннем цикле пропускает итерацию внутреннего цикла."

  - id: q13
    type: output
    prompt: "Что выведет код?"
    code: |
      n = 1234
      total = 0
      while n:
          total += n % 10
          n //= 10
      print(total)
    answer: "10"
    explanation: "while n — truthy-проверка: цикл идёт, пока n не 0. Сумма цифр 4 + 3 + 2 + 1 = 10."

tasks:
  - id: t1
    title: "Цифровой корень"
    difficulty: 2
    statement: |
      Цифровой корень — результат многократного суммирования цифр, пока не останется одна цифра: 9875 → 29 → 11 → 2.
      Программа читает неотрицательное целое и выводит его цифровой корень. Используйте вложенные циклы, без строк.
    examples:
      - input: "9875"
        output: "2"
    starter: |
      n = int(input())
    hints:
      - "Внешний цикл: `while n >= 10:` — пока больше одной цифры."
      - "Внутренний цикл считает сумму цифр текущего n, затем `n = сумма`."
    solution: |
      n = int(input())
      while n >= 10:
          digit_sum = 0
          while n > 0:
              digit_sum += n % 10
              n //= 10
          n = digit_sum
      print(n)
    solution_explanation: "Накопитель суммы обнуляется в начале каждой итерации внешнего цикла — это частое место ошибки."
    constraints:
      forbid: ["str(", "len("]
    timeout: 5
    tests:
      - name: "9875"
        stdin: "9875\n"
        stdout: "2"
      - name: "Одна цифра"
        stdin: "7\n"
        stdout: "7"
      - name: "Ноль"
        stdin: "0\n"
        stdout: "0"
      - name: "Кратное 9"
        stdin: "999999999\n"
        stdout: "9"
      - name: "Большое"
        stdin: "123456789012345\n"
        stdout: "6"

  - id: t2
    title: "Ёлочка"
    difficulty: 2
    statement: |
      Программа читает высоту `h` и рисует ёлочку из `*`: в строке `i` (с 1) стоит `2i − 1` звёздочек, выровненных по центру пробелами слева (`h − i` пробелов).
    examples:
      - input: "3"
        output: "  *\n ***\n*****"
    starter: |
      h = int(input())
    hints:
      - "`for i in range(1, h + 1):` — строки."
      - "`print(\" \" * (h - i) + \"*\" * (2 * i - 1))`."
    solution: |
      h = int(input())
      for i in range(1, h + 1):
          print(" " * (h - i) + "*" * (2 * i - 1))
    solution_explanation: "Количество пробелов и звёзд вычисляется из номера строки. Повторение строк заменяет вложенный цикл."
    tests:
      - name: "Высота 3"
        stdin: "3\n"
        stdout: "  *\n ***\n*****"
      - name: "Высота 1"
        stdin: "1\n"
        stdout: "*"
      - name: "Высота 5"
        stdin: "5\n"
        stdout: "    *\n   ***\n  *****\n *******\n*********"
      - name: "Ширина основания"
        stdin: "10\n"
        code: |
          assert __stdout__.rstrip("\n").split("\n")[-1] == "*" * 19
      - name: "Высота 0"
        stdin: "0\n"
        stdout: ""

  - id: t3
    title: "Простые числа до n"
    difficulty: 2
    statement: |
      Программа читает `n` и выводит две строки: количество простых чисел от 2 до n и наибольшее из них.

      ```text
      Простых: <количество>
      Наибольшее: <наибольшее простое ≤ n>
      ```

      Если простых нет (n < 2) — одна строка `Простых: 0`.
    examples:
      - input: "20"
        output: "Простых: 8\nНаибольшее: 19"
    starter: |
      n = int(input())
      count = 0
    hints:
      - "Для каждого числа проверьте делители до корня (for … else с break)."
      - "Наибольшее простое — последнее найденное, если перебирать по возрастанию."
    solution: |
      n = int(input())
      count = 0
      largest = None
      for number in range(2, n + 1):
          for divisor in range(2, int(number ** 0.5) + 1):
              if number % divisor == 0:
                  break
          else:
              count += 1
              largest = number
      print("Простых:", count)
      if largest is not None:
          print("Наибольшее:", largest)
    solution_explanation: "Вложенные циклы: внешний — кандидаты, внутренний — делители до корня. for…else отличает «делитель найден» от «делителей нет»."
    timeout: 15
    tests:
      - name: "20"
        stdin: "20\n"
        stdout: "Простых: 8\nНаибольшее: 19"
      - name: "Меньше 2"
        stdin: "1\n"
        stdout: "Простых: 0"
      - name: "2"
        stdin: "2\n"
        stdout: "Простых: 1\nНаибольшее: 2"
      - name: "100"
        stdin: "100\n"
        stdout: "Простых: 25\nНаибольшее: 97"
      - name: "10000"
        stdin: "10000\n"
        stdout: "Простых: 1229\nНаибольшее: 9973"

  - id: t4
    title: "Сжатие серий"
    difficulty: 3
    statement: |
      Программа читает непустую строку и сжимает серии одинаковых подряд идущих символов: каждая серия заменяется на символ и длину серии.
      `aaabbc` → `a3b2c1`.
    examples:
      - input: "aaabbc"
        output: "a3b2c1"
      - input: "abc"
        output: "a1b1c1"
    starter: |
      text = input()
      result = ""
    hints:
      - "Храните текущий символ серии и её длину. Перебирайте символы, начиная со второго (`range(1, len(text))`)."
      - "Когда символ меняется — допишите серию в результат и начните новую. Не забудьте дописать последнюю серию после цикла!"
    solution: |
      text = input()
      result = ""
      current = text[0]
      run_length = 1
      for i in range(1, len(text)):
          if text[i] == current:
              run_length += 1
          else:
              result += current + str(run_length)
              current = text[i]
              run_length = 1
      result += current + str(run_length)
      print(result)
    solution_explanation: "Run-length encoding: накопители «текущий символ» и «длина серии». Последняя серия дописывается после цикла — её завершение не видно внутри цикла (нет следующего символа). Это классическая ошибка «потерянного хвоста»."
    tests:
      - name: "aaabbc"
        stdin: "aaabbc\n"
        stdout: "a3b2c1"
      - name: "Без повторов"
        stdin: "abc\n"
        stdout: "a1b1c1"
      - name: "Один символ"
        stdin: "z\n"
        stdout: "z1"
      - name: "Одна длинная серия"
        stdin: "wwwwwwwwwwww\n"
        stdout: "w12"
      - name: "Повторная серия"
        stdin: "aabaa\n"
        stdout: "a2b1a2"
      - name: "Кириллица и пробелы"
        stdin: "оо  к\n"
        stdout: "о2 2к1"

  - id: t5
    title: "Угадай число со статистикой"
    mini_project: true
    difficulty: 3
    statement: |
      **Мини-проект.** Игра для двоих: первый игрок загадывает число от 1 до 100, второй угадывает.

      **Раунд:**

      1. Программа читает загаданное число.
      2. Затем читает догадки. Для каждой:
         - вне диапазона 1–100 → `Число должно быть от 1 до 100` (попыткой не считается);
         - меньше загаданного → `Больше`;
         - больше загаданного → `Меньше`;
         - угадано → `Угадали за <N> попыток!` — раунд окончен.
      3. После раунда программа читает ответ на вопрос «Ещё раунд?»: `да` — новый раунд, любой другой ответ — конец игры.

      **В конце игры** выведите статистику:

      ```text
      Раундов: <количество раундов>
      Лучший результат: <минимальное число попыток за раунд>
      Среднее попыток: <среднее, округлённое до 2 знаков>
      ```

      Приглашения `input("...")` можно писать любые — они не проверяются.
    examples:
      - input: "42\n50\n25\n42\nнет"
        output: "Меньше\nБольше\nУгадали за 3 попыток!\nРаундов: 1\nЛучший результат: 3\nСреднее попыток: 3.0"
    starter: |
      rounds = 0
      play = "да"
      while play == "да":
          secret = int(input("Загаданное число: "))
          play = input("Ещё раунд? ")
    hints:
      - "Внешний цикл — раунды, внутренний `while True` — догадки с `break` при угадывании. Счётчик попыток обнуляйте в начале каждого раунда."
      - "Статистика — накопители: `rounds`, `total_attempts` (сумма попыток) и `best` (минимум, начиная с None)."
    solution: |
      rounds = 0
      total_attempts = 0
      best = None
      play = "да"
      while play == "да":
          secret = int(input("Загаданное число (1–100): "))
          attempts = 0
          while True:
              guess = int(input("Ваша догадка: "))
              if guess < 1 or guess > 100:
                  print("Число должно быть от 1 до 100")
                  continue
              attempts += 1
              if guess < secret:
                  print("Больше")
              elif guess > secret:
                  print("Меньше")
              else:
                  print("Угадали за", attempts, "попыток!")
                  break
          rounds += 1
          total_attempts += attempts
          if best is None or attempts < best:
              best = attempts
          play = input("Ещё раунд? (да/нет): ")

      print("Раундов:", rounds)
      print("Лучший результат:", best)
      print("Среднее попыток:", round(total_attempts / rounds, 2))
    solution_explanation: |
      Структура — два вложенных цикла:

      - **внешний** `while play == "да"` — раунды; в его начале обнуляется счётчик попыток раунда;
      - **внутренний** `while True` — догадки: `continue` для некорректного ввода (до увеличения счётчика, поэтому попытка не засчитывается), `break` при угадывании.

      Статистика накапливается после каждого раунда: сумма попыток для среднего и минимум через `None`. Деление на `rounds` безопасно — хотя бы один раунд всегда сыгран.

      Улучшение на будущее: в блоке 1.7 вы научитесь обрабатывать ввод букв вместо чисел через `try/except`, а в блоке 1.7 же — загадывать число случайно модулем `random`.
    timeout: 10
    tests:
      - name: "Один раунд"
        stdin: "42\n50\n25\n42\nнет\n"
        stdout: "Меньше\nБольше\nУгадали за 3 попыток!\nРаундов: 1\nЛучший результат: 3\nСреднее попыток: 3.0"
      - name: "С первой попытки"
        stdin: "7\n7\nнет\n"
        stdout: "Угадали за 1 попыток!\nРаундов: 1\nЛучший результат: 1\nСреднее попыток: 1.0"
      - name: "Вне диапазона не считается"
        stdin: "10\n0\n101\n10\nнет\n"
        stdout: "Число должно быть от 1 до 100\nЧисло должно быть от 1 до 100\nУгадали за 1 попыток!\nРаундов: 1\nЛучший результат: 1\nСреднее попыток: 1.0"
      - name: "Два раунда"
        stdin: "50\n25\n75\n50\nда\n1\n1\nнет\n"
        stdout: "Больше\nМеньше\nУгадали за 3 попыток!\nУгадали за 1 попыток!\nРаундов: 2\nЛучший результат: 1\nСреднее попыток: 2.0"
      - name: "Три раунда, дробное среднее"
        stdin: "100\n100\nда\n1\n2\n1\nда\n30\n60\n40\n35\n30\nнет\n"
