title: "Практикум: условия и логика"
description: |
  Вопросы и задачи по всему блоку: bool и сравнения, if/elif/else, and/or/not, truthy/falsy, тернарный оператор и match-case.
  Последняя задача — мини-проект «Текстовый квест с ветвлениями».
pass_threshold: 0.7
questions:
  - id: q1
    type: output
    prompt: "Что выведет код?"
    code: |
      print("Z" < "a", "10" < "2", 10 < 2)
    options:
      - text: "`True True False`"
        correct: true
        why: "Код «Z» (90) меньше кода «a» (97); строки сравниваются посимвольно: «1» < «2»; числа — по значению."
      - text: "`False True False`"
        why: "Заглавные буквы в Unicode идут раньше строчных."
      - text: "`False False False`"
        why: "«10» < «2» — сравнение строк, первый символ «1» меньше «2»."
    explanation: "Строки сравниваются по кодам символов, поэтому числа в строках сравниваются неверно."

  - id: q2
    type: output
    prompt: "Что выведет код?"
    code: |
      x = 15
      if x > 10:
          print("A")
      elif x > 5:
          print("B")
      if x > 12:
          print("C")
      else:
          print("D")
    options:
      - text: |
          ```
          A
          C
          ```
        correct: true
        why: "Это две независимые конструкции: в первой срабатывает A, во второй — C."
      - text: "`A`"
        why: "Второй `if` — новая конструкция, она проверяется независимо."
      - text: |
          ```
          A
          B
          C
          ```
        why: "elif не проверяется, если сработал предыдущий if."
    explanation: "Новый `if` начинает новую цепочку. elif и else относятся только к своей цепочке."

  - id: q3
    type: single
    prompt: "Почему важен порядок условий в цепочке `if score >= 90 … elif score >= 75 … elif score >= 60`?"
    options:
      - text: "Выполняется первая истинная ветка; если начать с `>= 60`, высокие баллы попадут в низшую категорию"
        correct: true
        why: "95 >= 60 истинно, и до проверки >= 90 дело не дойдёт."
      - text: "Python проверяет условия в случайном порядке"
        why: "Порядок строго сверху вниз."
      - text: "Порядок не важен, Python выберет самое точное условие"
        why: "Python не анализирует «точность» условий."
    explanation: "В цепочках с `>=` идите от большего порога к меньшему."

  - id: q4
    type: find_bug
    prompt: "Программа выдаёт скидку пенсионерам (65+) и детям (до 7 лет). Почему скидку получают все?"
    code: |
      age = int(input())
      if age >= 65 or age < 7 or 18:
          print("Скидка")
      else:
          print("Полная цена")
    options:
      - text: "Лишнее `or 18` — число 18 truthy, поэтому всё условие всегда истинно"
        correct: true
        why: "`... or 18` при ложных сравнениях вернёт 18, а это истина."
      - text: "`or` нельзя использовать дважды"
        why: "Цепочки or допустимы."
      - text: "Нужно `and` вместо `or`"
        why: "Человек не может быть одновременно старше 65 и младше 7."
      - text: "Нужно сравнивать строки"
        why: "Ввод преобразован в int, сравнение чисел корректно."
    explanation: "Каждая часть условия должна быть полноценным сравнением. Ненулевое число в or делает условие всегда истинным."

  - id: q5
    type: output
    prompt: "Что выведет код?"
    code: |
      a = True
      b = False
      print(not a or b, not (a or b), a and not b)
    options:
      - text: "`False False True`"
        correct: true
        why: "not a or b = False or False; not (True) = False; True and True = True."
      - text: "`True False True`"
        why: "not старше or: (not a) or b = False or False = False."
      - text: "`False True True`"
        why: "a or b = True, not True = False."
    explanation: "Порядок: not → and → or; скобки меняют порядок."

  - id: q6
    type: output
    prompt: "Что выведет код?"
    code: |
      items = 0
      print(items != 0 and 100 / items > 5)
      print(items == 0 or 100 / items > 5)
    options:
      - text: |
          ```
          False
          True
          ```
        correct: true
        why: "Короткое замыкание: в обоих случаях деление не вычисляется."
      - text: "Ошибку ZeroDivisionError"
        why: "Деление не выполняется: and остановился на False, or — на True."
      - text: |
          ```
          False
          False
          ```
        why: "items == 0 — истина, or сразу возвращает True."
    explanation: "and останавливается на первом ложном операнде, or — на первом истинном."

  - id: q7
    type: multiple
    prompt: "Какие значения truthy? Выберите все."
    options:
      - text: "`\"0\"`"
        correct: true
        why: "Непустая строка."
      - text: "`-1`"
        correct: true
        why: "Ненулевое число."
      - text: "`\" \"`"
        correct: true
        why: "Строка из пробела непустая."
      - text: "`0.0`"
        why: "Ноль — falsy."
      - text: "`None`"
        why: "None — falsy."
      - text: "`\"\"`"
        why: "Пустая строка — falsy."
    explanation: "Falsy: False, None, нули, пустые строки и коллекции. Всё остальное — truthy."

  - id: q8
    type: single
    prompt: "Как правильно проверить, что параметр `temperature` был передан, если 0 — допустимое значение, а «не передан» обозначается None?"
    options:
      - text: "`if temperature is not None:`"
        correct: true
        why: "Отличает «нет значения» от нуля."
      - text: "`if temperature:`"
        why: "Ноль falsy — параметр 0 посчитается непереданным."
      - text: "`if temperature != 0:`"
        why: "Так ноль снова отбрасывается."
      - text: "`if bool(temperature):`"
        why: "То же самое, что `if temperature:`."
    explanation: "Когда falsy-значения допустимы, сравнивайте с None через `is`."

  - id: q9
    type: output
    prompt: "Что выведет код?"
    code: |
      n = 0
      label = "положительное" if n > 0 else "отрицательное" if n < 0 else "ноль"
      print(label)
    options:
      - text: "`ноль`"
        correct: true
        why: "n > 0 ложно → проверяется вложенный тернарный: n < 0 ложно → «ноль»."
      - text: "`отрицательное`"
        why: "0 < 0 — ложь."
      - text: "Ошибку SyntaxError"
        why: "Вложенные тернарные операторы допустимы, хотя читаются тяжело."
    explanation: "Вложенный тернарный оператор работает, но для трёх вариантов if/elif/else читается лучше."

  - id: q10
    type: output
    prompt: "Что выведет код?"
    code: |
      cmd = "model large"
      match cmd.split():
          case ["model"]:
              print("нет имени")
          case ["model", name]:
              print("модель", name)
          case _:
              print("?")
    options:
      - text: "`модель large`"
        correct: true
        why: "Список из двух слов, первое «model» — подходит второй образец, name = «large»."
      - text: "`нет имени`"
        why: "Образец [\"model\"] подходит только к списку ровно из одного слова."
      - text: "`?`"
        why: "Совпадение нашлось раньше `case _`."
    explanation: "Образцы-списки проверяют и длину, и значения элементов."

  - id: q11
    type: find_bug
    prompt: "Что не так в этом коде?"
    code: |
      status = 404
      match status:
          case _:
              print("Ошибка")
          case 200:
              print("OK")
    options:
      - text: "`case _` стоит первым и перехватывает всё — образец 200 недостижим (Python выдаст SyntaxError)"
        correct: true
        why: "Подстановочный знак подходит к любому значению, поэтому он должен быть последним."
      - text: "match не работает с числами"
        why: "Числовые литералы — допустимые образцы."
      - text: "Нужен break в конце каждого case"
        why: "В match нет проваливания."
    explanation: "`case _` — всегда последний образец."

  - id: q12
    type: multiple
    prompt: "Когда `match` удобнее, чем `if/elif`? Выберите все."
    options:
      - text: "Выбор действия по команде из набора строк"
        correct: true
        why: "Классический случай: одно значение, много констант."
      - text: "Разбор структуры данных: пара (x, y), список слов команды"
        correct: true
        why: "Структурное сопоставление — главная сила match."
      - text: "Проверка `a > 0 and b < 10` для двух разных переменных"
        why: "Условия на разные переменные проще записать через if."
      - text: "Код должен работать в Python 3.8"
        why: "match появился только в 3.10."
    explanation: "match — для сопоставления значений и структур с образцами."

  - id: q13
    type: output
    prompt: "Что выведет код?"
    code: |
      a, b = 3, 3
      print(a == b == 3, (a == b) == 3)
    answer: "True False"
    explanation: "a == b == 3 — цепочка: a == b и b == 3 → True. (a == b) == 3 — сравнение True с 3: True ведёт себя как 1, а 1 != 3 → False."

tasks:
  - id: t1
    title: "Максимум из трёх"
    difficulty: 1
    statement: |
      Программа читает три целых числа и выводит наибольшее. Функцию `max()` использовать нельзя.
    examples:
      - input: "4\n9\n2"
        output: "9"
    starter: |
      a = int(input())
      b = int(input())
      c = int(input())
    hints:
      - "Сравните каждое число с двумя другими: `if a >= b and a >= c:`."
      - "Альтернатива: заведите `biggest = a` и обновляйте её двумя отдельными if."
    solution: |
      a = int(input())
      b = int(input())
      c = int(input())
      biggest = a
      if b > biggest:
          biggest = b
      if c > biggest:
          biggest = c
      print(biggest)
    solution_explanation: "Приём «текущий максимум»: предполагаем, что наибольшее — первое, и обновляем, если встретили большее. В блоке про циклы этот же приём будет работать для любого количества чисел."
    constraints:
      forbid: ["max("]
    tests:
      - name: "Максимум в середине"
        stdin: "4\n9\n2\n"
        stdout: "9"
      - name: "Максимум первый"
        stdin: "10\n3\n7\n"
        stdout: "10"
      - name: "Максимум последний"
        stdin: "1\n2\n3\n"
        stdout: "3"
      - name: "Все равны"
        stdin: "5\n5\n5\n"
        stdout: "5"
      - name: "Отрицательные"
        stdin: "-8\n-3\n-5\n"
        stdout: "-3"
      - name: "Два одинаковых максимума"
        stdin: "7\n2\n7\n"
        stdout: "7"

  - id: t2
    title: "Цена билета"
    difficulty: 2
    statement: |
      Билет стоит 500 рублей. Программа читает возраст (целое) и статус студента (`да` или `нет`).

      - До 7 лет — бесплатно: `0`
      - Студентам или людям от 65 лет — половина цены: `250`
      - Остальным — `500`
    examples:
      - input: "20\nда"
        output: "250"
      - input: "5\nнет"
        output: "0"
    starter: |
      age = int(input())
      student = input()
    hints:
      - "Сначала проверьте самый льготный случай — возраст до 7 лет."
      - "Вторая ветка: `student == \"да\" or age >= 65`."
    solution: |
      age = int(input())
      student = input()
      if age < 7:
          print(0)
      elif student == "да" or age >= 65:
          print(250)
      else:
          print(500)
    solution_explanation: "Самая выгодная льгота проверяется первой: ребёнок-«студент» всё равно должен ехать бесплатно. Студенческий статус сравниваем со строкой «да»."
    tests:
      - name: "Студент"
        stdin: "20\nда\n"
        stdout: "250"
      - name: "Ребёнок"
        stdin: "5\nнет\n"
        stdout: "0"
      - name: "Пенсионер"
        stdin: "70\nнет\n"
        stdout: "250"
      - name: "Взрослый"
        stdin: "30\nнет\n"
        stdout: "500"
      - name: "Ровно 7 лет"
        stdin: "7\nнет\n"
        stdout: "500"
      - name: "Ровно 65"
        stdin: "65\nнет\n"
        stdout: "250"
      - name: "Ребёнок со статусом да"
        stdin: "6\nда\n"
        stdout: "0"

  - id: t3
    title: "Проверка надёжности пароля"
    difficulty: 3
    statement: |
      Программа читает логин и пароль. Проверьте правила **независимо** и для каждого нарушенного выведите сообщение (в этом порядке):

      1. длина меньше 8 → `Слишком короткий`
      2. пароль совпадает с логином → `Совпадает с логином`
      3. пароль начинается с цифры → `Начинается с цифры`

      Если нарушений нет — `Пароль надёжный`. Пустой пароль считается коротким (и правило 3 к нему не применяется).

      Цифру можно проверить цепочкой сравнения строк: `"0" <= символ <= "9"`.
    examples:
      - input: "admin\n1234"
        output: "Слишком короткий\nНачинается с цифры"
      - input: "ada\nsecure_pass"
        output: "Пароль надёжный"
    starter: |
      login = input()
      password = input()
    hints:
      - "Правила независимы — нужны отдельные if. Удобно завести флаг `ok = True` и сбрасывать его при каждом нарушении."
      - "Правило 3: `password and \"0\" <= password[0] <= \"9\"` — короткое замыкание защищает от ошибки индекса на пустой строке."
    solution: |
      login = input()
      password = input()
      ok = True
      if len(password) < 8:
          print("Слишком короткий")
          ok = False
      if password == login:
          print("Совпадает с логином")
          ok = False
      if password and "0" <= password[0] <= "9":
          print("Начинается с цифры")
          ok = False
      if ok:
          print("Пароль надёжный")
    solution_explanation: "Независимые проверки — отдельные if; флаг `ok` запоминает, было ли хоть одно нарушение. Короткое замыкание в правиле 3 не даёт обратиться к `password[0]` у пустой строки (это вызвало бы IndexError)."
    tests:
      - name: "Короткий и с цифры"
        stdin: "admin\n1234\n"
        stdout: "Слишком короткий\nНачинается с цифры"
      - name: "Надёжный"
        stdin: "ada\nsecure_pass\n"
        stdout: "Пароль надёжный"
      - name: "Совпадает с логином"
        stdin: "longusername\nlongusername\n"
        stdout: "Совпадает с логином"
      - name: "Пустой пароль"
        stdin: "user\n\n"
        stdout: "Слишком короткий"
      - name: "Все нарушения"
        stdin: "1abc\n1abc\n"
        stdout: "Слишком короткий\nСовпадает с логином\nНачинается с цифры"
      - name: "Длинный, но с цифры"
        stdin: "user\n9lives_cat\n"
        stdout: "Начинается с цифры"

  - id: t4
    title: "Тарифы связи"
    difficulty: 2
    statement: |
      Программа читает название тарифа и количество минут разговора за месяц (целое). Выведите стоимость:

      | Тариф | Абонплата | Включено минут | Сверх лимита |
      |---|---|---|---|
      | `базовый` | 300 | 100 | 3 руб./мин |
      | `студент` | 200 | 50 | 2 руб./мин |
      | `безлимит` | 900 | без ограничений | — |

      Для другого названия — `Неизвестный тариф`. Используйте `match` для тарифа.
    examples:
      - input: "базовый\n150"
        output: "450"
        explanation: "300 + (150 − 100) × 3 = 450"
      - input: "безлимит\n5000"
        output: "900"
    starter: |
      plan = input()
      minutes = int(input())
    hints:
      - "Сверхлимитные минуты: `extra = minutes - 100`, но только если они положительные."
      - "Внутри case можно использовать обычный if или тернарный оператор: `extra = minutes - 100 if minutes > 100 else 0`."
    solution: |
      plan = input()
      minutes = int(input())
      match plan:
          case "базовый":
              extra = minutes - 100 if minutes > 100 else 0
              print(300 + extra * 3)
          case "студент":
              extra = minutes - 50 if minutes > 50 else 0
              print(200 + extra * 2)
          case "безлимит":
              print(900)
          case _:
              print("Неизвестный тариф")
    solution_explanation: "match выбирает тариф, а тернарный оператор внутри ветки считает минуты сверх лимита, не допуская отрицательного значения."
    constraints:
      require: ["match"]
    tests:
      - name: "Базовый с перерасходом"
        stdin: "базовый\n150\n"
        stdout: "450"
      - name: "Базовый в лимите"
        stdin: "базовый\n80\n"
        stdout: "300"
      - name: "Студент с перерасходом"
        stdin: "студент\n60\n"
        stdout: "220"
      - name: "Студент ровно лимит"
        stdin: "студент\n50\n"
        stdout: "200"
      - name: "Безлимит"
        stdin: "безлимит\n5000\n"
        stdout: "900"
      - name: "Неизвестный"
        stdin: "премиум\n10\n"
        stdout: "Неизвестный тариф"

  - id: t5
    title: "Текстовый квест с ветвлениями"
    mini_project: true
    difficulty: 3
    statement: |
      **Мини-проект.** Напишите текстовый квест. Игрок делает выбор, вводя `1` или `2`. Любой другой ввод на любом шаге означает: `Вы заблудились.`

      Дерево сюжета:

      ```text
      Шаг 1: 1 — пойти в лес, 2 — пойти к реке
      ├─ Лес. Шаг 2: 1 — взять фонарь, 2 — идти без фонаря
      │  ├─ Фонарь. Шаг 3: 1 — войти в пещеру, 2 — вернуться домой
      │  │  ├─ 1 → Вы нашли сокровище!
      │  │  └─ 2 → Вы вернулись домой.
      │  └─ Без фонаря → Вы упали в яму.
      └─ Река. Шаг 2: 1 — переплыть, 2 — искать мост
         ├─ Переплыть → программа читает запас сил (целое число):
         │     50 и больше → Вы переплыли реку и нашли деревню!
         │     меньше 50   → Течение унесло вас.
         └─ Мост → Вы перешли реку по мосту.
      ```

      В конце выведите две строки:

      ```text
      <итоговое сообщение>
      Решений: <сколько раз игрок выбирал 1/2/другое>
      ```

      Ввод запаса сил решением не считается. Кроме двух итоговых строк ничего не выводите: описание сцен пишите в приглашениях `input("...")` — при проверке они не учитываются.
    examples:
      - input: "1\n1\n1"
        output: "Вы нашли сокровище!\nРешений: 3"
      - input: "2\n1\n30"
        output: "Течение унесло вас.\nРешений: 2"
      - input: "3"
        output: "Вы заблудились.\nРешений: 1"
    starter: |
      choice = input("Вы стоите на развилке. 1 — лес, 2 — река: ")
      decisions = 1
    hints:
      - "Для каждого шага: прочитайте выбор, увеличьте счётчик решений и разберите варианты через if/elif/else или match. Вложенность повторяет дерево сюжета."
      - "Сохраняйте итог в переменную `result` в каждой ветке, а две финальные строки печатайте один раз в конце программы."
    solution: |
      choice = input("Вы стоите на развилке. 1 — лес, 2 — река: ")
      decisions = 1

      if choice == "1":
          choice = input("В лесу темно. 1 — взять фонарь, 2 — идти без фонаря: ")
          decisions += 1
          if choice == "1":
              choice = input("Перед вами пещера. 1 — войти, 2 — вернуться домой: ")
              decisions += 1
              if choice == "1":
                  result = "Вы нашли сокровище!"
              elif choice == "2":
                  result = "Вы вернулись домой."
              else:
                  result = "Вы заблудились."
          elif choice == "2":
              result = "Вы упали в яму."
          else:
              result = "Вы заблудились."
      elif choice == "2":
          choice = input("Река широкая. 1 — переплыть, 2 — искать мост: ")
          decisions += 1
          if choice == "1":
              energy = int(input("Запас сил (0–100): "))
              if energy >= 50:
                  result = "Вы переплыли реку и нашли деревню!"
              else:
                  result = "Течение унесло вас."
          elif choice == "2":
              result = "Вы перешли реку по мосту."
          else:
              result = "Вы заблудились."
      else:
          result = "Вы заблудились."

      print(result)
      print("Решений:", decisions)
    solution_explanation: |
      Структура кода повторяет дерево сюжета: каждый уровень вложенности — шаг игры. Приёмы, которые делают код надёжным:

      - **Каждая ветка присваивает `result`** — поэтому итоговый `print(result)` работает на любом пути, и вывод собран в одном месте.
      - **Счётчик `decisions`** увеличивается сразу после каждого `input()` с выбором — его невозможно забыть в одной из веток.
      - **Ветка `else` на каждом уровне** обрабатывает некорректный ввод.

      Повторяющийся код (`else: result = "Вы заблудились."`) — признак того, что программу можно улучшить функциями. Этим вы займётесь в блоке 1.6.
