questions:
  - id: q1
    type: single
    prompt: "Сколько веток может выполниться в цепочке `if / elif / elif / else`?"
    options:
      - text: "Ровно одна"
        correct: true
        why: "Выполняется первая ветка с истинным условием, а если таких нет — else."
      - text: "Все, у которых условие истинно"
        why: "Так ведут себя независимые if, а не цепочка elif."
      - text: "Ноль или одна"
        why: "Ноль веток возможно только без else; здесь else есть."
      - text: "Не больше двух"
        why: "Из цепочки всегда выбирается одна ветка."
    explanation: "Цепочка — это выбор одного варианта из нескольких. С else выбор гарантирован."

  - id: q2
    type: output
    prompt: "Что выведет код?"
    code: |
      score = 95
      if score >= 60:
          print("C")
      elif score >= 75:
          print("B")
      elif score >= 90:
          print("A")
    options:
      - text: "`C`"
        correct: true
        why: "Первое же условие 95 >= 60 истинно — остальные не проверяются."
      - text: "`A`"
        why: "Условие для A проверилось бы, только если бы предыдущие были ложны."
      - text: |
          ```
          C
          B
          A
          ```
        why: "elif не выполняется, если уже сработала предыдущая ветка."
    explanation: "Логическая ошибка порядка: при `>=` пороги нужно проверять от большего к меньшему."

  - id: q3
    type: output
    prompt: "Что выведет код?"
    code: |
      t = 25
      if t > 30:
          print("жарко")
      if t > 20:
          print("тепло")
      if t > 10:
          print("прохладно")
    options:
      - text: |
          ```
          тепло
          прохладно
          ```
        correct: true
        why: "Три независимых if: проверяется каждый. 25 > 20 и 25 > 10 — истинно."
      - text: "`тепло`"
        why: "Так было бы с elif. Здесь каждый if независим."
      - text: |
          ```
          жарко
          тепло
          прохладно
          ```
        why: "25 > 30 — ложь, «жарко» не выводится."
    explanation: "Отдельные if проверяются все подряд — для взаимоисключающих вариантов нужен elif."

  - id: q4
    type: find_bug
    prompt: "Программа определяет тариф доставки. Для какого веса она ничего не выведет и почему?"
    code: |
      weight = float(input())
      if weight < 5:
          print("500 руб.")
      elif weight > 5:
          print("900 руб.")
    options:
      - text: "Для веса ровно 5: ни `< 5`, ни `> 5` не истинно — «дыра» в диапазонах"
        correct: true
        why: "Граница не включена ни в одну ветку. Нужно `<=` в первом условии или просто `else`."
      - text: "Для отрицательного веса: elif не умеет проверять отрицательные числа"
        why: "Отрицательный вес попадёт в первую ветку (меньше 5)."
      - text: "Для дробного веса: float нельзя сравнивать"
        why: "float сравнивается так же, как int."
      - text: "Для любого веса — elif без else не работает"
        why: "else необязателен."
    explanation: "Проверяйте границы диапазонов. Надёжный приём — заканчивать цепочку веткой else."

  - id: q5
    type: multiple
    prompt: "В каких случаях лучше использовать цепочку `elif`, а не независимые `if`? Выберите все."
    options:
      - text: "Определить категорию оценки: отлично/хорошо/удовлетворительно"
        correct: true
        why: "Категории взаимоисключающие — нужна ровно одна."
      - text: "Выбрать действие по коду HTTP-ответа"
        correct: true
        why: "Один ответ — одно действие."
      - text: "Вывести все применимые предупреждения о пароле (короткий, без цифр, без заглавных)"
        why: "Предупреждения независимы: может сработать несколько — здесь нужны отдельные if."
      - text: "Определить знак числа: положительное/отрицательное/ноль"
        correct: true
        why: "Число имеет ровно один знак."
    explanation: "elif — для выбора одного варианта; независимые if — для проверок, которые могут сработать одновременно."

  - id: q6
    type: output
    prompt: "Что выведет код?"
    code: |
      x = 0
      if x > 0:
          print("плюс")
      elif x < 0:
          print("минус")
      else:
          if x == 0:
              print("ноль")
          else:
              print("???")
    answer: "ноль"
    explanation: "Первые два условия ложны, выполняется else, внутри которого вложенный if проверяет x == 0."

tasks:
  - id: t1
    title: "Оценка по баллам"
    difficulty: 1
    statement: |
      Программа читает количество баллов (целое) и выводит оценку:

      | Баллы | Оценка |
      |---|---|
      | меньше 0 или больше 100 | `ошибка` |
      | 90–100 | `отлично` |
      | 75–89 | `хорошо` |
      | 60–74 | `удовлетворительно` |
      | 0–59 | `неудовлетворительно` |
    examples:
      - input: "82"
        output: "хорошо"
      - input: "101"
        output: "ошибка"
    starter: |
      score = int(input())
      if score >= 60:
          print("удовлетворительно")
      elif score >= 90:
          print("отлично")
    hints:
      - "Сначала обработайте ошибочные значения: `if score < 0: ... elif score > 100: ...`."
      - "Потом проверяйте пороги от большего к меньшему: 90, 75, 60, а остальное — в else."
    solution: |
      score = int(input())
      if score < 0:
          print("ошибка")
      elif score > 100:
          print("ошибка")
      elif score >= 90:
          print("отлично")
      elif score >= 75:
          print("хорошо")
      elif score >= 60:
          print("удовлетворительно")
      else:
          print("неудовлетворительно")
    solution_explanation: "Некорректные значения отсекаются первыми, дальше пороги идут по убыванию. Каждая ветка знает, что предыдущие условия ложны, поэтому верхние границы не нужны. Две ветки «ошибка» объединятся в одну, когда вы изучите `or` в следующем уроке."
    tests:
      - name: "82"
        stdin: "82\n"
        stdout: "хорошо"
      - name: "Ровно 90"
        stdin: "90\n"
        stdout: "отлично"
      - name: "Ровно 75"
        stdin: "75\n"
        stdout: "хорошо"
      - name: "Ровно 60"
        stdin: "60\n"
        stdout: "удовлетворительно"
      - name: "59"
        stdin: "59\n"
        stdout: "неудовлетворительно"
      - name: "Больше 100"
        stdin: "101\n"
        stdout: "ошибка"
      - name: "Отрицательное"
        stdin: "-5\n"
        stdout: "ошибка"
      - name: "Ноль"
        stdin: "0\n"
        stdout: "неудовлетворительно"

  - id: t2
    title: "Знак числа"
    difficulty: 1
    statement: |
      Программа читает дробное число и выводит `положительное`, `отрицательное` или `ноль`.
    examples:
      - input: "3.5"
        output: "положительное"
      - input: "0"
        output: "ноль"
    starter: |
      x = float(input())
    hints:
      - "Три взаимоисключающих варианта — цепочка if / elif / else."
      - "Если x не больше и не меньше нуля, он равен нулю — это ветка else."
    solution: |
      x = float(input())
      if x > 0:
          print("положительное")
      elif x < 0:
          print("отрицательное")
      else:
          print("ноль")
    solution_explanation: "Последний случай не требует проверки: если число не положительное и не отрицательное, оно ноль."
    tests:
      - name: "Положительное"
        stdin: "3.5\n"
        stdout: "положительное"
      - name: "Отрицательное"
        stdin: "-0.001\n"
        stdout: "отрицательное"
      - name: "Ноль"
        stdin: "0\n"
        stdout: "ноль"
      - name: "Минус ноль"
        stdin: "-0.0\n"
        stdout: "ноль"
      - name: "Большое"
        stdin: "1e10\n"
        stdout: "положительное"

  - id: t3
    title: "Тариф доставки"
    difficulty: 2
    statement: |
      Программа читает вес посылки в кг (дробное, больше нуля) и выводит стоимость доставки:

      | Вес | Вывод |
      |---|---|
      | до 1 кг включительно | `300` |
      | до 5 кг включительно | `500` |
      | до 20 кг включительно | `900` |
      | больше 20 кг | `Слишком тяжело` |
    examples:
      - input: "3.2"
        output: "500"
      - input: "1"
        output: "300"
    starter: |
      weight = float(input())
      if weight < 1:
          print(300)
      elif weight > 1:
          print(500)
    hints:
      - "Границы включены — используйте `<=`."
      - "Благодаря elif каждой следующей ветке достаточно верхней границы. Для тяжёлых — else."
    solution: |
      weight = float(input())
      if weight <= 1:
          print(300)
      elif weight <= 5:
          print(500)
      elif weight <= 20:
          print(900)
      else:
          print("Слишком тяжело")
    solution_explanation: "Цепочка elif разбивает ось веса на интервалы без пересечений и дыр. Граничные значения 1, 5 и 20 попадают в нужные тарифы благодаря `<=`."
    tests:
      - name: "3.2 кг"
        stdin: "3.2\n"
        stdout: "500"
      - name: "Ровно 1 кг"
        stdin: "1\n"
        stdout: "300"
      - name: "Ровно 5 кг"
        stdin: "5\n"
        stdout: "500"
      - name: "Ровно 20 кг"
        stdin: "20\n"
        stdout: "900"
      - name: "Чуть больше 20"
        stdin: "20.01\n"
        stdout: "Слишком тяжело"
      - name: "Лёгкая"
        stdin: "0.1\n"
        stdout: "300"

  - id: t4
    title: "Маршрутизатор моделей"
    difficulty: 3
    statement: |
      AI-сервис выбирает модель по типу задачи и длине запроса. Программа читает тип задачи (`текст` или `код`) и длину запроса в символах (целое).

      - Для `текст`: длина до 1000 включительно → `small`, иначе → `large`.
      - Для `код`: длина до 5000 включительно → `coder`, иначе → `coder-large`.
      - Любой другой тип → `unknown` (длину всё равно нужно прочитать).

      Используйте вложенные условия.
    examples:
      - input: "текст\n500"
        output: "small"
      - input: "код\n8000"
        output: "coder-large"
    starter: |
      task_type = input()
      length = int(input())
    hints:
      - "Внешний if выбирает по `task_type`, внутренний — по `length`."
      - "Тип `текст` и `код` сравнивайте как строки: `task_type == \"текст\"`."
    solution: |
      task_type = input()
      length = int(input())
      if task_type == "текст":
          if length <= 1000:
              print("small")
          else:
              print("large")
      elif task_type == "код":
          if length <= 5000:
              print("coder")
          else:
              print("coder-large")
      else:
          print("unknown")
    solution_explanation: "Внешняя цепочка выбирает семейство моделей, вложенный if/else — размер. Вложенность здесь оправдана: порог длины зависит от типа задачи. Так в продакшне экономят: дешёвые модели обрабатывают короткие запросы."
    tests:
      - name: "Короткий текст"
        stdin: "текст\n500\n"
        stdout: "small"
      - name: "Длинный текст"
        stdin: "текст\n1001\n"
        stdout: "large"
      - name: "Граница текста"
        stdin: "текст\n1000\n"
        stdout: "small"
      - name: "Код"
        stdin: "код\n5000\n"
        stdout: "coder"
      - name: "Большой код"
        stdin: "код\n8000\n"
        stdout: "coder-large"
      - name: "Неизвестный тип"
        stdin: "картинка\n10\n"
        stdout: "unknown"
