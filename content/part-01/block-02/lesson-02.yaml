questions:
  - id: q1
    type: single
    prompt: "Что определяет, какие строки входят в тело `if` в Python?"
    options:
      - text: "Отступ: строки с одинаковым отступом после двоеточия"
        correct: true
        why: "В Python блоки задаются отступами, а не скобками."
      - text: "Фигурные скобки `{ }`"
        why: "Так в C, Java, JavaScript. В Python скобки для блоков не используются."
      - text: "Ключевое слово `end` в конце блока"
        why: "Так в Ruby или Lua. В Python блок заканчивается возвратом отступа."
      - text: "Все строки до конца файла"
        why: "Блок заканчивается на первой строке с прежним уровнем отступа."
    explanation: "Отступ — часть синтаксиса Python. Стандарт — 4 пробела."

  - id: q2
    type: output
    prompt: "Что выведет код?"
    code: |
      x = 3
      if x > 5:
          print("большое")
      else:
          print("маленькое")
      print("готово")
    options:
      - text: |
          ```
          маленькое
          готово
          ```
        correct: true
        why: "3 > 5 — ложь, выполняется else, затем строка без отступа."
      - text: "`маленькое`"
        why: "`print(\"готово\")` вне блоков — выполняется всегда."
      - text: |
          ```
          большое
          маленькое
          готово
          ```
        why: "Из if/else выполняется ровно одна ветка."
    explanation: "Строка без отступа после конструкции if/else выполняется независимо от условия."

  - id: q3
    type: find_bug
    prompt: "Почему программа не запускается?"
    code: |
      password = input()
      if password == "secret"
          print("Доступ разрешён")
    options:
      - text: "После условия пропущено двоеточие"
        correct: true
        why: "Строка `if` должна заканчиваться `:` → SyntaxError: expected ':'."
      - text: "Нужно `=` вместо `==`"
        why: "Наоборот: в условии нужно сравнение `==`."
      - text: "Пароли нельзя сравнивать строками"
        why: "Строки сравниваются через `==` без проблем."
      - text: "print() нельзя писать с отступом"
        why: "Отступ здесь обязателен — это тело if."
    explanation: "Двоеточие открывает блок. Его забывают чаще всего в if, else, for, while и def."

  - id: q4
    type: multiple
    prompt: "Какие записи синтаксически корректны? Выберите все."
    options:
      - text: |
          ```python
          if x > 0:
              print("да")
          ```
        correct: true
        why: "Двоеточие и отступ на месте."
      - text: |
          ```python
          if x == 0:
              pass
          else:
              print("не ноль")
          ```
        correct: true
        why: "pass — допустимое пустое тело."
      - text: |
          ```python
          if x > 0:
          print("да")
          ```
        why: "У тела нет отступа → IndentationError."
      - text: |
          ```python
          if x > 0:
              print("да")
          else x <= 0:
              print("нет")
          ```
        why: "После else не пишут условие."
      - text: |
          ```python
          if x = 0:
              print("ноль")
          ```
        why: "В условии нельзя использовать присваивание `=`."
    explanation: "Правила: двоеточие, отступ тела, `else` без условия, в условии — сравнение `==`."

  - id: q5
    type: output
    prompt: "Что выведет код?"
    code: |
      balance = 100
      if balance > 500:
          balance -= 50
          print("Списано 50")
      print(balance)
    options:
      - text: "`100`"
        correct: true
        why: "Условие ложно — оба оператора в блоке пропускаются, последняя строка вне блока."
      - text: |
          ```
          Списано 50
          50
          ```
        why: "100 > 500 — ложь, тело if не выполняется."
      - text: |
          ```
          Списано 50
          100
          ```
        why: "Тело if не выполняется целиком — ни списание, ни печать."
    explanation: "Все строки с отступом — единый блок: выполняются вместе или не выполняются вместе."

  - id: q6
    type: output
    prompt: "Что выведет код?"
    code: |
      n = 10
      if n % 4 == 0:
          print("делится")
      else:
          print("остаток", n % 4)
    answer: "остаток 2"
    explanation: "10 % 4 = 2, условие ложно, выполняется ветка else."

tasks:
  - id: t1
    title: "Чётное или нечётное"
    difficulty: 1
    statement: |
      Программа читает целое число и выводит `чётное` или `нечётное`.
    examples:
      - input: "4"
        output: "чётное"
      - input: "7"
        output: "нечётное"
    starter: |
      n = int(input())
    hints:
      - "Условие чётности: `n % 2 == 0`."
      - "Используйте if/else с двумя print()."
    solution: |
      n = int(input())
      if n % 2 == 0:
          print("чётное")
      else:
          print("нечётное")
    solution_explanation: "Остаток от деления на 2 — ноль у чётных и единица у нечётных. if/else гарантирует, что выведется ровно одно слово."
    tests:
      - name: "4"
        stdin: "4\n"
        stdout: "чётное"
      - name: "7"
        stdin: "7\n"
        stdout: "нечётное"
      - name: "Ноль"
        stdin: "0\n"
        stdout: "чётное"
      - name: "Отрицательное нечётное"
        stdin: "-3\n"
        stdout: "нечётное"
      - name: "Большое чётное"
        stdin: "1000000\n"
        stdout: "чётное"

  - id: t2
    title: "Проверка пароля"
    difficulty: 1
    statement: |
      Программа читает пароль. Если он равен `python123`, выведите `Доступ разрешён`, иначе — `Доступ запрещён`.
    examples:
      - input: "python123"
        output: "Доступ разрешён"
      - input: "qwerty"
        output: "Доступ запрещён"
    starter: |
      password = input()
    hints:
      - "Сравнивайте строку со строкой: `password == \"python123\"`."
      - "Не забудьте двоеточия после условия и после else."
    solution: |
      password = input()
      if password == "python123":
          print("Доступ разрешён")
      else:
          print("Доступ запрещён")
    solution_explanation: "Строки сравниваются посимвольно и с учётом регистра, поэтому `Python123` не пройдёт — так и должно быть для паролей."
    tests:
      - name: "Верный пароль"
        stdin: "python123\n"
        stdout: "Доступ разрешён"
      - name: "Неверный"
        stdin: "qwerty\n"
        stdout: "Доступ запрещён"
      - name: "Другой регистр"
        stdin: "Python123\n"
        stdout: "Доступ запрещён"
      - name: "Пустой ввод"
        stdin: "\n"
        stdout: "Доступ запрещён"
      - name: "Пароль с пробелом"
        stdin: "python123 \n"
        stdout: "Доступ запрещён"

  - id: t3
    title: "Скидка от суммы"
    difficulty: 2
    statement: |
      Программа читает сумму покупки (дробное число). Если сумма **не меньше** 5000, выведите строку `Скидка 10%` и уменьшите сумму на 10%.
      В конце в любом случае выведите `К оплате: <сумма>` с округлением до 2 знаков.
    examples:
      - input: "6200"
        output: "Скидка 10%\nК оплате: 5580.0"
      - input: "1200"
        output: "К оплате: 1200.0"
    starter: |
      total = float(input())
      print("К оплате:", round(total, 2))
    hints:
      - "Внутри if две инструкции: печать сообщения и `total *= 0.9`."
      - "Строка «К оплате» — без отступа после if, чтобы выполнялась всегда. else здесь не нужен."
    solution: |
      total = float(input())
      if total >= 5000:
          print("Скидка 10%")
          total *= 0.9
      print("К оплате:", round(total, 2))
    solution_explanation: "Иногда ветка else не нужна: если условие ложно, сумма просто не меняется. Итоговый print вынесен из блока, поэтому выполняется всегда."
    tests:
      - name: "6200 — со скидкой"
        stdin: "6200\n"
        stdout: "Скидка 10%\nК оплате: 5580.0"
      - name: "1200 — без скидки"
        stdin: "1200\n"
        stdout: "К оплате: 1200.0"
      - name: "Ровно 5000"
        stdin: "5000\n"
        stdout: "Скидка 10%\nК оплате: 4500.0"
      - name: "Чуть меньше порога"
        stdin: "4999.99\n"
        stdout: "К оплате: 4999.99"
      - name: "Копейки со скидкой"
        stdin: "5555.5\n"
        stdout: "Скидка 10%\nК оплате: 4999.95"

  - id: t4
    title: "Модуль числа без abs()"
    difficulty: 2
    statement: |
      Программа читает целое число и выводит его модуль (абсолютное значение). Встроенную функцию `abs()` использовать нельзя.
    examples:
      - input: "-7"
        output: "7"
      - input: "3"
        output: "3"
    starter: |
      n = int(input())
      print(n)
    hints:
      - "Если число отрицательное, его нужно умножить на −1 (или взять `-n`)."
      - "`if n < 0: n = -n`, затем вывести n."
    solution: |
      n = int(input())
      if n < 0:
          n = -n
      print(n)
    solution_explanation: "Модуль отрицательного числа — противоположное число. Для нуля и положительных ничего менять не нужно, поэтому else не требуется."
    constraints:
      forbid: ["abs("]
      message: "Решите через условие."
    tests:
      - name: "Отрицательное"
        stdin: "-7\n"
        stdout: "7"
      - name: "Положительное"
        stdin: "3\n"
        stdout: "3"
      - name: "Ноль"
        stdin: "0\n"
        stdout: "0"
      - name: "Большое отрицательное"
        stdin: "-1000000\n"
        stdout: "1000000"
      - name: "Минус один"
        stdin: "-1\n"
        stdout: "1"
