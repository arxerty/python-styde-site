questions:
  - id: q1
    type: single
    prompt: "Зачем приводить текст к нижнему регистру перед подсчётом частоты слов?"
    options:
      - text: "Чтобы «Модель» и «модель» считались одним словом"
        correct: true
        why: "Для компьютера это разные строки — без нормализации счётчик разделится."
      - text: "Чтобы текст занимал меньше памяти"
        why: "Размер строки от регистра не меняется."
      - text: "Потому что split() не работает с заглавными буквами"
        why: "split() режет по пробелам независимо от регистра."
      - text: "Это обязательно для любых NLP-моделей, включая LLM"
        why: "LLM получают текст с регистром — для них это полезная информация."
    explanation: "Нормализация объединяет варианты написания одного слова. Это компромисс: часть информации теряется."

  - id: q2
    type: output
    prompt: "Что выведет код?"
    code: |
      tokens = "Привет, мир! — сказал он.".split()
      print(len(tokens), tokens[1])
    options:
      - text: "`5 мир!`"
        correct: true
        why: "split режет по пробелам: «Привет,», «мир!», «—», «сказал», «он.»; пунктуация остаётся на словах."
      - text: "`4 мир`"
        why: "split() не удаляет пунктуацию, а тире — отдельный токен."
      - text: "`5 мир`"
        why: "Восклицательный знак остаётся прилипшим к слову."
    explanation: "Токенизация по пробелам оставляет пунктуацию на словах — её чистят отдельным шагом."

  - id: q3
    type: output
    prompt: "Что выведет код?"
    code: |
      punctuation = ".,!?—"
      print("«данные!»".strip(punctuation), "из-за,".strip(punctuation))
    options:
      - text: "`«данные!» из-за`"
        correct: true
        why: "Кавычки-ёлочки не входят в набор punctuation, поэтому strip остановился на них; у «из-за,» снята только запятая."
      - text: "`данные из-за`"
        why: "strip снимает только символы из набора, а «» в нём нет."
      - text: "`«данные!» изза`"
        why: "strip работает только с краями — дефис в середине сохраняется."
    explanation: "Набор символов для strip должен содержать все нужные знаки, включая кавычки."

  - id: q4
    type: find_bug
    prompt: "Фильтр стоп-слов выбрасывает слово «о», хотя его нет в списке. Почему?"
    code: |
      stop_words = "и в на с по"
      word = "о"
      if word not in stop_words:
          print(word)
    options:
      - text: "`in` ищет подстроку: «о» найдено внутри «по», поэтому слово считается стоп-словом"
        correct: true
        why: "Нужно проверять с границами — `f\" {word} \" in f\" {stop_words} \"` — или использовать множество."
      - text: "Однобуквенные слова нельзя проверять оператором in"
        why: "Можно; проблема в том, что проверяется подстрока, а не слово."
      - text: "Нужно `in` вместо `not in`"
        why: "Тогда фильтр печатал бы только стоп-слова."
      - text: "Строка stop_words должна быть в верхнем регистре"
        why: "Регистр здесь совпадает, дело не в нём."
    explanation: "Проверка `word in строка` ищет подстроку. Добавляйте пробелы-границы или используйте множество (блок 1.5)."
  - id: q5
    type: multiple
    prompt: "Какие шаги относятся к классическому конвейеру предобработки текста? Выберите все."
    options:
      - text: "Приведение к нижнему регистру"
        correct: true
        why: "Нормализация."
      - text: "Токенизация — разбиение на слова"
        correct: true
        why: "Первый шаг разбора текста."
      - text: "Удаление стоп-слов"
        correct: true
        why: "Фильтрация служебных слов."
      - text: "Перевод текста в UTF-16"
        why: "Кодировка хранения не относится к предобработке для анализа."
      - text: "Лемматизация — приведение слов к начальной форме"
        correct: true
        why: "«кота» → «кот»: особенно важно для русского языка."
    explanation: "Нормализация, токенизация, очистка, стоп-слова, лемматизация — стандартные шаги классического NLP."

  - id: q6
    type: output
    prompt: "Сколько биграмм выведет код?"
    code: |
      words = "a b c d e".split()
      count = 0
      for i in range(len(words) - 1):
          count += 1
      print(count)
    answer: "4"
    explanation: "Из n слов получается n − 1 биграмма: (a b), (b c), (c d), (d e)."

tasks:
  - id: t1
    title: "Нормализация и токенизация"
    difficulty: 1
    statement: |
      Программа читает строку текста. Приведите её к нижнему регистру, разбейте на слова и снимите с краёв каждого слова знаки из набора `.,!?;:—-«»"()` . Пустые после очистки токены отбросьте.

      Выведите очищенные слова через пробел, а на следующей строке — `Слов: <количество>`.
    examples:
      - input: "Привет, Мир! — Это «тест»."
        output: "привет мир это тест\nСлов: 4"
    starter: |
      text = input()
      punctuation = ".,!?;:—-«»\"()"
    hints:
      - "Перебирайте `text.lower().split()`, для каждого токена — `token.strip(punctuation)`."
      - "Накапливайте непустые слова в список через `append` (или в строку) и выведите `\" \".join(words)`."
    solution: |
      text = input()
      punctuation = ".,!?;:—-«»\"()"
      words = []
      for token in text.lower().split():
          word = token.strip(punctuation)
          if word:
              words.append(word)
      print(" ".join(words))
      print("Слов:", len(words))
    solution_explanation: "Классический конвейер: нормализация регистра, токенизация по пробелам, очистка краёв и фильтр пустых токенов."
    tests:
      - name: "Пример"
        stdin: "Привет, Мир! — Это «тест».\n"
        stdout: "привет мир это тест\nСлов: 4"
      - name: "Дефис внутри слова"
        stdin: "Из-за дождя...\n"
        stdout: "из-за дождя\nСлов: 2"
      - name: "Только пунктуация"
        stdin: "!!! — ...\n"
        stdout: "\nСлов: 0"
      - name: "Лишние пробелы"
        stdin: "   ДАННЫЕ    И   МОДЕЛИ   \n"
        stdout: "данные и модели\nСлов: 3"
      - name: "Скобки и кавычки"
        stdin: "(AI) \"LLM\": RAG;\n"
        stdout: "ai llm rag\nСлов: 3"

  - id: t2
    title: "Частота слова"
    difficulty: 2
    statement: |
      Программа читает текст (первая строка) и слово (вторая строка). Посчитайте, сколько раз слово встречается в тексте **как отдельное слово** — без учёта регистра и знаков препинания по краям (`.,!?;:—-«»"()`).
    examples:
      - input: "Кот видит кота. КОТ спит, кот!\nкот"
        output: "3"
    starter: |
      text = input()
      target = input()
      print(text.count(target))
    hints:
      - "`text.count` считает подстроки: «кот» найдётся и внутри «кота». Нужно сравнивать слова целиком."
      - "Нормализуйте и текст, и искомое слово: `lower()` и `strip(punctuation)`."
    solution: |
      text = input()
      target = input().lower().strip()
      punctuation = ".,!?;:—-«»\"()"
      count = 0
      for token in text.lower().split():
          if token.strip(punctuation) == target:
              count += 1
      print(count)
    solution_explanation: "Сравнение целых очищенных токенов отличает «кот» от «кота». Искомое слово нормализуется так же, как текст, — иначе «Кот» не совпал бы с «кот»."
    tests:
      - name: "Пример"
        stdin: "Кот видит кота. КОТ спит, кот!\nкот\n"
        stdout: "3"
      - name: "Не найдено"
        stdin: "данные и модели\nнейросеть\n"
        stdout: "0"
      - name: "Искомое с заглавной"
        stdin: "python и Python и PYTHON\nPython\n"
        stdout: "3"
      - name: "Подстрока не считается"
        stdin: "она пошла на рынок\nна\n"
        stdout: "1"
      - name: "Кавычки"
        stdin: "«модель» обучилась. Модель готова\nмодель\n"
        stdout: "2"

  - id: t3
    title: "Статистика предложений"
    difficulty: 2
    statement: |
      Программа читает текст. Предложения заканчиваются знаками `.`, `!` или `?`. Для каждого непустого предложения выведите строку `<номер>: <количество слов>`, затем `Самое длинное: <номер>` (при равенстве — первое).
    examples:
      - input: "Модели учатся. Данные бывают грязными! Что делать?"
        output: "1: 2\n2: 3\n3: 2\nСамое длинное: 2"
    starter: |
      text = input()
    hints:
      - "Замените `!` и `?` на `.` и разрежьте по `.`; пустые куски (после последней точки) пропускайте."
      - "Нумеруйте только непустые предложения — заведите отдельный счётчик."
    solution: |
      text = input()
      unified = text.replace("!", ".").replace("?", ".")
      number = 0
      best_number = 0
      best_length = -1
      for part in unified.split("."):
          sentence = part.strip()
          if not sentence:
              continue
          number += 1
          length = len(sentence.split())
          print(f"{number}: {length}")
          if length > best_length:
              best_length = length
              best_number = number
      print("Самое длинное:", best_number)
    solution_explanation: "Унификация концов предложений сводит задачу к одному split. continue пропускает пустые куски, а отдельный счётчик нумерует только настоящие предложения."
    tests:
      - name: "Пример"
        stdin: "Модели учатся. Данные бывают грязными! Что делать?\n"
        stdout: "1: 2\n2: 3\n3: 2\nСамое длинное: 2"
      - name: "Одно предложение без точки"
        stdin: "Просто текст без конца\n"
        stdout: "1: 4\nСамое длинное: 1"
      - name: "Многоточия"
        stdin: "Ну... Ладно!\n"
        stdout: "1: 1\n2: 1\nСамое длинное: 1"
      - name: "Самое длинное — последнее"
        stdin: "Да. Нет. Это самое длинное предложение здесь.\n"
        stdout: "1: 1\n2: 1\n3: 5\nСамое длинное: 3"
      - name: "Вопросы"
        stdin: "Кто? Что? Где и когда?\n"
        stdout: "1: 1\n2: 1\n3: 3\nСамое длинное: 3"

  - id: t4
    title: "Биграммы"
    difficulty: 3
    statement: |
      Программа читает текст. Нормализуйте его (нижний регистр, снять с краёв слов знаки `.,!?;:—-«»"()`, пустые токены отбросить) и выведите все биграммы — пары соседних слов — по одной в строке через пробел. В конце — `Уникальных: <количество различных биграмм>`.
    examples:
      - input: "Я люблю данные. Я люблю модели!"
        output: "я люблю\nлюблю данные\nданные я\nя люблю\nлюблю модели\nУникальных: 4"
    starter: |
      text = input()
    hints:
      - "Сначала получите список очищенных слов, затем `for i in range(len(words) - 1):`."
      - "Для подсчёта уникальных накапливайте биграммы-строки в отдельный список, добавляя только если её там ещё нет."
    solution: |
      text = input()
      punctuation = ".,!?;:—-«»\"()"
      words = []
      for token in text.lower().split():
          word = token.strip(punctuation)
          if word:
              words.append(word)
      unique = []
      for i in range(len(words) - 1):
          bigram = words[i] + " " + words[i + 1]
          print(bigram)
          if bigram not in unique:
              unique.append(bigram)
      print("Уникальных:", len(unique))
    solution_explanation: "Сначала конвейер очистки, затем перебор соседних пар по индексам. Уникальность — накопитель-список с проверкой `not in` (в следующем блоке это заменит множество)."
    tests:
      - name: "Пример"
        stdin: "Я люблю данные. Я люблю модели!\n"
        stdout: "я люблю\nлюблю данные\nданные я\nя люблю\nлюблю модели\nУникальных: 4"
      - name: "Одно слово"
        stdin: "Привет!\n"
        stdout: "Уникальных: 0"
      - name: "Два слова"
        stdin: "Машинное обучение\n"
        stdout: "машинное обучение\nУникальных: 1"
      - name: "Пунктуация между словами"
        stdin: "data — science, data — science\n"
        stdout: "data science\nscience data\ndata science\nУникальных: 2"
      - name: "Повторы"
        stdin: "а а а а\n"
        stdout: "а а\nа а\nа а\nУникальных: 1"
