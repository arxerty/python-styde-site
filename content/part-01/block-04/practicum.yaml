title: "Практикум: строки глубоко"
description: |
  Вопросы и задачи по всему блоку: индексы и срезы, методы строк, f-строки, проверки, Unicode и обработка текста.
  Последняя задача — мини-проект «Анализатор текста».
pass_threshold: 0.7
questions:
  - id: q1
    type: output
    prompt: "Что выведет код?"
    code: |
      s = "datascience"
      print(s[4:], s[:4], s[-3:])
    options:
      - text: "`science data nce`"
        correct: true
        why: "[4:] — с индекса 4 до конца; [:4] — первые четыре; [-3:] — последние три."
      - text: "`ascience data nce`"
        why: "Индекс 4 — это «s», а не «a»: d(0) a(1) t(2) a(3) s(4)."
      - text: "`science dat ence`"
        why: "[:4] — четыре символа, [-3:] — три."
    explanation: "Срез [a:b] включает a и не включает b; отрицательные индексы — с конца."

  - id: q2
    type: output
    prompt: "Что выведет код?"
    code: |
      word = "level"
      print(word[::-1] == word, word[1:-1])
    options:
      - text: "`True eve`"
        correct: true
        why: "Слово — палиндром; [1:-1] — без первого и последнего символа."
      - text: "`False eve`"
        why: "«level» читается одинаково в обе стороны."
      - text: "`True leve`"
        why: "[1:-1] отбрасывает и первый, и последний символ."
    explanation: "[::-1] разворачивает строку, [1:-1] обрезает края."

  - id: q3
    type: single
    prompt: "Почему `s[0] = \"X\"` вызывает ошибку для строки?"
    options:
      - text: "Строки неизменяемы: «изменение» — это создание новой строки"
        correct: true
        why: "Нужно `s = \"X\" + s[1:]`."
      - text: "Индекс 0 недопустим"
        why: "Индекс 0 допустим для непустой строки — это первый символ."
      - text: "Нужно использовать метод replace"
        why: "replace заменит все такие символы, а не позицию; и тоже вернёт новую строку."
    explanation: "Неизменяемость делает строки безопасными и позволяет использовать их как ключи словаря."

  - id: q4
    type: output
    prompt: "Что выведет код?"
    code: |
      text = "  a,b ,c  "
      parts = text.strip().split(",")
      print(len(parts), "|".join(parts))
    options:
      - text: "`3 a|b |c`"
        correct: true
        why: "strip убирает внешние пробелы, split(\",\") — три куска; пробел после b остаётся."
      - text: "`3 a|b|c`"
        why: "Внутренний пробел «b » не удалён — strip действует только на края всей строки."
      - text: "`5 a|,|b|,|c`"
        why: "Разделитель в результат split не попадает."
    explanation: "strip — края всей строки; split(sep) не чистит куски от пробелов."

  - id: q5
    type: find_bug
    prompt: "Программа должна найти домен в адресе почты, но для строки без «@» выводит всю строку. Почему?"
    code: |
      email = "admin.example.com"
      at = email.find("@")
      print(email[at + 1:])
    options:
      - text: "find вернул −1, и срез [0:] дал всю строку; результат find нужно проверять"
        correct: true
        why: "−1 + 1 = 0 — срез с начала. Нужна проверка `if at == -1` или `\"@\" in email`."
      - text: "find нельзя использовать для поиска @"
        why: "Можно — это обычный символ."
      - text: "Нужно rfind вместо find"
        why: "rfind тоже вернёт −1, проблема останется."
    explanation: "−1 у find — валидный индекс для среза, поэтому ошибка «тихая»."

  - id: q6
    type: output
    prompt: "Что выведет код?"
    code: |
      price = 1234.5
      print(f"{price:,.2f}|{price:>10.1f}|{0.075:.1%}")
    options:
      - text: "`1,234.50|    1234.5|7.5%`"
        correct: true
        why: "Разделитель тысяч и 2 знака; ширина 10 вправо; 0.075 → 7.5%."
      - text: "`1234.50|1234.5    |0.1%`"
        why: "`,` добавляет разделитель тысяч, `>` выравнивает вправо, `%` умножает на 100."
      - text: "`1,234.5|    1234.5|7.5%`"
        why: ".2f всегда показывает два знака после запятой."
    explanation: "Спецификация формата: [ширина][,][.точность][тип]."

  - id: q7
    type: find_bug
    prompt: "Шаблон промпта падает с ошибкой KeyError или ValueError. Что не так?"
    code: |
      label = "positive"
      prompt = f"Верни JSON вида {"label": "{label}"}"
    options:
      - text: "Фигурные скобки JSON внутри f-строки нужно удвоить: `{{` и `}}`"
        correct: true
        why: "Одиночная { открывает выражение. Текстовые скобки — `{{` и `}}`."
      - text: "f-строки не поддерживают кириллицу"
        why: "Поддерживают."
      - text: "Переменная label должна быть числом"
        why: "Тип переменной не важен."
    explanation: "В f-строках скобки — синтаксис. Для JSON-примеров в промптах их удваивают."

  - id: q8
    type: multiple
    prompt: "Какие выражения равны `True`? Выберите все."
    options:
      - text: "`\"report.PDF\".lower().endswith(\".pdf\")`"
        correct: true
        why: "После lower() окончание совпадает."
      - text: "`\"https://x.ru\".startswith((\"http://\", \"https://\"))`"
        correct: true
        why: "Кортеж вариантов: подходит второй."
      - text: "`\"Москва\".isalpha()`"
        correct: true
        why: "Кириллические буквы — тоже буквы."
      - text: "`\"-12\".isdigit()`"
        why: "Минус — не цифра."
      - text: "`\"\".isspace()`"
        why: "Для пустой строки is-методы возвращают False."
    explanation: "is-методы проверяют все символы непустой строки; startswith/endswith принимают кортеж."

  - id: q9
    type: output
    prompt: "Что выведет код?"
    code: |
      print(len("Мир"), len("Мир".encode("utf-8")), ord("М") > ord("Z"))
    options:
      - text: "`3 6 True`"
        correct: true
        why: "3 символа, по 2 байта в UTF-8; код кириллицы больше кода латиницы."
      - text: "`3 3 False`"
        why: "Кириллица в UTF-8 занимает 2 байта на букву."
      - text: "`6 6 True`"
        why: "len строки — символы, а не байты."
    explanation: "Символы ≠ байты: кириллица в UTF-8 вдвое «тяжелее» латиницы."

  - id: q10
    type: single
    prompt: "Вы видите в тексте `РџСЂРёРІРµС‚` вместо «Привет». Что произошло?"
    options:
      - text: "Байты UTF-8 декодировали как CP1251"
        correct: true
        why: "Классический признак: чередование «Р» и «С»."
      - text: "Текст зашифрован шифром Цезаря"
        why: "Сдвиг букв дал бы другие буквы того же алфавита, а не такую смесь."
      - text: "Файл повреждён безвозвратно"
        why: "Байты целы — нужно декодировать правильной кодировкой."
    explanation: "Кракозябры — почти всегда несовпадение кодировок при encode и decode."

  - id: q11
    type: output
    prompt: "Что выведет код?"
    code: |
      punctuation = ".,!?"
      words = []
      for token in "Да, да... НЕТ!".lower().split():
          word = token.strip(punctuation)
          if word:
              words.append(word)
      print(words)
    options:
      - text: "`['да', 'да', 'нет']`"
        correct: true
        why: "lower → split → strip пунктуации с краёв каждого токена."
      - text: "`['Да', 'да', 'НЕТ']`"
        why: "lower() применён до split."
      - text: "`['да,', 'да...', 'нет!']`"
        why: "strip(punctuation) снимает знаки с краёв."
    explanation: "Мини-конвейер NLP: нормализация, токенизация, очистка."

  - id: q12
    type: multiple
    prompt: "Какие способы корректно убирают лишние пробелы внутри и по краям строки `s`? Выберите все."
    options:
      - text: "`\" \".join(s.split())`"
        correct: true
        why: "split() без аргументов отбрасывает все лишние пробелы, join склеивает через один."
      - text: "`s.strip()`"
        why: "strip убирает только пробелы по краям, внутренние остаются."
      - text: "`s.replace(\"  \", \" \")`"
        why: "Один проход не схлопнет тройные пробелы и не уберёт края."
    explanation: "Идиома `\" \".join(s.split())` — нормализация пробелов одной строкой."

  - id: q13
    type: output
    prompt: "Что выведет код?"
    code: |
      s = "a-b-c"
      print(s.replace("-", "", 1), s.count("-"), s.rfind("-"))
    answer: "ab-c 2 3"
    explanation: "replace с count=1 заменяет только первое вхождение; дефисов два; последний на позиции 3."

tasks:
  - id: t1
    title: "Слова-палиндромы"
    difficulty: 2
    statement: |
      Программа читает текст. Нормализуйте слова (нижний регистр, снять с краёв `.,!?;:—-«»"()`) и выведите все слова длиной от 3 букв, которые являются палиндромами, — в порядке появления, без повторов. В конце — `Найдено: <количество>`.
    examples:
      - input: "Анна видела шалаш и казак! Анна ушла."
        output: "анна\nшалаш\nказак\nНайдено: 3"
    starter: |
      text = input()
      punctuation = ".,!?;:—-«»\"()"
    hints:
      - "Палиндром: `word == word[::-1]`, длина — `len(word) >= 3`."
      - "Повторы отсекайте накопителем-списком найденных слов: `if word not in found`."
    solution: |
      text = input()
      punctuation = ".,!?;:—-«»\"()"
      found = []
      for token in text.lower().split():
          word = token.strip(punctuation)
          if len(word) >= 3 and word == word[::-1] and word not in found:
              found.append(word)
              print(word)
      print("Найдено:", len(found))
    solution_explanation: "Очистка токена, проверка разворотом среза и список-накопитель для уникальности — три инструмента блока в одном цикле."
    tests:
      - name: "Пример"
        stdin: "Анна видела шалаш и казак! Анна ушла.\n"
        stdout: "анна\nшалаш\nказак\nНайдено: 3"
      - name: "Нет палиндромов"
        stdin: "машинное обучение\n"
        stdout: "Найдено: 0"
      - name: "Короткие не считаются"
        stdin: "а и оно\n"
        stdout: "оно\nНайдено: 1"
      - name: "Латиница и регистр"
        stdin: "Level up, LEVEL! Racecar.\n"
        stdout: "level\nracecar\nНайдено: 2"
      - name: "Пустая строка"
        stdin: "\n"
        stdout: "Найдено: 0"

  - id: t2
    title: "Ровный чек"
    difficulty: 2
    statement: |
      Программа читает `n`, затем `n` строк вида `<товар>;<цена>` (цена — дробное число, товар может содержать пробелы).
      Выведите чек: товар — влево в поле ширины 20, цена — вправо в поле 10 с двумя знаками и разделителем тысяч. Затем строку из 30 знаков `-` и итог в том же формате с названием `ИТОГО`.
    examples:
      - input: "2\nКофе;199.9\nНоутбук;54990"
        output: "Кофе                    199.90\nНоутбук              54,990.00\n------------------------------\nИТОГО                55,189.90"
    starter: |
      n = int(input())
      total = 0
      for _ in range(n):
          line = input()
    hints:
      - "Разбор строки: `name, price = line.split(\";\")`, затем `float(price)`."
      - "Формат: `f\"{name:<20}{price:>10,.2f}\"`; линия — `\"-\" * 30`."
    solution: |
      n = int(input())
      total = 0
      for _ in range(n):
          name, price = input().split(";")
          price = float(price)
          total += price
          print(f"{name:<20}{price:>10,.2f}")
      print("-" * 30)
      print(f"{'ИТОГО':<20}{total:>10,.2f}")
    solution_explanation: "Ширина + выравнивание + разделитель тысяч + точность в одной спецификации дают ровные столбцы. Разделитель «;» позволяет товарам содержать пробелы."
    tests:
      - name: "Пример"
        stdin: "2\nКофе;199.9\nНоутбук;54990\n"
        stdout: "Кофе                    199.90\nНоутбук              54,990.00\n------------------------------\nИТОГО                55,189.90"
      - name: "Пустой чек"
        stdin: "0\n"
        stdout: "------------------------------\nИТОГО                     0.00"
      - name: "Название с пробелами"
        stdin: "1\nЧай зелёный;89.5\n"
        stdout: "Чай зелёный              89.50\n------------------------------\nИТОГО                    89.50"
      - name: "Ширина строк"
        stdin: "3\na;1\nbb;22\nccc;333\n"
        code: |
          for line in __stdout__.rstrip("\n").split("\n"):
              assert len(line) == 30, f"Длина строки {len(line)}: {line!r}"
      - name: "Миллионы (поле расширяется)"
        stdin: "1\nСервер;1234567.891\n"
        stdout: "Сервер              1,234,567.89\n------------------------------\nИТОГО               1,234,567.89"

  - id: t3
    title: "Аббревиатура"
    difficulty: 2
    statement: |
      Программа читает название и строит аббревиатуру из первых букв слов в верхнем регистре. Служебные слова `и`, `в`, `на`, `с`, `по`, `для` (в любом регистре) пропускаются. Слова через дефис дают по букве с каждой части («Научно-исследовательский» → «НИ»).
    examples:
      - input: "Машинное обучение и анализ данных"
        output: "МОАД"
      - input: "научно-исследовательский институт"
        output: "НИИ"
    starter: |
      title = input()
      result = ""
      for word in title.split():
          result += word[0]
      print(result)
    hints:
      - "Служебные слова проверяйте с границами: `f\" {word.lower()} \" in \" и в на с по для \"`."
      - "Каждое слово разбейте ещё и по дефису: `for part in word.split(\"-\"):` и берите `part[0]` у непустых частей."
    solution: |
      title = input()
      skip = " и в на с по для "
      result = ""
      for word in title.split():
          if f" {word.lower()} " in skip:
              continue
          for part in word.split("-"):
              if part:
                  result += part[0]
      print(result.upper())
    solution_explanation: "continue пропускает служебные слова, вложенный цикл по частям дефиса даёт буквы составных слов, а upper() в конце приводит результат к заглавным."
    tests:
      - name: "Пример"
        stdin: "Машинное обучение и анализ данных\n"
        stdout: "МОАД"
      - name: "Дефис"
        stdin: "научно-исследовательский институт\n"
        stdout: "НИИ"
      - name: "Служебные с заглавной"
        stdin: "Python Для Анализа И Визуализации\n"
        stdout: "PАВ"
      - name: "Одно слово"
        stdin: "нейросеть\n"
        stdout: "Н"
      - name: "Латиница"
        stdin: "large language model\n"
        stdout: "LLM"

  - id: t4
    title: "Проверка email"
    difficulty: 3
    statement: |
      Программа читает адрес электронной почты и выводит `корректный` или первую найденную проблему (проверки в этом порядке):

      1. есть пробелы → `содержит пробел`
      2. символ `@` встречается не ровно один раз → `нужен ровно один @`
      3. часть до `@` пустая → `пустое имя`
      4. в домене (после `@`) нет точки, или домен начинается/заканчивается точкой → `неверный домен`
    examples:
      - input: "ada@example.com"
        output: "корректный"
      - input: "ada@example"
        output: "неверный домен"
    starter: |
      email = input()
      if "@" in email:
          print("корректный")
    hints:
      - "Пробел: `\" \" in email`; количество @: `email.count(\"@\")`."
      - "Разбор: `name, domain = email.split(\"@\")`; домен: `\".\" not in domain or domain.startswith(\".\") or domain.endswith(\".\")`."
    solution: |
      email = input()
      if " " in email:
          print("содержит пробел")
      elif email.count("@") != 1:
          print("нужен ровно один @")
      else:
          name, domain = email.split("@")
          if not name:
              print("пустое имя")
          elif "." not in domain or domain.startswith(".") or domain.endswith("."):
              print("неверный домен")
          else:
              print("корректный")
    solution_explanation: "Цепочка проверок от простых к сложным; разбор на имя и домен выполняется только когда точно есть ровно один @ — иначе распаковка в две переменные упала бы."
    tests:
      - name: "Корректный"
        stdin: "ada@example.com\n"
        stdout: "корректный"
      - name: "Домен без точки"
        stdin: "ada@example\n"
        stdout: "неверный домен"
      - name: "Пробел"
        stdin: "ada @example.com\n"
        stdout: "содержит пробел"
      - name: "Два @"
        stdin: "a@b@c.ru\n"
        stdout: "нужен ровно один @"
      - name: "Нет @"
        stdin: "ada.example.com\n"
        stdout: "нужен ровно один @"
      - name: "Пустое имя"
        stdin: "@example.com\n"
        stdout: "пустое имя"
      - name: "Точка в начале домена"
        stdin: "ada@.com\n"
        stdout: "неверный домен"

  - id: t5
    title: "Анализатор текста"
    mini_project: true
    difficulty: 3
    statement: |
      **Мини-проект.** Программа читает текст (одна строка, хотя бы одно слово) и выводит отчёт:

      ```text
      Предложений: <N>
      Слов: <W>
      Средняя длина предложения: <W / N с двумя знаками> слов
      Уникальных слов: <U>
      Самое частое слово: <слово> (<сколько раз>)
      ```

      Правила:

      - **Предложения** заканчиваются на `.`, `!` или `?`; пустые куски не считаются. Текст без завершающего знака — тоже предложение.
      - **Слова**: нижний регистр, с краёв снимаются знаки `.,!?;:—-«»"()`, пустые токены отбрасываются. `W` и `U` считаются по всем словам.
      - **Самое частое слово** выбирается среди слов, которые **не** входят в стоп-список `и в во на с со по к о от до за из что это как а но не`. При равенстве — то, что встретилось в тексте раньше. Если подходящих слов нет — `Самое частое слово: -`.
    examples:
      - input: "Данные — это всё. Без данных нет модели! Данные и модели?"
        output: "Предложений: 3\nСлов: 10\nСредняя длина предложения: 3.33 слов\nУникальных слов: 8\nСамое частое слово: данные (2)"
    starter: |
      text = input()
      punctuation = ".,!?;:—-«»\"()"
      stop_words = " и в во на с со по к о от до за из что это как а но не "
    hints:
      - "Разбейте задачу на независимые шаги: (1) предложения через replace + split(\".\"); (2) список очищенных слов; (3) уникальные слова; (4) частоты для не-стоп-слов вложенным циклом."
      - "Для самого частого перебирайте уникальные слова в порядке появления и обновляйте рекорд только при строго большей частоте — так при равенстве останется первое."
    solution: |
      text = input()
      punctuation = ".,!?;:—-«»\"()"
      stop_words = " и в во на с со по к о от до за из что это как а но не "

      # 1. Предложения
      unified = text.replace("!", ".").replace("?", ".")
      sentence_count = 0
      for part in unified.split("."):
          if part.strip():
              sentence_count += 1

      # 2. Слова
      words = []
      for token in text.lower().split():
          word = token.strip(punctuation)
          if word:
              words.append(word)

      # 3. Уникальные слова
      unique = []
      for word in words:
          if word not in unique:
              unique.append(word)

      # 4. Самое частое значимое слово
      best_word = "-"
      best_count = 0
      for candidate in unique:
          if f" {candidate} " in stop_words:
              continue
          count = 0
          for word in words:
              if word == candidate:
                  count += 1
          if count > best_count:
              best_word = candidate
              best_count = count

      print("Предложений:", sentence_count)
      print("Слов:", len(words))
      print(f"Средняя длина предложения: {len(words) / sentence_count:.2f} слов")
      print("Уникальных слов:", len(unique))
      if best_count:
          print(f"Самое частое слово: {best_word} ({best_count})")
      else:
          print("Самое частое слово: -")
    solution_explanation: |
      Программа разбита на четыре независимых шага с комментариями — каждый можно проверить отдельно, выводя промежуточный результат.

      - **Предложения:** все концы предложений приводятся к точке, пустые куски не считаются. Тире «—» внутри предложения не мешает.
      - **Слова:** классический конвейер нормализации из урока 6.
      - **Уникальные:** список-накопитель с проверкой `not in` сохраняет порядок появления — это важно для правила «при равенстве — первое».
      - **Частоты:** вложенный цикл; строгое `>` оставляет первое из равных.

      Квадратичный подсчёт частот — слабое место решения. В блоке 1.5 словарь сделает это за один проход, а в части 2 — `collections.Counter` одной строкой. Отличное упражнение — вернуться к этому мини-проекту после следующего блока и переписать шаги 3–4.
    tests:
      - name: "Пример"
        stdin: "Данные — это всё. Без данных нет модели! Данные и модели?\n"
        stdout: "Предложений: 3\nСлов: 10\nСредняя длина предложения: 3.33 слов\nУникальных слов: 8\nСамое частое слово: данные (2)"
      - name: "Без завершающего знака"
        stdin: "кот спит\n"
        stdout: "Предложений: 1\nСлов: 2\nСредняя длина предложения: 2.00 слов\nУникальных слов: 2\nСамое частое слово: кот (1)"
      - name: "Только стоп-слова"
        stdin: "И в на.\n"
        stdout: "Предложений: 1\nСлов: 3\nСредняя длина предложения: 3.00 слов\nУникальных слов: 3\nСамое частое слово: -"
      - name: "Регистр и пунктуация"
        stdin: "Модель! МОДЕЛЬ? «модель», данные.\n"
        stdout: "Предложений: 3\nСлов: 4\nСредняя длина предложения: 1.33 слов\nУникальных слов: 2\nСамое частое слово: модель (3)"
      - name: "Равные частоты — первое"
        stdin: "Нейросеть учится. Данные помогают. Нейросеть и данные.\n"
        stdout: "Предложений: 3\nСлов: 7\nСредняя длина предложения: 2.33 слов\nУникальных слов: 5\nСамое частое слово: нейросеть (2)"
      - name: "Многоточия"
        stdin: "Ну... Ладно... Хорошо!\n"
        stdout: "Предложений: 3\nСлов: 3\nСредняя длина предложения: 1.00 слов\nУникальных слов: 3\nСамое частое слово: ну (1)"
