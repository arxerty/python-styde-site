questions:
  - id: q1
    type: output
    prompt: "Что выведет код?"
    code: |
      s = "Python"
      print(s[1], s[-2])
    options:
      - text: "`y o`"
        correct: true
        why: "Индекс 1 — второй символ «y»; −2 — предпоследний «o»."
      - text: "`P n`"
        why: "Индексы начинаются с 0, а −2 — это предпоследний символ, не последний."
      - text: "`y h`"
        why: "−2 отсчитывается с конца: n (−1), o (−2)."
    explanation: "Нумерация с нуля; отрицательные индексы — с конца."

  - id: q2
    type: output
    prompt: "Что выведет код?"
    code: |
      s = "abcdef"
      print(s[1:4], s[:2], s[4:])
    options:
      - text: "`bcd ab ef`"
        correct: true
        why: "[1:4] — индексы 1, 2, 3; [:2] — 0, 1; [4:] — 4, 5."
      - text: "`bcde ab def`"
        why: "stop не включается."
      - text: "`abcd abc ef`"
        why: "start включается, stop — нет: [1:4] начинается с «b»."
    explanation: "Срез [a:b] — символы с индексами a … b−1."

  - id: q3
    type: single
    prompt: "Что произойдёт при выполнении `s = \"cat\"; s[0] = \"b\"`?"
    options:
      - text: "TypeError: строки нельзя изменять по индексу"
        correct: true
        why: "Строки неизменяемы. Нужно создать новую: `\"b\" + s[1:]`."
      - text: "s станет «bat»"
        why: "Так работают списки, но не строки."
      - text: "Создастся новая переменная s[0]"
        why: "s[0] — обращение к элементу, а не имя переменной."
      - text: "Ничего не произойдёт"
        why: "Python сообщит об ошибке."
    explanation: "Неизменяемость: любое «изменение» строки — это создание новой."

  - id: q4
    type: output
    prompt: "Что выведет код?"
    code: |
      print("Python"[::-2])
    options:
      - text: "`nhy`"
        correct: true
        why: "С конца с шагом 2: индексы 5, 3, 1 → n, h, y."
      - text: "`Pto`"
        why: "Это [::2] — слева направо."
      - text: "`nohtyP`"
        why: "Это [::-1] — шаг 1, а здесь шаг 2."
    explanation: "Отрицательный шаг идёт справа налево."

  - id: q5
    type: multiple
    prompt: "Какие срезы строки `w = \"concatenate\"` дают `\"cat\"`? Выберите все."
    options:
      - text: "`w[3:6]`"
        correct: true
        why: "Индексы 3, 4, 5: c, a, t."
      - text: "`w[-8:-5]`"
        correct: true
        why: "Длина 11: −8 = 3, −5 = 6 — то же самое, что [3:6]."
      - text: "`w[3:6:1]`"
        correct: true
        why: "Шаг 1 — значение по умолчанию."
      - text: "`w[2:5]`"
        why: "Даёт «nca»."
      - text: "`w[3:5]`"
        why: "Даёт «ca» — stop не включается."
    explanation: "Отрицательные границы среза пересчитываются как длина + индекс."

  - id: q6
    type: find_bug
    prompt: "Почему код падает?"
    code: |
      word = input()
      last = word[len(word)]
      print(last)
    options:
      - text: "Последний индекс — len(word) − 1; нужен `word[-1]`"
        correct: true
        why: "word[len(word)] выходит за границу → IndexError."
      - text: "len() нельзя использовать в квадратных скобках"
        why: "Можно — внутри скобок любое целое выражение."
      - text: "Нужно преобразовать ввод в int"
        why: "Работаем со строкой — преобразование не нужно."
      - text: "Строки нельзя индексировать"
        why: "Строки — последовательности, их можно индексировать."
    explanation: "Допустимые индексы: 0 … len − 1. Также стоит проверить пустую строку — у неё нет ни одного индекса."

tasks:
  - id: t1
    title: "Формат даты"
    difficulty: 1
    statement: |
      Программа читает дату в формате `YYYY-MM-DD` и выводит её в формате `DD.MM.YYYY`. Используйте срезы.
    examples:
      - input: "2026-10-16"
        output: "16.10.2026"
    starter: |
      date = input()
    hints:
      - "Год — `date[:4]`, месяц — `date[5:7]`, день — `date[8:]`."
      - "Склейте через `+` с точками."
    solution: |
      date = input()
      year = date[:4]
      month = date[5:7]
      day = date[8:]
      print(day + "." + month + "." + year)
    solution_explanation: "Позиции частей фиксированы форматом, поэтому срезы извлекают их напрямую. Отдельные переменные делают код самодокументируемым."
    tests:
      - name: "Пример"
        stdin: "2026-10-16\n"
        stdout: "16.10.2026"
      - name: "Начало года"
        stdin: "2000-01-01\n"
        stdout: "01.01.2000"
      - name: "Конец года"
        stdin: "1999-12-31\n"
        stdout: "31.12.1999"
      - name: "Ведущие нули сохраняются"
        stdin: "2024-02-09\n"
        stdout: "09.02.2024"
      - name: "Далёкое будущее"
        stdin: "3000-07-04\n"
        stdout: "04.07.3000"

  - id: t2
    title: "Палиндром"
    difficulty: 1
    statement: |
      Программа читает слово (в нижнем регистре) и выводит `да`, если оно палиндром, иначе `нет`. Используйте срез с отрицательным шагом.
    examples:
      - input: "шалаш"
        output: "да"
    starter: |
      word = input()
    hints:
      - "Перевёрнутое слово — `word[::-1]`."
      - "Сравните его с исходным и выведите результат через if/else или тернарный оператор."
    solution: |
      word = input()
      print("да" if word == word[::-1] else "нет")
    solution_explanation: "Срез [::-1] разворачивает строку за одну операцию — без цикла и накопителя."
    constraints:
      require: ["::-1"]
    tests:
      - name: "шалаш"
        stdin: "шалаш\n"
        stdout: "да"
      - name: "python"
        stdin: "python\n"
        stdout: "нет"
      - name: "Одна буква"
        stdin: "я\n"
        stdout: "да"
      - name: "Чётная длина"
        stdin: "abba\n"
        stdout: "да"
      - name: "Почти палиндром"
        stdin: "abca\n"
        stdout: "нет"

  - id: t3
    title: "Маскирование номера"
    difficulty: 2
    statement: |
      Программа читает номер карты (только цифры, длина не меньше 4) и выводит его в маскированном виде: все цифры, кроме последних четырёх, заменены на `*`.
    examples:
      - input: "4276550012345678"
        output: "************5678"
      - input: "1234"
        output: "1234"
    starter: |
      card = input()
      print(card)
    hints:
      - "Последние четыре символа — `card[-4:]`."
      - "Количество звёздочек — `len(card) - 4`; повторите `\"*\"` нужное число раз."
    solution: |
      card = input()
      print("*" * (len(card) - 4) + card[-4:])
    solution_explanation: "Звёздочки создаются повторением строки, хвост — срезом с отрицательным началом. Для номера длины 4 повторение на 0 даёт пустую строку."
    tests:
      - name: "16 цифр"
        stdin: "4276550012345678\n"
        stdout: "************5678"
      - name: "Ровно 4"
        stdin: "1234\n"
        stdout: "1234"
      - name: "5 цифр"
        stdin: "98765\n"
        stdout: "*8765"
      - name: "Длинный номер"
        stdin: "12345678901234567890\n"
        stdout: "****************7890"
      - name: "Длина сохраняется"
        stdin: "5555666677778888\n"
        code: |
          assert len(__stdout__.strip()) == 16

  - id: t4
    title: "Нарезка текста на куски"
    difficulty: 3
    statement: |
      Перед отправкой в языковую модель длинный текст режут на куски (чанки). Программа читает строку текста и размер куска `k` (целое > 0).
      Выведите каждый кусок длиной `k` символов на отдельной строке в квадратных скобках (последний может быть короче), а затем `Кусков: <количество>`.
    examples:
      - input: "abcdefgh\n3"
        output: "[abc]\n[def]\n[gh]\nКусков: 3"
    starter: |
      text = input()
      k = int(input())
    hints:
      - "Начала кусков — `range(0, len(text), k)`."
      - "Кусок — `text[start:start + k]`: срез сам обрежется у конца строки."
    solution: |
      text = input()
      k = int(input())
      count = 0
      for start in range(0, len(text), k):
          print("[" + text[start:start + k] + "]")
          count += 1
      print("Кусков:", count)
    solution_explanation: "Шаг range — размер куска, а срез не выходит за границы строки, поэтому последний кусок обрезается без дополнительных проверок. Для пустого текста цикл не выполнится и кусков будет 0."
    tests:
      - name: "Пример"
        stdin: "abcdefgh\n3\n"
        stdout: "[abc]\n[def]\n[gh]\nКусков: 3"
      - name: "Делится нацело"
        stdin: "abcdef\n2\n"
        stdout: "[ab]\n[cd]\n[ef]\nКусков: 3"
      - name: "Кусок больше текста"
        stdin: "hi\n10\n"
        stdout: "[hi]\nКусков: 1"
      - name: "Пустой текст"
        stdin: "\n5\n"
        stdout: "Кусков: 0"
      - name: "Пробелы сохраняются"
        stdin: "a b c d\n2\n"
        stdout: "[a ]\n[b ]\n[c ]\n[d]\nКусков: 4"
      - name: "По одному символу"
        stdin: "абв\n1\n"
        stdout: "[а]\n[б]\n[в]\nКусков: 3"
