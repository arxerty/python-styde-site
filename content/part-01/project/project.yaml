  title: Обработчик команд
  description: |
    Пользователь управляет задачами текстовыми командами. Напишите функцию, которая принимает строку команды и **возвращает** текст ответа (не печатает!) — тогда её можно проверить тестами и подключить к любому интерфейсу: консоли, чат-боту, веб-сервису.

    | Команда | Ответ |
    |---|---|
    | `add <название> [!приоритет] [@ГГГГ-ММ-ДД]` | `Добавлена: <строка задачи>` |
    | `done <номер>` | `Выполнена: #<номер> <название>` |
    | `del <номер>` | `Удалена: #<номер> <название>` |
    | `rename <номер> <новое название>` | `Изменена: <строка задачи>` |
    | `list` | активные задачи по порядку `sort_tasks` или `Задач нет` |
    | `list all` | все задачи по порядку или `Задач нет` |
    | `find <текст>` | найденные задачи по порядку или `Ничего не найдено` |
    | `stats` | `Всего: N, выполнено: D, активных: A, просрочено: O` |
    | `help` | краткая справка (любой текст, начинающийся с `Команды:`) |
    | пустая строка | пустая строка |
    | другое | `Неизвестная команда: <первое слово>. Введите help` |

    Строки задач в `list` и `find` выводятся через `format_task(task, today)` и разделяются переводом строки. Ошибки (`ValueError`, `TaskNotFoundError`) превращаются в ответ `Ошибка: <сообщение>`; нечисловой номер — `Ошибка: номер задачи должен быть числом`.
  hints:
  - '`match line.split():` с образцами `["add", *rest]`, `["done", number]` — отличный инструмент для разбора команд (блок 1.2).'
  tasks:
  - id: t1
    title: handle_command
    difficulty: 3
    statement: |
      Напишите `handle_command(tasks, line, today)` по таблице команд выше. В `add` слова, начинающиеся с `!`, задают приоритет, с `@` — срок, остальные слова — название.
    starter: |
      # функции этапов 1–6 уже доступны


      def handle_command(tasks, line, today):
          return ""
    hints:
    - 'Вспомогательные функции: `parse_add(words)` → (название, приоритет, срок) и `parse_id(text)` → int или ValueError с нужным сообщением.'
    - Оберните весь match в `try:` и перехватите `(ValueError, TaskNotFoundError)`.
    solution: |
      HELP = (
          "Команды: add <название> [!low|!medium|!high] [@ГГГГ-ММ-ДД], done <номер>, del <номер>, "
          "rename <номер> <название>, list [all], find <текст>, stats, help, выход"
      )


      def parse_add(words):
          """Разобрать аргументы add: слова названия, !приоритет и @срок."""
          priority = "medium"
          due = None
          title_words = []
          for word in words:
              if word.startswith("!") and len(word) > 1:
                  priority = word[1:]
              elif word.startswith("@") and len(word) > 1:
                  due = word[1:]
              else:
                  title_words.append(word)
          return " ".join(title_words), priority, due


      def parse_id(text):
          """Преобразовать номер задачи в int с понятной ошибкой."""
          try:
              return int(text)
          except ValueError:
              raise ValueError("номер задачи должен быть числом") from None


      def format_list(tasks, today):
          """Отформатировать список задач в порядке sort_tasks."""
          return "\n".join(format_task(task, today) for task in sort_tasks(tasks))


      def handle_command(tasks, line, today):
          """Выполнить команду пользователя и вернуть текст ответа."""
          words = line.split()
          try:
              match words:
                  case []:
                      return ""
                  case ["add", *rest]:
                      title, priority, due = parse_add(rest)
                      return "Добавлена: " + format_task(add_task(tasks, title, priority, due))
                  case ["done", number]:
                      task = complete_task(tasks, parse_id(number))
                      return f"Выполнена: #{task['id']} {task['title']}"
                  case ["del", number]:
                      task = delete_task(tasks, parse_id(number))
                      return f"Удалена: #{task['id']} {task['title']}"
                  case ["rename", number, *title]:
                      task = update_task(tasks, parse_id(number), title=" ".join(title))
                      return "Изменена: " + format_task(task)
                  case ["list"]:
                      active = filter_tasks(tasks, done=False)
                      return format_list(active, today) if active else "Задач нет"
                  case ["list", "all"]:
                      return format_list(tasks, today) if tasks else "Задач нет"
                  case ["find", *query] if query:
                      found = filter_tasks(tasks, query=" ".join(query))
                      return format_list(found, today) if found else "Ничего не найдено"
                  case ["stats"]:
                      stats = task_stats(tasks, today)
                      return (
                          f"Всего: {stats['total']}, выполнено: {stats['done']}, "
                          f"активных: {stats['active']}, просрочено: {stats['overdue']}"
                      )
                  case ["help"]:
                      return HELP
                  case [command, *_]:
                      return f"Неизвестная команда: {command}. Введите help"
          except (ValueError, TaskNotFoundError) as error:
              return f"Ошибка: {error}"
    solution_explanation: |
      Эталонная реализация этапа. Обратите внимание на docstring у каждой функции, охранные проверки в начале и на то, что функции возвращают результат, а не печатают его. Полный разбор проекта — в эталонном решении внизу страницы.
    setup: |
      from datetime import date

      PRIORITIES = ("low", "medium", "high")


      def validate_title(title):
          """Проверить и нормализовать название задачи."""
          if not isinstance(title, str) or not title.strip():
              raise ValueError("название задачи не может быть пустым")
          return title.strip()


      def validate_priority(priority):
          """Проверить, что приоритет — low, medium или high."""
          if priority not in PRIORITIES:
              raise ValueError("приоритет должен быть одним из: low, medium, high")
          return priority


      def validate_due(due):
          """Проверить срок в формате ГГГГ-ММ-ДД; None — срока нет."""
          if due is None:
              return None
          try:
              parsed = date.fromisoformat(due)
          except (TypeError, ValueError):
              parsed = None
          if parsed is None or parsed.isoformat() != due:
              raise ValueError(f"дата должна быть в формате ГГГГ-ММ-ДД, получено {due!r}")
          return due


      def make_task(task_id, title, priority="medium", due=None):
          """Создать словарь задачи после проверки полей."""
          return {
              "id": task_id,
              "title": validate_title(title),
              "priority": validate_priority(priority),
              "due": validate_due(due),
              "done": False,
          }

      def next_id(tasks):
          """Вернуть номер для новой задачи: на единицу больше максимального."""
          return max((task["id"] for task in tasks), default=0) + 1


      def add_task(tasks, title, priority="medium", due=None):
          """Создать задачу, добавить её в список и вернуть."""
          task = make_task(next_id(tasks), title, priority, due)
          tasks.append(task)
          return task

      class TaskNotFoundError(Exception):
          """Задача с таким номером не найдена."""


      VALIDATORS = {"title": validate_title, "priority": validate_priority, "due": validate_due}


      def find_task(tasks, task_id):
          """Найти задачу по номеру или бросить TaskNotFoundError."""
          for task in tasks:
              if task["id"] == task_id:
                  return task
          raise TaskNotFoundError(f"задача #{task_id} не найдена")


      def complete_task(tasks, task_id):
          """Отметить задачу выполненной и вернуть её."""
          task = find_task(tasks, task_id)
          task["done"] = True
          return task


      def update_task(tasks, task_id, **changes):
          """Изменить поля задачи (title, priority, due) после проверки."""
          task = find_task(tasks, task_id)
          for field in changes:
              if field not in VALIDATORS:
                  raise ValueError(f"поле {field} нельзя изменить")
          validated = {field: VALIDATORS[field](value) for field, value in changes.items()}
          task.update(validated)
          return task


      def delete_task(tasks, task_id):
          """Удалить задачу из списка и вернуть её."""
          task = find_task(tasks, task_id)
          tasks.remove(task)
          return task

      PRIORITY_RANK = {"high": 0, "medium": 1, "low": 2}


      def filter_tasks(tasks, *, done=None, priority=None, query=None, due_before=None):
          """Вернуть задачи, подходящие под все заданные условия."""
          result = []
          for task in tasks:
              if done is not None and task["done"] != done:
                  continue
              if priority is not None and task["priority"] != priority:
                  continue
              if query and query.lower() not in task["title"].lower():
                  continue
              if due_before is not None and (task["due"] is None or task["due"] >= due_before):
                  continue
              result.append(task)
          return result


      def sort_tasks(tasks):
          """Вернуть задачи по порядку: невыполненные, по приоритету, по сроку, по номеру."""
          return sorted(
              tasks,
              key=lambda task: (
                  task["done"],
                  PRIORITY_RANK[task["priority"]],
                  task["due"] is None,
                  task["due"] or "",
                  task["id"],
              ),
          )

      import json


      class StorageError(Exception):
          """Файл с задачами повреждён."""


      def save_tasks(path, tasks):
          """Сохранить задачи в JSON-файл."""
          with open(path, "w", encoding="utf-8") as file:
              json.dump(tasks, file, ensure_ascii=False, indent=2)


      def load_tasks(path):
          """Загрузить задачи из JSON-файла; нет файла — пустой список."""
          try:
              with open(path, encoding="utf-8") as file:
                  data = json.load(file)
          except FileNotFoundError:
              return []
          except json.JSONDecodeError as error:
              raise StorageError(f"файл {path} повреждён") from error
          if not isinstance(data, list):
              raise StorageError(f"файл {path} должен содержать список задач")
          return data

      def is_overdue(task, today):
          """Проверить, просрочена ли невыполненная задача на дату today."""
          return not task["done"] and task["due"] is not None and task["due"] < today


      def format_task(task, today=None):
          """Собрать строку задачи для вывода."""
          mark = "x" if task["done"] else " "
          details = task["priority"]
          if task["due"]:
              details += f", до {task['due']}"
          line = f"[{mark}] #{task['id']} {task['title']} ({details})"
          if today and is_overdue(task, today):
              line += " — просрочено"
          return line


      def task_stats(tasks, today):
          """Посчитать статистику по задачам."""
          done = sum(1 for task in tasks if task["done"])
          return {
              "total": len(tasks),
              "done": done,
              "active": len(tasks) - done,
              "overdue": sum(1 for task in tasks if is_overdue(task, today)),
          }
    tests:
    - name: Добавление
      call: handle_command([], 'add Купить молоко !high @2026-10-20', '2026-10-17')
      expected: '''Добавлена: [ ] #1 Купить молоко (high, до 2026-10-20)'''
    - name: 'Сценарий: done, list, stats'
      code: |
        tasks = []
        handle_command(tasks, 'add Отчёт !high', '2026-10-17')
        handle_command(tasks, 'add Хлеб !low', '2026-10-17')
        assert handle_command(tasks, 'done 2', '2026-10-17') == 'Выполнена: #2 Хлеб'
        assert handle_command(tasks, 'list', '2026-10-17') == '[ ] #1 Отчёт (high)'
        assert handle_command(tasks, 'list all', '2026-10-17') == '[ ] #1 Отчёт (high)\n[x] #2 Хлеб (low)'
        assert handle_command(tasks, 'stats', '2026-10-17') == 'Всего: 2, выполнено: 1, активных: 1, просрочено: 0'
    - name: Ошибки ввода
      code: |
        tasks = []
        assert handle_command(tasks, 'done abc', '2026-10-17') == 'Ошибка: номер задачи должен быть числом'
        assert handle_command(tasks, 'del 5', '2026-10-17') == 'Ошибка: задача #5 не найдена'
        assert handle_command(tasks, 'add', '2026-10-17') == 'Ошибка: название задачи не может быть пустым'
        assert handle_command(tasks, 'add X !super', '2026-10-17').startswith('Ошибка: приоритет')
    - name: Поиск и переименование
      code: |
        tasks = []
        handle_command(tasks, 'add Купить хлеб', '2026-10-17')
        assert handle_command(tasks, 'rename 1 Купить батон', '2026-10-17') == 'Изменена: [ ] #1 Купить батон (medium)'
        assert handle_command(tasks, 'find батон', '2026-10-17') == '[ ] #1 Купить батон (medium)'
        assert handle_command(tasks, 'find молоко', '2026-10-17') == 'Ничего не найдено'
    - name: Пустой список и неизвестная команда
      code: |
        assert handle_command([], 'list', '2026-10-17') == 'Задач нет'
        assert handle_command([], 'fly', '2026-10-17') == 'Неизвестная команда: fly. Введите help'
        assert handle_command([], '   ', '2026-10-17') == ''
        assert handle_command([], 'help', '2026-10-17').startswith('Команды:')
    - name: Просрочка в списке
      code: |
        tasks = []
        handle_command(tasks, 'add Сдать отчёт @2026-10-01', '2026-10-17')
        assert handle_command(tasks, 'list', '2026-10-17') == '[ ] #1 Сдать отчёт (medium, до 2026-10-01) — просрочено'
    timeout: 10
- id: stage-08
  title: Главный цикл программы
  description: |
    Соберите всё в работающее приложение. Функция `main()`:

    1. берёт текущую дату `date.today().isoformat()`;
    2. загружает задачи из `tasks.json` (при `StorageError` печатает `Ошибка: <сообщение>. Начинаем с пустого списка.` и начинает с пустого списка);
    3. печатает приветствие `Менеджер задач. Введите help для списка команд, выход — для завершения.`;
    4. в цикле читает команды через `input("> ")`, пока не встретит `выход` или `exit` (или конец ввода — `EOFError`);
    5. печатает непустые ответы `handle_command`;
    6. после команд, меняющих задачи (`add`, `done`, `del`, `rename`), сохраняет файл;
    7. в конце печатает `До встречи!`.

    Запуск `main()` — под `if __name__ == "__main__":`. Запустите программу кнопкой «Запустить», введя команды в поле ввода по одной на строку.
  hints:
  - Приглашение `> ` в input при проверке не учитывается — проверяется только то, что печатает print.
  tasks:
  - id: t1
    title: main
    difficulty: 3
    statement: |
      Напишите функцию `main()` по описанию этапа и запуск под `if __name__ == "__main__":`.
    starter: |
      # функции этапов 1–7 уже доступны
      STORAGE = "tasks.json"


      def main():
          pass


      if __name__ == "__main__":
          main()
    hints:
    - 'Цикл: `while True:` + `try: line = input("> ") except EOFError: break`.'
    - 'Проверка изменяющей команды: `words = line.split()` и `if words and words[0] in {"add", "done", "del", "rename"}: save_tasks(STORAGE, tasks)`.'
    solution: |
      STORAGE = "tasks.json"
      CHANGING_COMMANDS = {"add", "done", "del", "rename"}


      def main():
          """Запустить интерактивный менеджер задач."""
          today = date.today().isoformat()
          try:
              tasks = load_tasks(STORAGE)
          except StorageError as error:
              print(f"Ошибка: {error}. Начинаем с пустого списка.")
              tasks = []
          print("Менеджер задач. Введите help для списка команд, выход — для завершения.")
          while True:
              try:
                  line = input("> ")
              except EOFError:
                  break
              if line.strip() in ("выход", "exit"):
                  break
              result = handle_command(tasks, line, today)
              if result:
                  print(result)
              words = line.split()
              if words and words[0] in CHANGING_COMMANDS:
                  save_tasks(STORAGE, tasks)
          print("До встречи!")


      if __name__ == "__main__":
          main()
    solution_explanation: |
      Эталонная реализация этапа. Обратите внимание на docstring у каждой функции, охранные проверки в начале и на то, что функции возвращают результат, а не печатают его. Полный разбор проекта — в эталонном решении внизу страницы.
