    difficulty: 3
    statement: |
      Напишите:

      - исключение `StorageError(Exception)`;
      - `save_tasks(path, tasks)` — сохранить список задач в JSON (UTF-8, `ensure_ascii=False`, `indent=2`);
      - `load_tasks(path)` — загрузить список; нет файла → `[]`; невалидный JSON или не список → `StorageError` (для JSON-ошибки — с `from`).
