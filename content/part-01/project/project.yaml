- id: stage-06
  title: Вывод задач и статистика
  description: |
    Пользователь видит задачи строками вида:

    ```text
    [ ] #3 Позвонить маме (medium, до 2026-10-18) — просрочено
    [x] #4 Купить подарок (high, до 2026-10-19)
    [ ] #2 Купить хлеб (low)
    ```

    Пометка «просрочено» добавляется только для невыполненных задач со сроком раньше текущей даты. Текущую дату передаём параметром `today` (строкой `ГГГГ-ММ-ДД`), а не вычисляем внутри — так функции остаются чистыми и их легко проверить.
  hints:
  - Чистая функция с параметром `today` вместо `date.today()` внутри — приём, который делает код проверяемым тестами.
  tasks:
  - id: t1
    title: format_task и task_stats
    difficulty: 3
    statement: |
      Напишите:

      - `is_overdue(task, today)` — True для невыполненной задачи со сроком раньше `today`;
      - `format_task(task, today=None)` — строка `[x] #<id> <title> (<priority>[, до <due>])`, где `x` — для выполненной, пробел — для невыполненной; если `today` задан и задача просрочена — в конце ` — просрочено`;
      - `task_stats(tasks, today)` — словарь `{"total", "done", "active", "overdue"}`.
    starter: |
      # функции этапов 1–5 уже доступны


      def is_overdue(task, today):
          return False


      def format_task(task, today=None):
          return task["title"]


      def task_stats(tasks, today):
          return {}
    hints:
    - '`details = task["priority"]`, при наличии срока — `details += f", до {task[''due'']}"`.'
    - Статистика — счётчики через `sum(1 for task in tasks if ...)`.
    solution: |
      def is_overdue(task, today):
          """Проверить, просрочена ли невыполненная задача на дату today."""
          return not task["done"] and task["due"] is not None and task["due"] < today


      def format_task(task, today=None):
          """Собрать строку задачи для вывода."""
          mark = "x" if task["done"] else " "
          details = task["priority"]
          if task["due"]:
              details += f", до {task['due']}"
          line = f"[{mark}] #{task['id']} {task['title']} ({details})"
          if today and is_overdue(task, today):
              line += " — просрочено"
          return line


      def task_stats(tasks, today):
          """Посчитать статистику по задачам."""
          done = sum(1 for task in tasks if task["done"])
          return {
              "total": len(tasks),
              "done": done,
              "active": len(tasks) - done,
              "overdue": sum(1 for task in tasks if is_overdue(task, today)),
          }
