title: Менеджер задач в консоли
mode: browser
description: |
  **Проект части 1.** Вы соберёте консольный менеджер задач — небольшое, но настоящее приложение, в котором работают все темы части: функции, коллекции, условия и циклы, строки, исключения, файлы и JSON.

  **Что умеет программа:**

  - добавлять задачи с приоритетом и сроком, отмечать выполненными, переименовывать и удалять;
  - показывать активные и все задачи в разумном порядке, искать по тексту, отмечать просроченные;
  - считать статистику;
  - сохранять задачи в JSON-файл между запусками;
  - не падать от ошибок ввода, а объяснять, что не так.

  Пример сеанса:

  ```text
  Менеджер задач. Введите help для списка команд, выход — для завершения.
  > add Купить молоко !high @2026-10-20
  Добавлена: [ ] #1 Купить молоко (high, до 2026-10-20)
  > add Позвонить маме
  Добавлена: [ ] #2 Позвонить маме (medium)
  > done 1
  Выполнена: #1 Купить молоко
  > stats
  Всего: 2, выполнено: 1, активных: 1, просрочено: 0
  > выход
  До встречи!
  ```

  **Как устроен проект.** Он разбит на 8 этапов — от модели данных до главного цикла. Каждый этап проверяется тестами. Функции прошлых этапов на платформе подключаются автоматически (в эталонном виде), так что вы пишете только код текущего этапа. Чтобы получить цельную программу у себя на компьютере, складывайте решения этапов в один файл `taskman.py` по порядку.

  **Архитектура** — «логика отдельно от ввода-вывода»: этапы 1–7 — чистые функции, которые принимают данные и возвращают результат; `print` и `input` появляются только на этапе 8. Это делает код проверяемым и переиспользуемым: тот же `handle_command` можно подключить к Telegram-боту или веб-сервису.

  Используйте только темы части 1.
requirements:
- Добавление, выполнение, переименование и удаление задач
- Приоритеты (low/medium/high) и сроки (ГГГГ-ММ-ДД)
- Поиск по тексту и фильтры, сортировка по статусу, приоритету и сроку
- Сохранение в JSON и загрузка при запуске
- Обработка ошибок ввода без падения программы
- Код разбит на функции с docstring
stages:
- id: stage-01
  title: Модель задачи и валидация
  description: |
    Задача в менеджере — словарь с полями:

    | Поле | Тип | Пример |
    |---|---|---|
    | `id` | int | `3` |
    | `title` | str | `"Купить молоко"` |
    | `priority` | `"low"`, `"medium"`, `"high"` | `"high"` |
    | `due` | строка `ГГГГ-ММ-ДД` или `None` | `"2026-10-20"` |
    | `done` | bool | `False` |

    На этом этапе напишите функции проверки полей и функцию создания задачи. Каждая проверка либо возвращает нормализованное значение, либо бросает `ValueError` с понятным сообщением — принцип «падай рано» из блока 1.7.
  hints:
  - Даты удобно проверять через `date.fromisoformat`; чтобы не принимать форматы вроде `20261020`, сравните `parsed.isoformat()` с исходной строкой.
  tasks:
  - id: t1
    title: make_task и проверки полей
    difficulty: 2
    statement: |
      Напишите функции:

      - `validate_title(title)` — вернуть название без пробелов по краям; пустое (или не строка) → `ValueError`;
      - `validate_priority(priority)` — вернуть приоритет, если он `low`, `medium` или `high`, иначе `ValueError`;
      - `validate_due(due)` — `None` вернуть как есть; строку в формате `ГГГГ-ММ-ДД` с существующей датой — вернуть; иначе `ValueError`;
      - `make_task(task_id, title, priority="medium", due=None)` — вернуть словарь задачи с `done=False`, проверив поля.
    starter: |
      from datetime import date

      PRIORITIES = ("low", "medium", "high")


      def validate_title(title):
          pass


      def validate_priority(priority):
          pass


      def validate_due(due):
          pass


      def make_task(task_id, title, priority="medium", due=None):
          pass
    hints:
    - 'Название: `if not isinstance(title, str) or not title.strip(): raise ValueError(...)`.'
    - 'Дата: оберните `date.fromisoformat(due)` в try/except (TypeError, ValueError) и проверьте, что `parsed.isoformat() == due`.'
    solution: |
      from datetime import date

      PRIORITIES = ("low", "medium", "high")


      def validate_title(title):
          """Проверить и нормализовать название задачи."""
          if not isinstance(title, str) or not title.strip():
              raise ValueError("название задачи не может быть пустым")
          return title.strip()


      def validate_priority(priority):
          """Проверить, что приоритет — low, medium или high."""
          if priority not in PRIORITIES:
              raise ValueError("приоритет должен быть одним из: low, medium, high")
          return priority


      def validate_due(due):
          """Проверить срок в формате ГГГГ-ММ-ДД; None — срока нет."""
          if due is None:
              return None
          try:
              parsed = date.fromisoformat(due)
          except (TypeError, ValueError):
              parsed = None
          if parsed is None or parsed.isoformat() != due:
              raise ValueError(f"дата должна быть в формате ГГГГ-ММ-ДД, получено {due!r}")
          return due


      def make_task(task_id, title, priority="medium", due=None):
          """Создать словарь задачи после проверки полей."""
          return {
              "id": task_id,
              "title": validate_title(title),
              "priority": validate_priority(priority),
              "due": validate_due(due),
              "done": False,
          }
    solution_explanation: |
      Эталонная реализация этапа. Обратите внимание на docstring у каждой функции, охранные проверки в начале и на то, что функции возвращают результат, а не печатают его. Полный разбор проекта — в эталонном решении внизу страницы.
    setup: ''
    tests:
    - name: Создание задачи
      call: make_task(1, '  Купить молоко ', 'high', '2026-10-20')
      expected: '{''id'': 1, ''title'': ''Купить молоко'', ''priority'': ''high'', ''due'': ''2026-10-20'', ''done'': False}'
    - name: Значения по умолчанию
      call: make_task(2, 'Позвонить')
      expected: '{''id'': 2, ''title'': ''Позвонить'', ''priority'': ''medium'', ''due'': None, ''done'': False}'
    - name: Пустое название
      code: |
        try:
            make_task(1, '   ')
        except ValueError:
            pass
        else:
            raise AssertionError('Ожидался ValueError')
    - name: Неверный приоритет
      code: |
        try:
            validate_priority('urgent')
        except ValueError:
            pass
        else:
            raise AssertionError('Ожидался ValueError')
    - name: Неверные даты
      code: |
        for bad in ['2026-13-01', '20.10.2026', '2026-02-30', '20261020', 42]:
            try:
                validate_due(bad)
            except ValueError:
                continue
            raise AssertionError(f'Дата {bad!r} должна вызывать ValueError')
    - name: Корректная дата и None
      call: (validate_due('2028-02-29'), validate_due(None))
      expected: ('2028-02-29', None)
    timeout: 10
- id: stage-02
  title: Добавление задач и нумерация
  description: |
    Список задач — обычный список словарей. Новая задача получает номер на единицу больше максимального среди существующих (а не `len(tasks) + 1` — после удалений номера иначе бы повторялись).

    Функции прошлого этапа уже подключены — используйте `make_task`.
  hints:
  - 'У `max` есть параметр `default` — значение для пустой последовательности: `max([], default=0)` вернёт 0.'
  tasks:
  - id: t1
    title: next_id и add_task
    difficulty: 2
    statement: |
      Напишите:

      - `next_id(tasks)` — номер для новой задачи (для пустого списка — 1);
      - `add_task(tasks, title, priority="medium", due=None)` — создать задачу через `make_task`, добавить в конец списка и вернуть её.
    starter: |
      # make_task и проверки из этапа 1 уже доступны


      def next_id(tasks):
          return len(tasks) + 1


      def add_task(tasks, title, priority="medium", due=None):
          pass
    hints:
    - '`max((task["id"] for task in tasks), default=0) + 1`.'
    - '`task = make_task(next_id(tasks), title, priority, due)`, затем `tasks.append(task)` и `return task`.'
    solution: |
      def next_id(tasks):
          """Вернуть номер для новой задачи: на единицу больше максимального."""
          return max((task["id"] for task in tasks), default=0) + 1


      def add_task(tasks, title, priority="medium", due=None):
          """Создать задачу, добавить её в список и вернуть."""
          task = make_task(next_id(tasks), title, priority, due)
          tasks.append(task)
          return task
    solution_explanation: |
      Эталонная реализация этапа. Обратите внимание на docstring у каждой функции, охранные проверки в начале и на то, что функции возвращают результат, а не печатают его. Полный разбор проекта — в эталонном решении внизу страницы.
    setup: |
      from datetime import date

      PRIORITIES = ("low", "medium", "high")


      def validate_title(title):
          """Проверить и нормализовать название задачи."""
          if not isinstance(title, str) or not title.strip():
              raise ValueError("название задачи не может быть пустым")
          return title.strip()


      def validate_priority(priority):
          """Проверить, что приоритет — low, medium или high."""
          if priority not in PRIORITIES:
              raise ValueError("приоритет должен быть одним из: low, medium, high")
          return priority


      def validate_due(due):
          """Проверить срок в формате ГГГГ-ММ-ДД; None — срока нет."""
          if due is None:
              return None
          try:
              parsed = date.fromisoformat(due)
          except (TypeError, ValueError):
              parsed = None
          if parsed is None or parsed.isoformat() != due:
              raise ValueError(f"дата должна быть в формате ГГГГ-ММ-ДД, получено {due!r}")
          return due


      def make_task(task_id, title, priority="medium", due=None):
          """Создать словарь задачи после проверки полей."""
          return {
              "id": task_id,
              "title": validate_title(title),
              "priority": validate_priority(priority),
              "due": validate_due(due),
              "done": False,
          }
    tests:
    - name: Первая задача
      call: next_id([])
      expected: '1'
    - name: После удаления номера не повторяются
      call: 'next_id([{''id'': 1}, {''id'': 5}])'
      expected: '6'
    - name: add_task добавляет и возвращает
      code: |
        tasks = []
        t1 = add_task(tasks, 'A')
        t2 = add_task(tasks, 'B', 'low', '2026-01-01')
        assert tasks == [t1, t2]
        assert (t1['id'], t2['id'], t2['priority']) == (1, 2, 'low')
    - name: Ошибка не добавляет задачу
      code: |
        tasks = []
        try:
            add_task(tasks, '')
        except ValueError:
            pass
        assert tasks == [], 'Некорректная задача не должна попасть в список'
    - name: Номер от максимального
      code: |
        tasks = [{'id': 3, 'title': 'x', 'priority': 'low', 'due': None, 'done': False}]
        assert add_task(tasks, 'y')['id'] == 4
    timeout: 10
- id: stage-03
  title: Поиск, выполнение, изменение и удаление
  description: |
    Операции над конкретной задачей начинаются с её поиска по номеру. Если задачи нет, это не повод возвращать `None`: заведите собственное исключение `TaskNotFoundError` — вызывающий код (обработчик команд на этапе 7) превратит его в сообщение пользователю.

    `update_task` должна сначала проверить **все** изменения и только потом применить их — иначе ошибка во втором поле оставит задачу «наполовину изменённой».
  hints:
  - 'Словарь функций-валидаторов `{"title": validate_title, ...}` позволяет проверять поля одним циклом — без цепочки if.'
  tasks:
  - id: t1
    title: find, complete, update, delete
    difficulty: 2
    statement: |
      Напишите:

      - исключение `TaskNotFoundError(Exception)`;
      - `find_task(tasks, task_id)` — вернуть задачу или бросить `TaskNotFoundError` с сообщением `задача #<номер> не найдена`;
      - `complete_task(tasks, task_id)` — отметить выполненной, вернуть задачу;
      - `update_task(tasks, task_id, **changes)` — изменить поля `title`, `priority`, `due` (с проверкой); другое поле → `ValueError`; при ошибке задача не меняется;
      - `delete_task(tasks, task_id)` — удалить из списка, вернуть удалённую задачу.
    starter: |
      # функции этапов 1–2 уже доступны


      def find_task(tasks, task_id):
          return tasks[task_id]
    hints:
    - '`VALIDATORS = {"title": validate_title, "priority": validate_priority, "due": validate_due}`.'
    - 'update_task: проверьте имена полей, затем `validated = {f: VALIDATORS[f](v) for f, v in changes.items()}` и `task.update(validated)`.'
    solution: |
      class TaskNotFoundError(Exception):
          """Задача с таким номером не найдена."""


      VALIDATORS = {"title": validate_title, "priority": validate_priority, "due": validate_due}


      def find_task(tasks, task_id):
          """Найти задачу по номеру или бросить TaskNotFoundError."""
          for task in tasks:
              if task["id"] == task_id:
                  return task
          raise TaskNotFoundError(f"задача #{task_id} не найдена")


      def complete_task(tasks, task_id):
          """Отметить задачу выполненной и вернуть её."""
          task = find_task(tasks, task_id)
          task["done"] = True
          return task


      def update_task(tasks, task_id, **changes):
          """Изменить поля задачи (title, priority, due) после проверки."""
          task = find_task(tasks, task_id)
          for field in changes:
              if field not in VALIDATORS:
                  raise ValueError(f"поле {field} нельзя изменить")
          validated = {field: VALIDATORS[field](value) for field, value in changes.items()}
          task.update(validated)
          return task


      def delete_task(tasks, task_id):
          """Удалить задачу из списка и вернуть её."""
          task = find_task(tasks, task_id)
          tasks.remove(task)
          return task
    solution_explanation: |
      Эталонная реализация этапа. Обратите внимание на docstring у каждой функции, охранные проверки в начале и на то, что функции возвращают результат, а не печатают его. Полный разбор проекта — в эталонном решении внизу страницы.
    setup: |
      from datetime import date

      PRIORITIES = ("low", "medium", "high")


      def validate_title(title):
          """Проверить и нормализовать название задачи."""
          if not isinstance(title, str) or not title.strip():
              raise ValueError("название задачи не может быть пустым")
          return title.strip()


      def validate_priority(priority):
          """Проверить, что приоритет — low, medium или high."""
          if priority not in PRIORITIES:
              raise ValueError("приоритет должен быть одним из: low, medium, high")
          return priority


      def validate_due(due):
          """Проверить срок в формате ГГГГ-ММ-ДД; None — срока нет."""
          if due is None:
              return None
          try:
              parsed = date.fromisoformat(due)
          except (TypeError, ValueError):
              parsed = None
          if parsed is None or parsed.isoformat() != due:
              raise ValueError(f"дата должна быть в формате ГГГГ-ММ-ДД, получено {due!r}")
          return due


      def make_task(task_id, title, priority="medium", due=None):
          """Создать словарь задачи после проверки полей."""
          return {
              "id": task_id,
              "title": validate_title(title),
              "priority": validate_priority(priority),
              "due": validate_due(due),
              "done": False,
          }

      def next_id(tasks):
          """Вернуть номер для новой задачи: на единицу больше максимального."""
          return max((task["id"] for task in tasks), default=0) + 1


      def add_task(tasks, title, priority="medium", due=None):
          """Создать задачу, добавить её в список и вернуть."""
          task = make_task(next_id(tasks), title, priority, due)
          tasks.append(task)
          return task
    tests:
    - name: Поиск
      code: |
        tasks = []
        add_task(tasks, 'A')
        add_task(tasks, 'B')
        assert find_task(tasks, 2)['title'] == 'B'
    - name: Нет задачи
      code: |
        try:
            find_task([], 7)
        except TaskNotFoundError as error:
            assert str(error) == 'задача #7 не найдена', str(error)
        else:
            raise AssertionError('Ожидался TaskNotFoundError')
    - name: Выполнение
      code: |
        tasks = []
        add_task(tasks, 'A')
        assert complete_task(tasks, 1)['done'] is True and tasks[0]['done'] is True
    - name: Изменение с проверкой
      code: |
        tasks = []
        add_task(tasks, 'A')
        update_task(tasks, 1, title=' B ', priority='high')
        assert (tasks[0]['title'], tasks[0]['priority']) == ('B', 'high')
    - name: Ошибка не меняет задачу частично
      code: |
        tasks = []
        add_task(tasks, 'A')
        try:
            update_task(tasks, 1, title='Новое', due='вчера')
        except ValueError:
            pass
        assert tasks[0]['title'] == 'A', 'При ошибке задача не должна меняться'
    - name: Неизвестное поле
      code: |
        tasks = []
        add_task(tasks, 'A')
        try:
            update_task(tasks, 1, done=True)
        except ValueError:
            pass
        else:
            raise AssertionError('Поле done нельзя менять через update_task')
    - name: Удаление
      code: |
        tasks = []
        add_task(tasks, 'A')
        add_task(tasks, 'B')
        removed = delete_task(tasks, 1)
        assert removed['title'] == 'A' and [t['id'] for t in tasks] == [2]
    timeout: 10
- id: stage-04
  title: Фильтры и сортировка
  description: |
    Пользователю нужны выборки: только активные, только важные, найденные по слову, со сроком до даты. И разумный порядок: сначала невыполненные, внутри — по приоритету, затем по сроку (задачи без срока — в конце), затем по номеру.

    Полезное свойство формата `ГГГГ-ММ-ДД`: такие строки можно сравнивать обычными `<` и `>` — лексикографический порядок совпадает с хронологическим.
  hints:
  - Ключ сортировки — кортеж; `False < True`, поэтому `task["done"]` первым элементом ставит невыполненные вперёд.
  tasks:
  - id: t1
    title: filter_tasks и sort_tasks
    difficulty: 2
    statement: |
      Напишите:

      - `filter_tasks(tasks, *, done=None, priority=None, query=None, due_before=None)` — задачи, удовлетворяющие **всем** заданным условиям (`None` — условие не применяется): статус выполнения, приоритет, подстрока в названии без учёта регистра, срок строго раньше `due_before` (задачи без срока под это условие не подходят). Порядок — исходный.
      - `sort_tasks(tasks)` — **новый** список: невыполненные раньше выполненных, затем high → medium → low, затем по сроку (без срока — в конце), затем по номеру.
    starter: |
      # функции этапов 1–3 уже доступны


      def filter_tasks(tasks, *, done=None, priority=None, query=None, due_before=None):
          return tasks


      def sort_tasks(tasks):
          return sorted(tasks, key=lambda task: task["priority"])
    hints:
    - 'В filter_tasks на каждое условие — `if ... : continue`, в конце `result.append(task)`.'
    - '`PRIORITY_RANK = {"high": 0, "medium": 1, "low": 2}`; ключ: `(t["done"], PRIORITY_RANK[t["priority"]], t["due"] is None, t["due"] or "", t["id"])`.'
    solution: |
      PRIORITY_RANK = {"high": 0, "medium": 1, "low": 2}


      def filter_tasks(tasks, *, done=None, priority=None, query=None, due_before=None):
          """Вернуть задачи, подходящие под все заданные условия."""
          result = []
          for task in tasks:
              if done is not None and task["done"] != done:
                  continue
              if priority is not None and task["priority"] != priority:
                  continue
              if query and query.lower() not in task["title"].lower():
                  continue
