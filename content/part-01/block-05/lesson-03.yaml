questions:
  - id: q1
    type: output
    prompt: "Что выведет код?"
    code: |
      a = (5)
      b = (5,)
      print(type(a).__name__, type(b).__name__, len(b))
    options:
      - text: "`int tuple 1`"
        correct: true
        why: "Кортеж создаёт запятая: (5) — число в скобках, (5,) — кортеж из одного элемента."
      - text: "`tuple tuple 1`"
        why: "Скобки без запятой лишь группируют выражение."
      - text: "`int int 1`"
        why: "Запятая превращает значение в кортеж."
    explanation: "Кортеж из одного элемента пишется с запятой: (x,)."

  - id: q2
    type: output
    prompt: "Что выведет код?"
    code: |
      first, *rest = [1, 2, 3]
      *init, last = "abc"
      print(first, rest, init, last)
    options:
      - text: "`1 [2, 3] ['a', 'b'] c`"
        correct: true
        why: "Переменная со звёздочкой собирает остаток в список."
      - text: "`1 (2, 3) ('a', 'b') c`"
        why: "Звёздочная переменная всегда становится списком, а не кортежем."
      - text: "`1 2 a c`"
        why: "Звёздочка собирает все оставшиеся элементы, а не один."
    explanation: "`*имя` при распаковке собирает лишние элементы в список (возможно, пустой)."

  - id: q3
    type: find_bug
    prompt: "Почему код падает?"
    code: |
      point = (3, 4)
      point[0] = 10
      print(point)
    options:
      - text: "Кортеж неизменяем — элемент нельзя заменить; нужно создать новый: `point = (10, point[1])`"
        correct: true
        why: "TypeError: 'tuple' object does not support item assignment."
      - text: "Индексы кортежа начинаются с 1"
        why: "С нуля, как у списков и строк."
      - text: "Кортеж нельзя печатать"
        why: "Можно."
    explanation: "Неизменяемость — главное свойство кортежа."

  - id: q4
    type: multiple
    prompt: "В каких случаях кортеж подходит лучше списка? Выберите все."
    options:
      - text: "Координаты точки (x, y)"
        correct: true
        why: "Запись фиксированной длины с разными по смыслу полями."
      - text: "Ключ словаря из нескольких значений"
        correct: true
        why: "Ключи должны быть неизменяемыми — список не подойдёт."
      - text: "Форма тензора (32, 3, 224, 224)"
        correct: true
        why: "Фиксированная запись размерностей — в NumPy и PyTorch это кортеж."
      - text: "История сообщений, к которой постоянно добавляются новые"
        why: "Изменяемая коллекция переменной длины — это список."
    explanation: "Список — однородный изменяемый набор; кортеж — неизменяемая запись фиксированной структуры."

  - id: q5
    type: output
    prompt: "Что выведет код?"
    code: |
      print((1, 2) < (1, 3), (2, 0) > (1, 99), ("a", 5) == ("a", 5.0))
    options:
      - text: "`True True True`"
        correct: true
        why: "Сравнение поэлементное: решает первая различающаяся пара; 5 == 5.0."
      - text: "`True False True`"
        why: "Первые элементы 2 > 1 — дальше не сравнивается."
      - text: "`True True False`"
        why: "int и float с одинаковым значением равны."
    explanation: "Кортежи сравниваются лексикографически, как строки."

  - id: q6
    type: output
    prompt: "Что выведет код?"
    code: |
      a, (b, c) = 1, (2, 3)
      print(a + b * c)
    answer: "7"
    explanation: "Вложенная распаковка: a = 1, b = 2, c = 3; 1 + 2 × 3 = 7."

tasks:
  - id: t1
    title: "Самая далёкая точка"
    difficulty: 2
    statement: |
      Программа читает `n`, затем `n` строк вида `x,y` (целые числа). Сохраните точки как кортежи и выведите:

      ```text
      Дальше всех: (<x>, <y>)
      Центр: (<среднее x>, <среднее y>)
      ```

      «Дальше всех» — от начала координат (при равенстве — первая). Средние — с округлением до 2 знаков.
    examples:
      - input: "3\n1,2\n-3,4\n0,0"
        output: "Дальше всех: (-3, 4)\nЦентр: (-0.67, 2.0)"
    starter: |
      n = int(input())
      points = []
      for _ in range(n):
          line = input()
    hints:
      - "Распакуйте: `x, y = line.split(\",\")`, добавьте `(int(x), int(y))`."
      - "Расстояние сравнивайте по `x * x + y * y` (корень не нужен). Выводите кортеж через print: он сам напечатается в скобках."
    solution: |
      n = int(input())
      points = []
      for _ in range(n):
          x, y = input().split(",")
          points.append((int(x), int(y)))
      farthest = points[0]
      for x, y in points:
          if x * x + y * y > farthest[0] ** 2 + farthest[1] ** 2:
              farthest = (x, y)
      sum_x = 0
      sum_y = 0
      for x, y in points:
          sum_x += x
          sum_y += y
      print("Дальше всех:", farthest)
      print("Центр:", (round(sum_x / n, 2), round(sum_y / n, 2)))
    solution_explanation: "Точки хранятся кортежами, циклы распаковывают их в x и y. Для сравнения расстояний корень не нужен: квадраты сохраняют порядок."
    tests:
      - name: "Пример"
        stdin: "3\n1,2\n-3,4\n0,0\n"
        stdout: "Дальше всех: (-3, 4)\nЦентр: (-0.67, 2.0)"
      - name: "Одна точка"
        stdin: "1\n5,5\n"
        stdout: "Дальше всех: (5, 5)\nЦентр: (5.0, 5.0)"
      - name: "Равные расстояния — первая"
        stdin: "2\n3,4\n4,3\n"
        stdout: "Дальше всех: (3, 4)\nЦентр: (3.5, 3.5)"
      - name: "Все в начале"
        stdin: "2\n0,0\n0,0\n"
        stdout: "Дальше всех: (0, 0)\nЦентр: (0.0, 0.0)"
      - name: "Отрицательные"
        stdin: "3\n-1,-1\n-10,0\n2,2\n"
        stdout: "Дальше всех: (-10, 0)\nЦентр: (-3.0, 0.33)"

  - id: t2
    title: "Первый, последний и середина"
    difficulty: 1
    statement: |
      Программа читает строку чисел (хотя бы два). С помощью распаковки со звёздочкой выведите:

      ```text
      Первый: <первое>
      Последний: <последнее>
      Середина: <числа между ними через пробел или «нет»>
      ```
    examples:
      - input: "5 1 9 3"
        output: "Первый: 5\nПоследний: 3\nСередина: 1 9"
    starter: |
      numbers = input().split()
      first = numbers[0]
    hints:
      - "`first, *middle, last = numbers`."
      - "middle — список строк; пустой список — falsy: `\" \".join(middle) if middle else \"нет\"`."
    solution: |
      numbers = input().split()
      first, *middle, last = numbers
      print("Первый:", first)
      print("Последний:", last)
      print("Середина:", " ".join(middle) if middle else "нет")
    solution_explanation: "Звёздочная распаковка разбирает последовательность на «голову», «середину» и «хвост» без индексов и срезов."
    constraints:
      require: ["*"]
    tests:
      - name: "Пример"
        stdin: "5 1 9 3\n"
        stdout: "Первый: 5\nПоследний: 3\nСередина: 1 9"
      - name: "Два числа"
        stdin: "7 8\n"
        stdout: "Первый: 7\nПоследний: 8\nСередина: нет"
      - name: "Три числа"
        stdin: "1 2 3\n"
        stdout: "Первый: 1\nПоследний: 3\nСередина: 2"
      - name: "Длинный"
        stdin: "0 1 2 3 4 5 6\n"
        stdout: "Первый: 0\nПоследний: 6\nСередина: 1 2 3 4 5"
      - name: "Отрицательные"
        stdin: "-1 -2\n"
        stdout: "Первый: -1\nПоследний: -2\nСередина: нет"

  - id: t3
    title: "Сортировка по двум признакам"
    difficulty: 2
    statement: |
      Программа читает `n`, затем `n` строк `<имя> <возраст> <город>` (имя и город — одно слово). Выведите людей, отсортированных по городу (по алфавиту), а внутри города — по возрасту (по возрастанию), в формате `<город>: <имя> (<возраст>)`.
    examples:
      - input: "3\nАда 36 Лондон\nГрейс 85 Нью-Йорк\nБилл 30 Лондон"
        output: "Лондон: Билл (30)\nЛондон: Ада (36)\nНью-Йорк: Грейс (85)"
    starter: |
      n = int(input())
      rows = []
    hints:
      - "Составляйте кортежи в порядке признаков сортировки: `(city, int(age), name)`."
      - "`sorted(rows)` отсортирует кортежи поэлементно; распакуйте их в цикле."
    solution: |
      n = int(input())
      rows = []
      for _ in range(n):
          name, age, city = input().split()
          rows.append((city, int(age), name))
      for city, age, name in sorted(rows):
          print(f"{city}: {name} ({age})")
    solution_explanation: "Кортежи сравниваются поэлементно: сначала город, при равенстве — возраст. Возраст обязательно int — иначе «9» оказался бы больше «30»."
    tests:
      - name: "Пример"
        stdin: "3\nАда 36 Лондон\nГрейс 85 Нью-Йорк\nБилл 30 Лондон\n"
        stdout: "Лондон: Билл (30)\nЛондон: Ада (36)\nНью-Йорк: Грейс (85)"
      - name: "Возраст как число"
        stdin: "2\nА 9 Москва\nБ 30 Москва\n"
        stdout: "Москва: А (9)\nМосква: Б (30)"
      - name: "Один человек"
        stdin: "1\nАлан 41 Манчестер\n"
        stdout: "Манчестер: Алан (41)"
      - name: "Разные города"
        stdin: "3\nX 50 Омск\nY 20 Казань\nZ 70 Архангельск\n"
        stdout: "Архангельск: Z (70)\nКазань: Y (20)\nОмск: X (50)"
      - name: "Ноль строк"
        stdin: "0\n"
        stdout: ""

  - id: t4
    title: "Пересечение отрезков"
    difficulty: 3
    statement: |
      Программа читает два отрезка числовой прямой — по строке `a b` (целые, a ≤ b). Выведите их пересечение как кортеж `(начало, конец)` или `нет`, если отрезки не пересекаются. Касание в точке — пересечение длины 0.
    examples:
      - input: "1 5\n3 8"
        output: "(3, 5)"
      - input: "1 2\n5 6"
        output: "нет"
    starter: |
      a1, b1 = input().split()
      a2, b2 = input().split()
    hints:
      - "Начало пересечения — `max(a1, a2)`, конец — `min(b1, b2)` (не забудьте int)."
      - "Пересечение есть, если начало ≤ конца."
    solution: |
      a1, b1 = map(int, input().split())
      a2, b2 = map(int, input().split())
      start = max(a1, a2)
      end = min(b1, b2)
      if start <= end:
          print((start, end))
      else:
          print("нет")
    solution_explanation: "Пересечение начинается там, где начинается «позже начавшийся» отрезок, и заканчивается там, где заканчивается «раньше закончившийся». map(int, ...) превращает обе части в числа — о map подробнее в блоке 1.6."
    tests:
      - name: "Частичное"
        stdin: "1 5\n3 8\n"
        stdout: "(3, 5)"
      - name: "Нет пересечения"
        stdin: "1 2\n5 6\n"
        stdout: "нет"
      - name: "Касание"
        stdin: "1 3\n3 7\n"
        stdout: "(3, 3)"
      - name: "Вложенный"
        stdin: "0 10\n2 4\n"
        stdout: "(2, 4)"
      - name: "Порядок не важен"
        stdin: "5 9\n1 6\n"
        stdout: "(5, 6)"
      - name: "Отрицательные"
        stdin: "-5 -1\n-3 2\n"
        stdout: "(-3, -1)"
