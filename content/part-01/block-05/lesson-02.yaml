questions:
  - id: q1
    type: output
    prompt: "Что выведет код?"
    code: |
      for i, ch in enumerate("ab", start=1):
          print(i, ch)
    options:
      - text: |
          ```
          1 a
          2 b
          ```
        correct: true
        why: "enumerate выдаёт пары (номер, элемент), нумерация с start=1."
      - text: |
          ```
          0 a
          1 b
          ```
        why: "start=1 сдвигает нумерацию на единицу."
      - text: |
          ```
          a 1
          b 2
          ```
        why: "Первым в паре идёт номер, вторым — элемент."
    explanation: "enumerate(seq, start=k) — элементы с номерами, начиная с k."

  - id: q2
    type: output
    prompt: "Что выведет код?"
    code: |
      print(list(zip([1, 2, 3], "ab")))
    options:
      - text: "`[(1, 'a'), (2, 'b')]`"
        correct: true
        why: "zip останавливается на самой короткой последовательности."
      - text: "`[(1, 'a'), (2, 'b'), (3, None)]`"
        why: "zip не дополняет короткие последовательности."
      - text: "Ошибку из-за разной длины"
        why: "Без strict=True ошибки нет — лишнее молча отбрасывается."
    explanation: "zip сцепляет элементы с одинаковыми позициями до конца самой короткой последовательности."

  - id: q3
    type: single
    prompt: "Чем `sorted(lst)` отличается от `lst.sort()`?"
    options:
      - text: "sorted возвращает новый список и не меняет исходный; sort сортирует на месте и возвращает None"
        correct: true
        why: "Выбирайте sorted, если исходный порядок ещё понадобится."
      - text: "sorted сортирует по убыванию, sort — по возрастанию"
        why: "Оба по возрастанию; порядок задаёт reverse=True."
      - text: "Ничем, это синонимы"
        why: "Разница в изменении списка и возвращаемом значении."
      - text: "sort работает только с числами"
        why: "Оба работают с любыми сравнимыми элементами."
    explanation: "sorted — функция для любых последовательностей; sort — метод списка."

  - id: q4
    type: find_bug
    prompt: "После кода `scores` оказывается None. Почему?"
    code: |
      scores = [70, 95, 82]
      scores = scores.sort(reverse=True)
      print(scores)
    options:
      - text: "sort() сортирует на месте и возвращает None, которое затёрло список"
        correct: true
        why: "Нужно `scores.sort(reverse=True)` или `scores = sorted(scores, reverse=True)`."
      - text: "reverse=True нельзя использовать с sort"
        why: "Можно — у sort тот же параметр."
      - text: "Список чисел нельзя сортировать по убыванию"
        why: "Можно."
    explanation: "Методы, изменяющие список, возвращают None."

  - id: q5
    type: output
    prompt: "Что выведет код?"
    code: |
      words = ["bb", "a", "ccc", "dd"]
      print(sorted(words, key=len, reverse=True))
    options:
      - text: "`['ccc', 'bb', 'dd', 'a']`"
        correct: true
        why: "По убыванию длины; «bb» и «dd» одной длины сохраняют исходный порядок."
      - text: "`['ccc', 'dd', 'bb', 'a']`"
        why: "Сортировка стабильна: при равных ключах сохраняется исходный порядок, даже с reverse=True."
      - text: "`['dd', 'ccc', 'bb', 'a']`"
        why: "Сравнивается длина, а не алфавит."
    explanation: "key=len сравнивает длины; стабильность сохраняет порядок равных элементов."

  - id: q6
    type: output
    prompt: "Что выведет код?"
    code: |
      print(sorted("bca"), "".join(sorted("bca")))
    answer: "['a', 'b', 'c'] abc"
    explanation: "sorted от строки возвращает список символов; join склеивает их обратно."

tasks:
  - id: t1
    title: "Нумерованный список"
    difficulty: 1
    statement: |
      Программа читает слова через пробел и выводит их нумерованным списком: `<номер>. <слово>`, номера с 1. Используйте `enumerate`.
    examples:
      - input: "данные модель метрика"
        output: "1. данные\n2. модель\n3. метрика"
    starter: |
      words = input().split()
      for i in range(len(words)):
          print(i, words[i])
    hints:
      - "`for number, word in enumerate(words, start=1):`."
      - "Формат: `print(f\"{number}. {word}\")`."
    solution: |
      words = input().split()
      for number, word in enumerate(words, start=1):
          print(f"{number}. {word}")
    solution_explanation: "enumerate с start=1 избавляет от range(len()) и ручного прибавления единицы."
    constraints:
      require: ["enumerate"]
    tests:
      - name: "Пример"
        stdin: "данные модель метрика\n"
        stdout: "1. данные\n2. модель\n3. метрика"
      - name: "Одно слово"
        stdin: "AI\n"
        stdout: "1. AI"
      - name: "Пусто"
        stdin: "\n"
        stdout: ""
      - name: "Двузначные номера"
        stdin: "a b c d e f g h i j k\n"
        code: |
          assert __stdout__.strip().splitlines()[-1] == "11. k"
      - name: "Повторы"
        stdin: "да да\n"
        stdout: "1. да\n2. да"

  - id: t2
    title: "Точность и ошибки модели"
    difficulty: 2
    statement: |
      Программа читает две строки чисел через пробел: предсказания модели и правильные метки (одинаковой длины, хотя бы один элемент).
      Выведите `Accuracy: <доля верных в процентах с 1 знаком>` и `Ошибки: <номера позиций с 1 через пробел>` (или `Ошибки: нет`).
    examples:
      - input: "1 0 1 1\n1 1 1 0"
        output: "Accuracy: 50.0%\nОшибки: 2 4"
    starter: |
      predictions = input().split()
      labels = input().split()
    hints:
      - "`for i, (pred, label) in enumerate(zip(predictions, labels), start=1):`."
      - "Номера ошибок копите в список строк и соберите `\" \".join(...)`."
    solution: |
      predictions = input().split()
      labels = input().split()
      errors = []
      correct = 0
      for i, (pred, label) in enumerate(zip(predictions, labels, strict=True), start=1):
          if pred == label:
              correct += 1
          else:
              errors.append(str(i))
      print(f"Accuracy: {correct / len(labels):.1%}")
      print("Ошибки:", " ".join(errors) if errors else "нет")
    solution_explanation: "zip сцепляет предсказание с меткой, enumerate даёт номер позиции. strict=True страхует от рассинхронизации длин — в реальных данных это частая тихая ошибка."
    tests:
      - name: "Пример"
        stdin: "1 0 1 1\n1 1 1 0\n"
        stdout: "Accuracy: 50.0%\nОшибки: 2 4"
      - name: "Без ошибок"
        stdin: "0 1 2\n0 1 2\n"
        stdout: "Accuracy: 100.0%\nОшибки: нет"
      - name: "Все ошибки"
        stdin: "1 1\n0 0\n"
        stdout: "Accuracy: 0.0%\nОшибки: 1 2"
      - name: "Треть"
        stdin: "a b c\na x y\n"
        stdout: "Accuracy: 33.3%\nОшибки: 2 3"
      - name: "Один элемент"
        stdin: "5\n5\n"
        stdout: "Accuracy: 100.0%\nОшибки: нет"

  - id: t3
    title: "Самые длинные слова"
    difficulty: 2
    statement: |
      Программа читает строку слов и выводит до трёх самых длинных слов через пробел — по убыванию длины, при равной длине в порядке появления в тексте. Повторы слов не удаляются.
    examples:
      - input: "я учу машинное обучение и нейросети"
        output: "нейросети машинное обучение"
    starter: |
      words = input().split()
      print(sorted(words)[:3])
    hints:
      - "`sorted(words, key=len, reverse=True)` — по убыванию длины; стабильность сохранит порядок равных."
      - "Первые три — срез `[:3]`; выведите через `\" \".join(...)`."
    solution: |
      words = input().split()
      longest = sorted(words, key=len, reverse=True)[:3]
      print(" ".join(longest))
    solution_explanation: "key=len задаёт признак сравнения, reverse=True — порядок, стабильность сортировки сохраняет исходный порядок слов одинаковой длины, срез берёт top-3."
    tests:
      - name: "Пример"
        stdin: "я учу машинное обучение и нейросети\n"
        stdout: "нейросети машинное обучение"
      - name: "Меньше трёх слов"
        stdin: "кот пёсик\n"
        stdout: "пёсик кот"
      - name: "Равные длины — порядок появления"
        stdin: "aa bb cc dd\n"
        stdout: "aa bb cc"
      - name: "Повторы"
        stdin: "длинное длинное а\n"
        stdout: "длинное длинное а"
      - name: "Пусто"
        stdin: "\n"
        stdout: ""

  - id: t4
    title: "Медиана"
    difficulty: 3
    statement: |
      Программа читает строку чисел (дробных, хотя бы одно). Выведите:

      ```text
      Исходные: <числа в исходном порядке через пробел, как были введены>
      Медиана: <медиана>
      ```

      Медиана — средний элемент отсортированного списка; для чётного количества — среднее двух средних.
    examples:
      - input: "5 1 9 3"
        output: "Исходные: 5 1 9 3\nМедиана: 4.0"
    starter: |
      texts = input().split()
      numbers = []
      for t in texts:
          numbers.append(float(t))
      numbers.sort()
    hints:
      - "Не портите исходный порядок: используйте `ordered = sorted(numbers)`."
      - "n = len; при нечётном n — `ordered[n // 2]`, при чётном — среднее `ordered[n // 2 - 1]` и `ordered[n // 2]`."
    solution: |
      texts = input().split()
      numbers = []
      for t in texts:
          numbers.append(float(t))
      ordered = sorted(numbers)
      n = len(ordered)
      if n % 2 == 1:
          median = ordered[n // 2]
      else:
          median = (ordered[n // 2 - 1] + ordered[n // 2]) / 2
      print("Исходные:", " ".join(texts))
      print("Медиана:", median)
    solution_explanation: "sorted создаёт отсортированную копию, исходные данные не меняются. Медиана устойчивее среднего к выбросам — её часто используют в анализе данных (блок 3.3)."
    tests:
      - name: "Чётное количество"
        stdin: "5 1 9 3\n"
        stdout: "Исходные: 5 1 9 3\nМедиана: 4.0"
      - name: "Нечётное"
        stdin: "7 2 5\n"
        stdout: "Исходные: 7 2 5\nМедиана: 5.0"
      - name: "Одно число"
        stdin: "42\n"
        stdout: "Исходные: 42\nМедиана: 42.0"
      - name: "С выбросом"
        stdin: "1 2 3 1000\n"
        stdout: "Исходные: 1 2 3 1000\nМедиана: 2.5"
      - name: "Отрицательные"
        stdin: "-5 -1 -3\n"
        stdout: "Исходные: -5 -1 -3\nМедиана: -3.0"
