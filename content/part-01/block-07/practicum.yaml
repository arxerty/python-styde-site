  - id: t5
    title: "Конвертер CSV → JSON"
    mini_project: true
    difficulty: 3
    statement: |
      **Мини-проект.** Напишите конвертер CSV-файлов в JSON с обработкой ошибок.

      Создайте исключение `ConverterError` и функцию:

      ```python
      convert(csv_path, json_path, *, delimiter=",", types=None)
      ```

      1. Прочитать CSV (UTF-8) через `csv.DictReader` с заданным разделителем. Если файла нет — `ConverterError` с именем файла.
      2. `types` — словарь `столбец → "int" | "float" | "bool" | "str"` (по умолчанию все `str`). Если в `types` указан столбец, которого нет в заголовке, — `ConverterError` с именем столбца.
      3. Преобразование значения:
         - пустая строка (после strip) → `None` для любого типа;
         - `"int"` / `"float"` — числа (для float допускается десятичная запятая);
         - `"bool"` — `true/yes/1/да` → `True`, `false/no/0/нет` → `False` (без учёта регистра), иное — ошибка;
         - `"str"` — строка без пробелов по краям.
      4. Строки, в которых хотя бы одно значение не преобразуется, **пропускаются**; их номера в файле (заголовок — строка 1) собираются.
      5. Записать в `json_path` список объектов (UTF-8, `ensure_ascii=False`, `indent=2`).
      6. Вернуть отчёт: `{"rows": <записано>, "skipped": [номера строк], "columns": [имена столбцов]}`.
    examples:
      - input: "convert(\"people.csv\", \"people.json\", types={\"age\": \"int\", \"active\": \"bool\"})"
        output: "{'rows': 2, 'skipped': [3], 'columns': ['name', 'age', 'active']}"
    files:
      people.csv: "name,age,active\nАда,36,да\nАлан,сорок,нет\nГрейс,,yes\n"
      prices.csv: "товар;цена;в наличии\nКофе;199,90;1\nЧай;89,5;0\n"
    starter: |
      import csv
      import json


      def convert(csv_path, json_path, *, delimiter=",", types=None):
          with open(csv_path) as f:
              rows = list(csv.DictReader(f))
          with open(json_path, "w") as f:
              json.dump(rows, f)
    hints:
      - "Разбейте задачу на функции: `convert_value(text, kind)` (бросает ValueError при неудаче) и основная `convert`. Таблица конвертеров — словарь `{\"int\": ..., \"float\": ..., \"bool\": ..., \"str\": ...}`."
      - "Номер строки файла: `enumerate(reader, start=2)`. Проверку столбцов из types делайте после чтения заголовка (`reader.fieldnames`)."
    solution: |
      """Конвертер CSV → JSON с приведением типов и отчётом об ошибках."""
      import csv
      import json

      TRUE_WORDS = {"true", "yes", "1", "да"}
      FALSE_WORDS = {"false", "no", "0", "нет"}


      class ConverterError(Exception):
          """Ошибка конвертации, при которой результат получить нельзя."""


      def to_bool(text):
          """Преобразовать слово в bool или бросить ValueError."""
          word = text.lower()
          if word in TRUE_WORDS:
              return True
          if word in FALSE_WORDS:
              return False
          raise ValueError(f"не логическое значение: {text!r}")


      CONVERTERS = {
          "int": int,
          "float": lambda text: float(text.replace(",", ".")),
          "bool": to_bool,
          "str": str,
      }


      def convert_value(text, kind):
          """Преобразовать значение ячейки в нужный тип; пустое — None."""
          text = (text or "").strip()
          if not text:
              return None
          return CONVERTERS[kind](text)


      def convert(csv_path, json_path, *, delimiter=",", types=None):
          """Конвертировать CSV в JSON и вернуть отчёт о результате."""
          types = types or {}
          try:
              file = open(csv_path, encoding="utf-8", newline="")
          except FileNotFoundError as error:
              raise ConverterError(f"файл не найден: {csv_path}") from error
          with file:
              reader = csv.DictReader(file, delimiter=delimiter)
              columns = reader.fieldnames or []
              for column in types:
                  if column not in columns:
                      raise ConverterError(f"столбца нет в файле: {column}")
              records = []
              skipped = []
              for line_number, row in enumerate(reader, start=2):
                  try:
                      record = {
                          column: convert_value(row[column], types.get(column, "str"))
                          for column in columns
                      }
                  except ValueError:
                      skipped.append(line_number)
                      continue
                  records.append(record)
          with open(json_path, "w", encoding="utf-8") as out:
              json.dump(records, out, ensure_ascii=False, indent=2)
          return {"rows": len(records), "skipped": skipped, "columns": list(columns)}
    solution_explanation: |
      Решение собрано из инструментов всего блока:

      - **Своё исключение** `ConverterError` — для ошибок, после которых результат невозможен (нет файла, неверная схема). Причина сохраняется через `raise ... from`.
      - **Пропуск плохих строк** — ошибки отдельных ячеек не роняют конвертацию: `ValueError` перехватывается на уровне строки, номер строки попадает в отчёт.
      - **Таблица конвертеров** — словарь функций (урок про lambda): добавить новый тип = добавить строку в словарь.
      - **CSV и JSON** — `DictReader` с настраиваемым разделителем, `json.dump` с `ensure_ascii=False` и `indent=2`.
      - **Файлы** — `with` гарантирует закрытие; файл открыт до блока with, чтобы отличить «нет файла» от прочих ошибок.

      Отчёт с номерами пропущенных строк — важная часть: данные не теряются молча. Именно такие конвертеры пишут первыми при подготовке данных для обучения моделей.
    tests:
      - name: "Пример: типы и пропуск"
        code: |
          import json
          report = convert("people.csv", "people.json", types={"age": "int", "active": "bool"})
          assert report == {"rows": 2, "skipped": [3], "columns": ["name", "age", "active"]}, report
          with open("people.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data == [{"name": "Ада", "age": 36, "active": True}, {"name": "Грейс", "age": None, "active": True}], data
      - name: "Разделитель и десятичная запятая"
        code: |
          import json
          report = convert("prices.csv", "prices.json", delimiter=";", types={"цена": "float", "в наличии": "bool"})
          with open("prices.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data == [{"товар": "Кофе", "цена": 199.9, "в наличии": True}, {"товар": "Чай", "цена": 89.5, "в наличии": False}], data
          assert report["rows"] == 2 and report["skipped"] == []
      - name: "Нет файла"
        code: |
          try:
              convert("missing.csv", "out.json")
          except ConverterError as error:
              assert "missing.csv" in str(error)
          else:
              raise AssertionError("Ожидался ConverterError")
      - name: "Неизвестный столбец в types"
        code: |
          try:
              convert("people.csv", "out.json", types={"salary": "int"})
          except ConverterError as error:
              assert "salary" in str(error)
          else:
              raise AssertionError("Ожидался ConverterError")
      - name: "Без types — всё строки"
        code: |
          import json
          convert("people.csv", "s.json")
          with open("s.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data[1] == {"name": "Алан", "age": "сорок", "active": "нет"}
      - name: "Кириллица и отступы в файле"
        code: |
          convert("people.csv", "pretty.json", types={"age": "int"})
          with open("pretty.json", encoding="utf-8") as f:
              raw = f.read()
          assert "Ада" in raw and '\n  {' in raw, "Нужны ensure_ascii=False и indent=2"
      - name: "Неверное логическое значение"
        code: |
          with open("b.csv", "w", encoding="utf-8") as f:
              f.write("flag\nда\nможет быть\n")
          report = convert("b.csv", "b.json", types={"flag": "bool"})
          assert report["rows"] == 1 and report["skipped"] == [3]
