questions:
  - id: q1
    type: single
    prompt: "Зачем нужно виртуальное окружение?"
    options:
      - text: "Чтобы у каждого проекта был свой изолированный набор пакетов и версии разных проектов не конфликтовали"
        correct: true
        why: "Каждое окружение — своя папка site-packages."
      - text: "Чтобы Python работал быстрее"
        why: "На скорость выполнения не влияет."
      - text: "Чтобы запускать Python без интернета"
        why: "Не связано с сетью."
      - text: "Чтобы защитить код от просмотра"
        why: "Окружение не шифрует и не скрывает код."
    explanation: "Одно окружение на проект — стандартная практика."

  - id: q2
    type: single
    prompt: "Почему рекомендуется `python -m pip install пакет`, а не просто `pip install пакет`?"
    options:
      - text: "Так пакет гарантированно установится для того интерпретатора, которым запускается python"
        correct: true
        why: "Команда pip может относиться к другой версии Python."
      - text: "Так установка быстрее"
        why: "Скорость та же."
      - text: "pip без python -m не умеет ставить пакеты"
        why: "Умеет, но может ставить «не туда»."
      - text: "Так пакет ставится сразу во все окружения"
        why: "Наоборот — в одно, соответствующее python."
    explanation: "Это избавляет от ошибки «установил, а import не работает»."

  - id: q3
    type: multiple
    prompt: "Какие практики правильные? Выберите все."
    options:
      - text: "Добавить `.venv/` в `.gitignore`"
        correct: true
        why: "Окружение воссоздаётся из списка зависимостей."
      - text: "Закреплять версии зависимостей в продакшне"
        correct: true
        why: "Обновление не должно случаться без вашего ведома."
      - text: "Проверять точное имя пакета перед установкой"
        correct: true
        why: "Защита от пакетов-подделок с похожими именами."
      - text: "Ставить пакеты через sudo в системный Python"
        why: "Опасно и ломает системные инструменты."
    explanation: "Изоляция, воспроизводимость и осторожность с чужим кодом."

  - id: q4
    type: output
    prompt: "Что выведет код (сравнение версий строками)?"
    code: |
      print("1.10.0" > "1.9.3", (1, 10, 0) > (1, 9, 3))
    options:
      - text: "`False True`"
        correct: true
        why: "Строки сравниваются посимвольно: «1» < «9». Кортежи чисел — поэлементно: 10 > 9."
      - text: "`True True`"
        why: "Строковое сравнение даёт неверный результат для версий."
      - text: "`False False`"
        why: "Кортежи чисел сравниваются корректно."
    explanation: "Версии нужно разбирать в числа: tuple(int(x) for x in v.split(\".\"))."

  - id: q5
    type: single
    prompt: "Что означает строка `torch~=2.4.0` в requirements.txt?"
    options:
      - text: "Совместимая версия: не ниже 2.4.0 и ниже 2.5"
        correct: true
        why: "~= — «совместимый релиз»."
      - text: "Ровно 2.4.0"
        why: "Это ==."
      - text: "Любая версия, кроме 2.4.0"
        why: "Это !=."
      - text: "Примерно 2.4, на усмотрение pip"
        why: "Правило строгое: ≥ 2.4.0 и < 2.5."
    explanation: "== — точно, >= — минимум, ~= — совместимый диапазон."

  - id: q6
    type: output
    prompt: "Что выведет код?"
    code: |
      line = "pandas==2.2.3"
      name, version = line.split("==")
      print(name, tuple(int(x) for x in version.split(".")))
    answer: "pandas (2, 2, 3)"
    explanation: "Строку версии превращают в кортеж чисел — так её можно правильно сравнивать."

tasks:
  - id: t1
    title: "Разбор строки зависимости"
    difficulty: 1
    statement: |
      Напишите `parse_requirement(line)`: вернуть кортеж `(имя в нижнем регистре, спецификатор)` для строки requirements.txt. Спецификатор — часть, начиная с первого из символов `=<>~!` (или `""`, если версия не указана). Пустые строки и комментарии (`#`) — вернуть `None`. Пробелы по краям игнорировать.
    examples:
      - input: "parse_requirement(\"NumPy==2.1.3\")"
        output: "('numpy', '==2.1.3')"
      - input: "parse_requirement(\"pytest\")"
        output: "('pytest', '')"
    starter: |
      def parse_requirement(line):
          name, version = line.split("==")
          return name, version
    hints:
      - "Найдите позицию первого символа спецификатора: перебирайте символы с enumerate, пока `char in \"=<>~!\"`."
      - "Имя — `line[:pos].strip().lower()`, спецификатор — `line[pos:].strip()`."
    solution: |
      def parse_requirement(line):
          """Разобрать строку requirements.txt в (имя, спецификатор) или None."""
          line = line.strip()
          if not line or line.startswith("#"):
              return None
          for position, char in enumerate(line):
              if char in "=<>~!":
                  return line[:position].strip().lower(), line[position:].strip()
          return line.lower(), ""
    solution_explanation: "Поиск первого символа-оператора отделяет имя от спецификатора любого вида (==, >=, ~=, !=). Имена пакетов не чувствительны к регистру, поэтому нормализуются."
    tests:
      - name: "Закреплённая версия"
        call: "parse_requirement(\"NumPy==2.1.3\")"
        expected: "('numpy', '==2.1.3')"
      - name: "Без версии"
        call: "parse_requirement(\"pytest\")"
        expected: "('pytest', '')"
      - name: "Диапазон с пробелами"
        call: "parse_requirement(\"  pandas >= 2.0, <3.0 \")"
        expected: "('pandas', '>= 2.0, <3.0')"
      - name: "Совместимая версия"
        call: "parse_requirement(\"torch~=2.4.0\")"
        expected: "('torch', '~=2.4.0')"
      - name: "Комментарий и пустая строка"
        call: "(parse_requirement(\"# тесты\"), parse_requirement(\"   \"))"
        expected: "(None, None)"

  - id: t2
    title: "Сравнение версий"
    difficulty: 2
    statement: |
      Напишите `compare_versions(a, b)` для версий вида `1.10.2`: вернуть `-1`, если `a` старше (меньше) `b`, `0` — если равны, `1` — если `a` новее. Недостающие части считаются нулями (`1.2` == `1.2.0`).
    examples:
      - input: "compare_versions(\"1.10.0\", \"1.9.3\")"
        output: "1"
    starter: |
      def compare_versions(a, b):
          if a > b:
              return 1
          if a < b:
              return -1
          return 0
    hints:
      - "Превратите версии в списки чисел: `[int(x) for x in a.split(\".\")]`."
      - "Дополните более короткий список нулями до одинаковой длины и сравните списки целиком."
    solution: |
      def compare_versions(a, b):
          """Сравнить версии: −1 если a < b, 0 если равны, 1 если a > b."""
          parts_a = [int(x) for x in a.split(".")]
          parts_b = [int(x) for x in b.split(".")]
          length = max(len(parts_a), len(parts_b))
          parts_a += [0] * (length - len(parts_a))
          parts_b += [0] * (length - len(parts_b))
          if parts_a < parts_b:
              return -1
          if parts_a > parts_b:
              return 1
          return 0
    solution_explanation: "Строки сравниваются посимвольно и ошибаются на «1.10» vs «1.9»; списки чисел — поэлементно и правильно. Дополнение нулями уравнивает «1.2» и «1.2.0»."
    tests:
      - name: "Двузначный минор"
        call: "compare_versions(\"1.10.0\", \"1.9.3\")"
        expected: "1"
      - name: "Равные с разной длиной"
        call: "compare_versions(\"1.2\", \"1.2.0\")"
        expected: "0"
      - name: "Старше"
        call: "compare_versions(\"2.0.1\", \"2.1\")"
        expected: "-1"
      - name: "Мажор"
        call: "compare_versions(\"10.0\", \"9.99.99\")"
        expected: "1"
      - name: "Одинаковые"
        call: "compare_versions(\"3.12.4\", \"3.12.4\")"
        expected: "0"

  - id: t3
    title: "Разбор pip freeze"
    difficulty: 2
    statement: |
      Напишите `parse_freeze(text)`: из вывода `pip freeze` (строки `имя==версия`) построить словарь `имя в нижнем регистре → версия`. Строки другого вида (пустые, комментарии, `-e ...`, ссылки `@`) пропускать.
    examples:
      - input: "parse_freeze(\"NumPy==2.1.3\\npandas==2.2.3\\n-e git+https://x\\n\")"
        output: "{'numpy': '2.1.3', 'pandas': '2.2.3'}"
    starter: |
      def parse_freeze(text):
          return dict(line.split("==") for line in text.splitlines())
    hints:
      - "Перебирайте строки, обрабатывайте только те, где есть ровно один разделитель `==`."
      - "`if line.count(\"==\") != 1: continue`, затем `name, version = line.split(\"==\")`."
    solution: |
      def parse_freeze(text):
          """Разобрать вывод pip freeze в словарь имя → версия."""
          packages = {}
          for line in text.splitlines():
              line = line.strip()
              if line.count("==") != 1:
                  continue
              name, version = line.split("==")
              if name and version:
                  packages[name.strip().lower()] = version.strip()
          return packages
    solution_explanation: "Фильтр по количеству разделителей отсекает пустые строки, комментарии и установки из git; нормализация имени делает сравнение надёжным."
    tests:
      - name: "Пример"
        call: "parse_freeze(\"NumPy==2.1.3\\npandas==2.2.3\\n-e git+https://x\\n\")"
        expected: "{'numpy': '2.1.3', 'pandas': '2.2.3'}"
      - name: "Пусто"
        call: "parse_freeze(\"\")"
        expected: "{}"
      - name: "Ссылки и комментарии"
        call: "parse_freeze(\"# comment\\nmypkg @ file:///tmp/x\\nrequests==2.32.3\")"
        expected: "{'requests': '2.32.3'}"
      - name: "Пробелы"
        call: "parse_freeze(\"  torch==2.4.1  \\n\")"
        expected: "{'torch': '2.4.1'}"
      - name: "Повтор — последний"
        call: "parse_freeze(\"a==1\\na==2\")"
        expected: "{'a': '2'}"

  - id: t4
    title: "Устаревшие пакеты"
    difficulty: 3
    statement: |
      Напишите `find_outdated(installed, latest)`: оба аргумента — словари `пакет → версия`. Вернуть отсортированный по имени список строк `<пакет>: <установленная> → <последняя>` для пакетов, у которых установленная версия **строго старше** последней. Пакеты, которых нет в `latest`, пропустить. Сравнение — по числовым частям (как в задаче 2; напишите вспомогательную функцию).
    examples:
      - input: "find_outdated({\"numpy\": \"1.26.4\", \"pandas\": \"2.2.3\"}, {\"numpy\": \"2.1.3\", \"pandas\": \"2.2.3\"})"
        output: "['numpy: 1.26.4 → 2.1.3']"
    starter: |
      def find_outdated(installed, latest):
          return [name for name in installed if installed[name] < latest[name]]
    hints:
      - "Вспомогательная функция: `def version_key(v): return tuple(int(x) for x in v.split(\".\"))` — но учтите разную длину (дополните нулями до 3–4 частей или сравнивайте как в задаче 2)."
      - "`for name in sorted(installed): if name in latest and ...`."
    solution: |
      def version_parts(version, length=4):
          """Превратить строку версии в кортеж чисел фиксированной длины."""
          parts = [int(x) for x in version.split(".")]
          return tuple(parts + [0] * (length - len(parts)))


      def find_outdated(installed, latest):
          """Вернуть описания пакетов, для которых есть более новая версия."""
          result = []
          for name in sorted(installed):
              if name not in latest:
                  continue
              current, newest = installed[name], latest[name]
              if version_parts(current) < version_parts(newest):
                  result.append(f"{name}: {current} → {newest}")
          return result
    solution_explanation: "Вспомогательная функция превращает версию в кортеж чисел одинаковой длины — кортежи сравниваются поэлементно. Разбиение на маленькие функции делает решение понятным и проверяемым."
    tests:
      - name: "Пример"
        call: "find_outdated({\"numpy\": \"1.26.4\", \"pandas\": \"2.2.3\"}, {\"numpy\": \"2.1.3\", \"pandas\": \"2.2.3\"})"
        expected: "['numpy: 1.26.4 → 2.1.3']"
      - name: "Строковое сравнение ошиблось бы"
        call: "find_outdated({\"lib\": \"1.9.0\"}, {\"lib\": \"1.10.0\"})"
        expected: "['lib: 1.9.0 → 1.10.0']"
      - name: "Установлена более новая"
        call: "find_outdated({\"lib\": \"3.0\"}, {\"lib\": \"2.9.9\"})"
        expected: "[]"
      - name: "Нет в latest"
        call: "find_outdated({\"local\": \"0.1\"}, {})"
        expected: "[]"
      - name: "Сортировка по имени"
        call: "find_outdated({\"b\": \"1\", \"a\": \"1\"}, {\"a\": \"2\", \"b\": \"1.0.1\"})"
        expected: "['a: 1 → 2', 'b: 1 → 1.0.1']"
